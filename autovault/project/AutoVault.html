<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AutoVault — The skill registry with a gate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  :root {
    --bg: #0b1014;
    --bg-2: #0f161c;
    --panel: #131c24;
    --panel-2: #18222b;
    --line: #1f2c37;
    --line-2: #283744;
    --ink: #e6edf3;
    --ink-2: #aab8c5;
    --ink-3: #6e8090;
    --ink-4: #4a5b6b;
    --accent: #5ad6c0;          /* precision teal-cyan */
    --accent-ink: #062821;
    --accent-soft: rgba(90,214,192,0.12);
    --warn: #e8a866;
    --bad: #d97171;
    --good: #5ad6c0;
    --radius: 6px;
    --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
    --sans: "Inter", -apple-system, system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body { font-size: 15px; line-height: 1.55; font-feature-settings: "ss01","cv11"; }

  ::selection { background: var(--accent); color: var(--accent-ink); }

  a { color: inherit; text-decoration: none; }

  /* ============================================================ */
  /* TOPBAR                                                        */
  /* ============================================================ */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(14px);
    background: rgba(11,16,20,0.78);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 1240px; margin: 0 auto;
    padding: 14px 32px;
    display: flex; align-items: center; gap: 32px;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 600; letter-spacing: -0.01em; font-size: 15px;
  }
  .brand-mark {
    width: 22px; height: 22px;
    display: inline-grid; place-items: center;
  }
  .brand-mark svg { display: block; }
  .brand-name { display: flex; align-items: baseline; gap: 1px; }
  .brand-name .auto { color: var(--ink-2); font-weight: 500; }
  .brand-name .vault { color: var(--ink); font-weight: 600; }

  .nav { display: flex; align-items: center; gap: 4px; flex: 1; }
  .nav button {
    background: none; border: 0; color: var(--ink-2);
    font: inherit; font-size: 13.5px; padding: 6px 12px; border-radius: 4px;
    cursor: pointer; letter-spacing: 0.01em;
    transition: color 120ms, background 120ms;
  }
  .nav button:hover { color: var(--ink); }
  .nav button.active { color: var(--ink); background: var(--panel); }

  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    background: none; border: 1px solid var(--line); color: var(--ink-2);
    width: 32px; height: 32px; border-radius: 4px;
    display: grid; place-items: center; cursor: pointer;
    transition: all 120ms;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--line-2); }
  .pill-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 14px; border-radius: 4px;
    font: inherit; font-size: 13px; font-weight: 500;
    border: 1px solid var(--line-2); background: var(--panel);
    color: var(--ink); cursor: pointer;
    transition: all 120ms;
  }
  .pill-btn:hover { background: var(--panel-2); border-color: var(--ink-4); }
  .pill-btn.primary {
    background: var(--accent); color: var(--accent-ink);
    border-color: var(--accent);
    font-weight: 600;
  }
  .pill-btn.primary:hover { filter: brightness(1.06); }

  /* status dot */
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 10px var(--accent);
    display: inline-block;
  }

  /* ============================================================ */
  /* PAGE LAYOUT                                                   */
  /* ============================================================ */
  .page { max-width: 1240px; margin: 0 auto; padding: 0 32px; }

  .section { padding: 96px 0; border-top: 1px solid var(--line); position: relative; }
  .section:first-of-type { border-top: 0; }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase;
  }
  .eyebrow .dash { width: 18px; height: 1px; background: var(--ink-4); }

  h1, h2, h3, h4 { font-weight: 500; letter-spacing: -0.025em; margin: 0; }
  h1 { font-size: 64px; line-height: 1.02; letter-spacing: -0.035em; }
  h2 { font-size: 38px; line-height: 1.08; letter-spacing: -0.03em; }
  h3 { font-size: 20px; line-height: 1.3; letter-spacing: -0.015em; }
  h4 { font-size: 14px; line-height: 1.3; }

  .lede { color: var(--ink-2); font-size: 18px; line-height: 1.55; max-width: 640px; }

  .ital { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: -0.01em; }

  /* ============================================================ */
  /* HERO                                                          */
  /* ============================================================ */
  .hero { padding-top: 80px; padding-bottom: 48px; position: relative; overflow: hidden; }
  .hero-grid {
    display: grid; grid-template-columns: 1.1fr 1fr; gap: 64px; align-items: center;
  }
  .hero-tag {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 6px 12px 6px 8px; border-radius: 100px;
    background: var(--panel); border: 1px solid var(--line);
    font-family: var(--mono); font-size: 11.5px; color: var(--ink-2);
    margin-bottom: 28px;
  }
  .hero-tag .badge {
    background: var(--accent-soft); color: var(--accent);
    padding: 2px 8px; border-radius: 100px; font-weight: 600;
    letter-spacing: 0.04em;
  }
  .hero h1 .ital { color: var(--ink); }
  .hero h1 .accent { color: var(--accent); }
  .hero-sub { color: var(--ink-2); font-size: 18px; line-height: 1.5; max-width: 540px; margin: 28px 0 0; }

  /* install command card */
  .install {
    margin-top: 40px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    max-width: 540px;
  }
  .install-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    background: var(--bg-2);
    font-family: var(--mono); font-size: 11.5px; color: var(--ink-3);
  }
  .install-head .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); }
  .install-head .dot.live { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .install-head .label { margin-left: auto; }
  .install-body {
    display: flex; align-items: center; gap: 12px;
    padding: 18px 20px;
    font-family: var(--mono); font-size: 14px;
  }
  .install-body .prompt { color: var(--ink-3); user-select: none; }
  .install-body .cmd { color: var(--ink); flex: 1; }
  .install-body .cmd .pipe { color: var(--ink-3); }
  .install-body .cmd .arg { color: var(--accent); }
  .copy-btn {
    background: none; border: 1px solid var(--line-2); color: var(--ink-2);
    font: inherit; font-family: var(--mono); font-size: 11px;
    padding: 5px 10px; border-radius: 4px; cursor: pointer;
    transition: all 120ms; letter-spacing: 0.04em; text-transform: uppercase;
  }
  .copy-btn:hover { color: var(--ink); border-color: var(--ink-4); }
  .copy-btn.copied { color: var(--accent); border-color: var(--accent); }

  .hero-meta {
    display: flex; gap: 24px; margin-top: 28px;
    color: var(--ink-3); font-family: var(--mono); font-size: 11.5px;
    letter-spacing: 0.04em;
  }
  .hero-meta span { display: inline-flex; align-items: center; gap: 7px; }
  .hero-meta .check {
    width: 12px; height: 12px; color: var(--accent);
  }

  /* ============================================================ */
  /* GATE DIAGRAM (right column of hero)                           */
  /* ============================================================ */
  .gate-stage {
    position: relative;
    aspect-ratio: 1 / 1;
    background:
      radial-gradient(circle at 50% 50%, rgba(90,214,192,0.06), transparent 60%),
      var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  .gate-stage::before {
    /* subtle grid */
    content: "";
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.35;
    mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 75%);
  }
  .gate-stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  .gate-vault-mark .vault-dial {
    transform-box: view-box;
    transform-origin: 12px 10.8px;
    animation: gate-vault-dial 3.1s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
  }
  .gate-vault-mark .vault-depth {
    opacity: 0;
    animation: gate-vault-depth 3.1s ease infinite;
  }
  @keyframes gate-vault-dial {
    0%, 28%, 100% { opacity: 1; transform: scale(1); }
    44%, 62% { opacity: 0; transform: scale(0); }
    78% { opacity: 1; transform: scale(1.06); }
  }
  @keyframes gate-vault-depth {
    0%, 24%, 76%, 100% { opacity: 0; }
    44%, 62% { opacity: 0.35; }
  }

  .gate-label {
    position: absolute; font-family: var(--mono); font-size: 10.5px;
    color: var(--ink-3); letter-spacing: 0.05em; text-transform: uppercase;
    background: var(--bg); padding: 3px 8px; border: 1px solid var(--line);
    border-radius: 3px;
  }
  .gate-label.l { left: 16px; top: 50%; transform: translateY(-50%); }
  .gate-label.r { right: 16px; top: 50%; transform: translateY(-50%); }

  /* ============================================================ */
  /* PROBLEM STRIP                                                 */
  /* ============================================================ */
  .problems {
    display: grid; grid-template-columns: repeat(3, 1fr);
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    background: var(--panel);
  }
  .problem {
    padding: 28px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  }
  .problem:nth-child(3n) { border-right: 0; }
  .problem:nth-last-child(-n+3) { border-bottom: 0; }
  .problem .num {
    font-family: var(--mono); font-size: 11px; color: var(--ink-3);
    letter-spacing: 0.04em; margin-bottom: 12px;
  }
  .problem h3 { margin-bottom: 10px; }
  .problem p { margin: 0; color: var(--ink-2); font-size: 14px; line-height: 1.55; }
  .problem .badge {
    display: inline-block; margin-top: 14px;
    font-family: var(--mono); font-size: 10.5px; color: var(--bad);
    background: rgba(217,113,113,0.08); padding: 3px 8px; border-radius: 3px;
    letter-spacing: 0.04em;
  }

  /* ============================================================ */
  /* TRANSFORMATION DIAGRAM                                        */
  /* ============================================================ */
  .xform-wrap {
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg-2) 100%);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 40px;
    margin-top: 40px;
    position: relative;
  }
  .xform-wrap::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    border-radius: 14px;
    background:
      radial-gradient(ellipse 600px 200px at 50% 0%, rgba(90,214,192,0.05), transparent 70%);
  }

  .xform-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    margin-bottom: 36px; gap: 24px;
  }
  .xform-head h3 { font-size: 22px; }
  .xform-head p { margin: 8px 0 0; color: var(--ink-2); font-size: 14px; max-width: 480px; }

  .xform-toggle {
    display: inline-flex; padding: 3px; gap: 0;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  }
  .xform-toggle button {
    background: none; border: 0; color: var(--ink-3);
    font: inherit; font-size: 12px; font-weight: 500;
    padding: 6px 12px; border-radius: 4px; cursor: pointer;
    transition: all 120ms; display: flex; align-items: center; gap: 6px;
  }
  .xform-toggle button.active { color: var(--ink); background: var(--panel); }
  .xform-toggle button .swatch {
    width: 8px; height: 8px; border-radius: 2px;
  }

  .xform-stage {
    display: grid;
    grid-template-columns: 1fr 80px 1fr 80px 1fr;
    gap: 0; align-items: stretch;
    position: relative;
  }
  .xform-stage > svg.flow {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none;
  }

  .xform-col { position: relative; z-index: 1; }
  .xform-col-head {
    font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
    letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .xform-col-head .num {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--panel); border: 1px solid var(--line);
    display: grid; place-items: center; font-size: 10px; color: var(--ink-2);
  }
  .xform-spacer { display: block; }

  .skill-card {
    background: var(--bg);
    border: 1px solid var(--line-2);
    border-radius: 8px;
    overflow: hidden;
  }
  .skill-card-head {
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    background: var(--bg-2);
    display: flex; align-items: center; gap: 10px;
  }
  .skill-card-head .file {
    font-family: var(--mono); font-size: 12px; color: var(--ink-2);
  }
  .skill-card-head .file .ext { color: var(--ink-3); }
  .skill-card-head .verified {
    margin-left: auto; display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--mono); font-size: 10px; color: var(--accent);
    background: var(--accent-soft); padding: 2px 7px; border-radius: 3px;
    letter-spacing: 0.04em;
  }
  .skill-card-body { padding: 14px 16px; font-family: var(--mono); font-size: 12px; line-height: 1.65; }
  .skill-card-body .yaml-key { color: var(--ink-2); }
  .skill-card-body .yaml-val { color: var(--accent); }
  .skill-card-body .yaml-str { color: var(--ink); }
  .skill-card-body .yaml-comment { color: var(--ink-4); }
  .skill-card-body .yaml-list { color: var(--ink-2); }
  .skill-card-body .highlight {
    background: rgba(90,214,192,0.10);
    border-left: 2px solid var(--accent);
    margin: 4px -16px; padding: 2px 14px;
    transition: background 200ms;
  }
  .skill-card-body .strike { color: var(--ink-4); text-decoration: line-through; text-decoration-color: var(--ink-4); }

  .xform-engine {
    align-self: center;
    display: grid; place-items: center;
    height: 120px;
    position: relative;
  }
  .xform-engine .ring {
    width: 56px; height: 56px; border-radius: 50%;
    border: 1px solid var(--line-2);
    display: grid; place-items: center;
    background: var(--panel);
    position: relative;
    transition: border-color 220ms ease, box-shadow 220ms ease;
  }
  .xform-engine .ring::before {
    content: ""; position: absolute; inset: -6px; border-radius: 50%;
    border: 1px dashed var(--line);
    animation: spin 12s linear infinite;
  }
  .xform-engine .ring.is-unlocking {
    border-color: color-mix(in srgb, var(--accent) 70%, var(--line-2));
    box-shadow: 0 0 28px rgba(90,214,192,0.12);
  }
  .xform-engine .ring.is-unlocking::before {
    border-color: rgba(90,214,192,0.3);
    animation-duration: 3s;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .platforms { display: grid; gap: 10px; }
  .platform {
    background: var(--bg);
    border: 1px solid var(--line-2);
    border-radius: 6px;
    padding: 10px 14px;
    display: flex; align-items: center; gap: 12px;
    font-family: var(--mono); font-size: 12px;
    transition: border-color 200ms, transform 200ms;
  }
  .platform.active { border-color: var(--accent); }
  .platform-mark {
    width: 22px; height: 22px; border-radius: 4px;
    display: grid; place-items: center;
    font-weight: 600; font-size: 11px;
    background: var(--panel); color: var(--ink-2);
    border: 1px solid var(--line);
  }
  .platform.active .platform-mark { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .platform .name { color: var(--ink); font-weight: 500; }
  .platform .tool { color: var(--ink-3); margin-left: auto; }
  .platform.active .tool { color: var(--accent); }

  .rendered-tool {
    background: var(--bg);
    border: 1px solid var(--line-2);
    border-radius: 8px;
    overflow: hidden;
  }
  .rendered-tool .rt-head {
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    background: var(--bg-2);
    font-family: var(--mono); font-size: 11px; color: var(--ink-3);
    letter-spacing: 0.04em; display: flex; align-items: center; gap: 8px;
  }
  .rendered-tool .rt-head .agent {
    color: var(--ink); text-transform: none; letter-spacing: 0;
  }
  .rendered-tool .rt-body {
    padding: 14px 16px; font-family: var(--mono); font-size: 12px; line-height: 1.7;
  }
  .rendered-tool .rt-body .key { color: var(--ink-3); }
  .rendered-tool .rt-body .val { color: var(--accent); }
  .rendered-tool .rt-body .row { display: flex; justify-content: space-between; gap: 14px; }
  .rendered-tool .rt-body .row + .row { margin-top: 4px; }

  .xform-footnote {
    margin-top: 32px; padding-top: 28px;
    border-top: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
  }
  .xform-footnote .item .lbl {
    font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
    letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px;
  }
  .xform-footnote .item .val { font-size: 14px; color: var(--ink-2); }
  .xform-footnote .item .val strong { color: var(--ink); font-weight: 500; }

  /* ============================================================ */
  /* VALIDATION GATE                                                */
  /* ============================================================ */
  .gate-section {
    display: grid; grid-template-columns: 1.05fr 1fr; gap: 64px; align-items: center;
  }
  .gate-pipeline {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 32px;
  }
  .gate-track {
    display: grid; gap: 12px;
    position: relative;
  }
  .gate-step {
    display: grid; grid-template-columns: 32px 1fr auto; gap: 16px;
    align-items: center;
    padding: 14px 16px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    position: relative;
    transition: border-color 200ms, transform 200ms;
  }
  .gate-step.active { border-color: var(--accent); }
  .gate-step .num {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--panel); color: var(--ink-3);
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    display: grid; place-items: center;
    border: 1px solid var(--line-2);
    transition: all 200ms;
  }
  .gate-step.active .num { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .gate-step.done .num { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .gate-step .title { font-size: 14px; font-weight: 500; }
  .gate-step .desc { font-size: 12.5px; color: var(--ink-3); }
  .gate-step .status {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em;
    color: var(--ink-3); text-transform: uppercase;
  }
  .gate-step.active .status { color: var(--accent); }
  .gate-step.done .status { color: var(--accent); opacity: 0.6; }

  .gate-input, .gate-output {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    border-radius: 8px;
    font-family: var(--mono); font-size: 12px;
  }
  .gate-input {
    background: rgba(217,113,113,0.06);
    border: 1px dashed rgba(217,113,113,0.3);
    color: var(--ink-2);
    margin-bottom: 12px;
  }
  .gate-output {
    background: var(--accent-soft);
    border: 1px solid rgba(90,214,192,0.4);
    color: var(--ink);
    margin-top: 12px;
  }
  .gate-input .tag, .gate-output .tag {
    font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 2px 6px; border-radius: 3px;
  }
  .gate-input .tag { background: var(--bad); color: #1c0c0c; }

  /* ============================================================ */

  .perm-grid {

  /* ============================================================ */

  .compare thead th.us {

  }
  .compare tbody tr:last-child td { border-bottom: 0; }
  .compare td.feat { color: var(--ink); font-weight: 500; }
  .compare td.us { background: rgba(90,214,192,0.03); }
  .compare .yes { color: var(--accent); font-family: var(--mono); font-size: 13px; }
  .compare .no { color: var(--ink-4); font-family: var(--mono); font-size: 13px; }
  .compare .partial { color: var(--warn); font-family: var(--mono); font-size: 13px; }
  .compare td .note {
    display: block; font-family: var(--mono); font-size: 10.5px;
    color: var(--ink-3); margin-top: 2px; letter-spacing: 0.02em;
  }

  /* ============================================================ */
  /* QUICKSTART                                                     */
  /* ============================================================ */
  .qs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-top: 40px; }

    background: var(--panel); border: 1px solid var(--line);

  .qs-step-num {
    font-family: var(--mono); font-size: 11px;
    color: var(--accent); letter-spacing: 0.06em;
  }
  .qs-step-title { font-size: 14px; font-weight: 500; }
  .qs-step-body {
    padding: 18px 20px;

    background: var(--bg);
  }
  .qs-step-body .pmt { color: var(--ink-3); user-select: none; margin-right: 8px; }
  .qs-step-body .out { color: var(--ink-3); }
  .qs-step-body .ok { color: var(--accent); }
  .qs-step-body .row { display: flex; align-items: center; }

  /* ============================================================ */
  /* CTA                                                           */
  /* ============================================================ */
  .cta {
    background:
      radial-gradient(ellipse 600px 220px at 50% 0%, rgba(90,214,192,0.06), transparent 70%),
      var(--panel);
    border: 1px solid var(--line);

    padding: 64px 48px;
    text-align: center;
    margin-top: 40px;
  }
  .cta h2 { max-width: 720px; margin: 0 auto; }
  .cta p { color: var(--ink-2); margin: 16px auto 32px; max-width: 560px; }
  .cta .row { display: inline-flex; gap: 12px; }

  /* ============================================================ */
  /* FOOTER                                                        */
  /* ============================================================ */
  footer {
    border-top: 1px solid var(--line);
    padding: 48px 32px 32px;
    margin-top: 96px;
    color: var(--ink-3); font-size: 13px;
  }
  .footer-inner {
    max-width: 1240px; margin: 0 auto;
    display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr;
    gap: 40px;
  }
  .footer-col h5 {
    font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
    letter-spacing: 0.08em; text-transform: uppercase;
    margin: 0 0 14px;
  }
  .footer-col a { display: block; color: var(--ink-2); padding: 4px 0; transition: color 120ms; }
  .footer-col a:hover { color: var(--ink); }
  .footer-bottom {
    max-width: 1240px; margin: 32px auto 0;
    padding-top: 24px; border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--mono); font-size: 11.5px; color: var(--ink-4);
  }

  /* utility */
  .row-flex { display: flex; align-items: center; gap: 12px; }
  .gap-16 { gap: 16px; }
  .mt-8 { margin-top: 8px; } .mt-16 { margin-top: 16px; } .mt-32 { margin-top: 32px; }
  .mb-8 { margin-bottom: 8px; } .mb-16 { margin-bottom: 16px; } .mb-32 { margin-bottom: 32px; }
  .text-mono { font-family: var(--mono); }

  /* responsive guards */
  @media (max-width: 1080px) {

  }
