<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Changelog — AutoVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="docs-shell.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
.cl-page { max-width: 1100px; margin: 0 auto; padding: 56px 32px 96px; }

.cl-header { padding-bottom: 36px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.cl-header h1 { font-size: 52px; line-height: 1.02; letter-spacing: -0.03em; font-weight: 500; margin: 0 0 16px; }
.cl-header .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; }
.cl-header .lede { color: var(--ink-2); font-size: 17px; max-width: 600px; margin: 0; }

.cl-feeds { display: flex; gap: 8px; }
.cl-feed-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 12px; border: 1px solid var(--line-2); border-radius: 4px;
  background: var(--panel); color: var(--ink-2); font-family: var(--mono); font-size: 11.5px;
  cursor: pointer; transition: all 120ms;
}
.cl-feed-btn:hover { color: var(--ink); border-color: var(--ink-4); }

/* filter strip */
.cl-filters {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 18px 0;
  border-bottom: 1px solid var(--line);
  margin-bottom: 0;
}
.cl-filter-group { display: flex; gap: 4px; padding: 3px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 6px; }
.cl-filter-group button {
  background: none; border: 0; color: var(--ink-3);
  font: inherit; font-size: 12px; padding: 5px 11px; border-radius: 4px;
  cursor: pointer; display: flex; align-items: center; gap: 6px;
}
.cl-filter-group button.active { color: var(--ink); background: var(--panel); }
.cl-filter-group button .count { font-family: var(--mono); font-size: 10px; color: var(--ink-3); }
.cl-filter-group button.active .count { color: var(--accent); }

.cl-search {
  flex: 1; min-width: 200px; max-width: 320px;
  display: flex; align-items: center; gap: 8px;
  padding: 7px 12px; background: var(--bg-2);
  border: 1px solid var(--line); border-radius: 6px;
  font-family: var(--mono); font-size: 12px; color: var(--ink-2);
}
.cl-search input { flex: 1; background: transparent; border: 0; color: inherit; outline: none; font: inherit; }
.cl-search input::placeholder { color: var(--ink-3); }

/* timeline */
.cl-timeline {
  position: relative;
  padding: 32px 0 0 0;
}
.cl-timeline::before {
  content: ""; position: absolute;
  left: 100px; top: 32px; bottom: 0;
  width: 1px; background: var(--line);
}

.cl-release {
  display: grid; grid-template-columns: 100px 1fr; gap: 32px;
  padding: 32px 0;
  position: relative;
}
.cl-release::before {
  content: ""; position: absolute;
  left: 96px; top: 42px;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 4px var(--bg), 0 0 12px var(--accent);
}
.cl-release.minor::before { background: var(--ink-3); box-shadow: 0 0 0 4px var(--bg); }
.cl-release.patch::before { background: var(--ink-4); box-shadow: 0 0 0 4px var(--bg); }

.cl-meta { padding-top: 28px; text-align: right; padding-right: 24px; }
.cl-meta .date {
  font-family: var(--mono); font-size: 11.5px; color: var(--ink-3);
  letter-spacing: 0.04em;
}
.cl-meta .ago { font-family: var(--mono); font-size: 10.5px; color: var(--ink-4); margin-top: 4px; }

.cl-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 28px 32px;
  position: relative;
  transition: border-color 200ms;
}
.cl-card:hover { border-color: var(--line-2); }
.cl-card.featured {
  border-color: rgba(90,214,192,0.35);
  background: linear-gradient(180deg, rgba(90,214,192,0.04) 0%, var(--panel) 80%);
}

.cl-card .vh {
  display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap;
}
.cl-card .ver { font-size: 22px; font-weight: 500; letter-spacing: -0.02em; font-family: var(--mono); color: var(--ink); }
.cl-card .vtag {
  font-family: var(--mono); font-size: 10.5px; padding: 3px 8px; border-radius: 3px;
  letter-spacing: 0.06em; text-transform: uppercase;
}
.cl-card .vtag.major { background: var(--accent-soft); color: var(--accent); border: 1px solid rgba(90,214,192,0.3); }
.cl-card .vtag.minor { background: var(--panel-2); color: var(--ink-2); border: 1px solid var(--line-2); }
.cl-card .vtag.patch { background: rgba(232,168,102,0.08); color: var(--warn); border: 1px solid rgba(232,168,102,0.25); }
.cl-card .vtag.security { background: rgba(217,113,113,0.08); color: var(--bad); border: 1px solid rgba(217,113,113,0.25); }
.cl-card .vtag.preview { background: rgba(180,138,214,0.08); color: #b48ad6; border: 1px solid rgba(180,138,214,0.25); }
.cl-card .codename {
  margin-left: auto; font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--ink-3);
  letter-spacing: -0.005em;
}
.cl-card h2 { font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; font-weight: 500; margin: 0 0 14px; }
.cl-card .summary { color: var(--ink-2); font-size: 14.5px; line-height: 1.6; margin: 0 0 22px; }

.cl-sections { display: grid; gap: 16px; }
.cl-section .sh {
  display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase;
}
.cl-section.added .sh { color: var(--accent); }
.cl-section.changed .sh { color: var(--warn); }
.cl-section.fixed .sh { color: #5a9dd6; }
.cl-section.removed .sh { color: var(--bad); }
.cl-section.security .sh { color: var(--bad); }
.cl-section .sh .marker { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.cl-section ul { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 13.5px; line-height: 1.7; }
.cl-section li { margin-bottom: 4px; }
.cl-section li code { background: var(--bg-2); border: 1px solid var(--line); padding: 1px 6px; border-radius: 3px; font-family: var(--mono); font-size: 11.5px; color: var(--accent); }

.cl-card .footer-row {
  display: flex; align-items: center; gap: 14px; margin-top: 20px; padding-top: 16px;
  border-top: 1px solid var(--line);
  font-family: var(--mono); font-size: 11px; color: var(--ink-3);
  letter-spacing: 0.02em;
}
.cl-card .footer-row .commit { color: var(--accent); }
.cl-card .footer-row .author { display: inline-flex; align-items: center; gap: 6px; }
.cl-card .footer-row .author .av { width: 16px; height: 16px; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--line-2); }
.cl-card .footer-row .spc { flex: 1; }
.cl-card .footer-row a { color: var(--ink-2); }
.cl-card .footer-row a:hover { color: var(--ink); }

.cl-empty {
  padding: 80px 24px; text-align: center; color: var(--ink-3);
  border: 1px dashed var(--line); border-radius: 12px; margin-top: 32px;
  font-family: var(--mono); font-size: 13px;
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="docs-shell.jsx"></script>
<script type="text/babel">
const { useState, useMemo } = React;
const { Topbar } = window;

const RELEASES = [
  {
    version: "0.4.1", date: "May 2, 2026", ago: "4 days ago",
    type: "patch", tag: "patch", codename: "“Hempseed”", featured: false,
    title: "Source adapter timeout fix · denylist refresh",
    summary: "Quick patch following last week's 0.4 release. Fixes a hang in the GitHub source adapter when fetching skills from rate-limited orgs, and ships an updated denylist with three new exfiltration patterns reported by community researchers.",
    sections: [
      { kind: "fixed", items: [
        <>GitHub source adapter could hang for 30s on rate-limited fetches; now fails fast with a clear retry message <code>(#412)</code></>,
        <>Drift check on shell startup occasionally double-counted symlinked profiles on macOS</>,
        <>Permissions <code>fs_scope</code> with relative paths now resolves against the calling agent's CWD, not the vault</>,
      ]},
      { kind: "security", items: [
        <>Denylist update: three new exfil patterns matching <code>data:text/plain;base64</code> abuse paths reported by <code>@elvissun</code></>,
      ]},
    ],
    commit: "a3f9e21", author: "jack", contributors: 3,
  },
  {
    version: "0.4.0", date: "Apr 28, 2026", ago: "1 week ago",
    type: "minor", tag: "minor", codename: "“Front Door”", featured: true,
    title: "Per-caller transformation manifest · MCP-native tool surface",
    summary: "The headline release. Skills now declare a transformation manifest in their frontmatter, and AutoVault renders a per-caller view at delivery time. Same skill, three rendered views — written once, no forks. Ships alongside a native MCP tool surface for Claude Code, Codex, and AutoHub.",
    sections: [
      { kind: "added", items: [
        <><strong>Transformation manifest</strong> in skill frontmatter (<code>transformations:</code> block) — maps canonical capability names to per-agent tool names</>,
        <><strong>Native MCP tools:</strong> <code>list_skills</code>, <code>search_skills</code>, <code>get_skill</code>, <code>read_skill_resource</code>, <code>install_skill</code>, <code>propose_skill</code>, <code>check_updates</code></>,
        <><strong>Progressive disclosure:</strong> <code>list_skills</code> returns metadata only; full body loads on demand. ~93% token reduction for cold start with 40-skill vaults</>,
        <><strong>Bridge skill</strong> <code>autovault-skill</code> for non-MCP agents — drop-in 200-line SKILL.md teaches any agent to query the vault</>,
      ]},
      { kind: "changed", items: [
        <>Skill resolution now caches rendered views per caller; first hit ~4ms, subsequent hits &lt;1ms</>,
        <>CLI flag <code>--agent</code> now accepts comma-separated lists for multi-agent scoping in one command</>,
      ]},
      { kind: "removed", items: [
        <>Deprecated <code>autovault sync</code> alias removed (use <code>autovault refresh</code>)</>,
      ]},
    ],
    commit: "f4e2c81", author: "jack", contributors: 7,
  },
  {
    version: "0.3.2", date: "Apr 14, 2026", ago: "3 weeks ago",
    type: "patch", tag: "patch", codename: null, featured: false,
    title: "Dedup tuning · CI runner mode",
    summary: "Tuned the V1 text-similarity dedup threshold based on three weeks of private beta data — too aggressive on near-paraphrases, too lenient on actual duplicates. New threshold catches 94% of true dupes with 0.8% false-positive rate.",
    sections: [
      { kind: "added", items: [
        <><code>autovault --runner-mode</code> for ephemeral CI environments — read-only, no keypair generation, faster startup</>,
      ]},
      { kind: "fixed", items: [
        <>Dedup threshold tuned: 94% true-positive, 0.8% false-positive (was 71% / 4.2%)</>,
        <>Sign step occasionally produced non-canonical YAML output for skills with deeply nested transformations</>,
      ]},
    ],
    commit: "b7d1a04", author: "jack", contributors: 2,
  },
  {
    version: "0.3.0", date: "Apr 1, 2026", ago: "5 weeks ago",
    type: "minor", tag: "minor", codename: "“Quartermaster”", featured: false,
    title: "Four-axis permission scoping · cloud mode preview",
    summary: "The permission system shipped. Every skill request now carries a four-axis context (agent, device, project, tool/user) and the vault filters per-caller. Also opens the private preview of cloud-mode self-host.",
    sections: [
      { kind: "added", items: [
        <><strong>Four-axis scoping:</strong> agent, device, project, tool/user. <code>autovault scope</code> CLI command. Rules are additive across axes</>,
        <><strong>Cloud mode preview</strong> — Docker image, OAuth 2.1, role-based access. Same engine as local; private beta available on request</>,
        <><code>autovault who</code> command shows the active scope context for any caller — useful for debugging "why can't this agent see my skill"</>,
      ]},
      { kind: "changed", items: [
        <>Default scope for newly-added skills is now <em>unscoped</em> — explicit visibility required. Previous default was "all agents on this device"</>,
      ]},
    ],
    commit: "c9e44f2", author: "jack", contributors: 5,
  },
  {
    version: "0.2.0", date: "Mar 12, 2026", ago: "8 weeks ago",
    type: "minor", tag: "preview", codename: "“Watchtower”", featured: false,
    title: "Validation gate v1 · ed25519 signing",
    summary: "First version of the five-step validation gate (yaml-repair, denylist, capability/behavior, dedup, sign). Every skill admitted to the vault is now signed with an ed25519 keypair generated at install time.",
    sections: [
      { kind: "added", items: [
        <><strong>Five-step validation gate</strong> — runs on every skill, whether installed from a source adapter or proposed by an agent at runtime</>,
        <><strong>Ed25519 signing</strong> — provenance is a first-class artifact. Public keys published at <code>.well-known/keys.json</code></>,
        <><strong>YAML auto-repair</strong> — handles trailing commas, mixed indentation, unquoted special chars before strict schema check</>,
        <><strong>Denylist v1</strong> — known-bad patterns: credential stealers, fork bombs, exfil paths. Sourced from public-research advisories</>,
      ]},
    ],
    commit: "8e1a3d5", author: "jack", contributors: 1,
  },
  {
    version: "0.1.0", date: "Feb 18, 2026", ago: "11 weeks ago",
    type: "minor", tag: "preview", codename: "“Foundation”", featured: false,
    title: "First public preview",
    summary: "The vault, the SQLite capability index, the symlink-based delivery model. No transformation manifest yet, no permission system — just the local-first skeleton that everything else hangs off.",
    sections: [
      { kind: "added", items: [
        <>Local-first vault at <code>~/.autovault</code> with SQLite capability index</>,
        <>Filesystem symlink delivery into agent profile dirs (<code>~/.claude/skills</code>, <code>~/.codex/skills</code>)</>,
        <>Source adapters for GitHub, local path, HTTPS bundle</>,
        <><code>autovault add</code>, <code>autovault remove</code>, <code>autovault list</code>, <code>autovault status</code></>,
      ]},
    ],
    commit: "1a0b0c0", author: "jack", contributors: 1,
  },
];

const FILTERS = [
  { id: "all", label: "All", match: () => true },
  { id: "major", label: "Major", match: r => r.tag === "major" },
  { id: "minor", label: "Minor", match: r => r.tag === "minor" },
  { id: "patch", label: "Patch", match: r => r.tag === "patch" },
  { id: "security", label: "Security", match: r => r.sections.some(s => s.kind === "security") },
];

const SECTION_TITLES = {
  added: "Added",
  changed: "Changed",
  fixed: "Fixed",
  removed: "Removed",
  security: "Security",
};

const App = () => {
  const [filter, setFilter] = useState("all");
  const [query, setQuery] = useState("");

  const counts = useMemo(() => {
    const c = {};
    FILTERS.forEach(f => { c[f.id] = RELEASES.filter(f.match).length; });
    return c;
  }, []);

  const filtered = useMemo(() => {
    const f = FILTERS.find(x => x.id === filter);
    return RELEASES.filter(r => f.match(r) && (
      !query || (r.title + r.version + (r.codename || "") + r.summary).toLowerCase().includes(query.toLowerCase())
    ));
  }, [filter, query]);

  return (
    <>
      <Topbar active="Changelog" />
      <div className="cl-page">
        <div className="cl-header">
          <div className="row">
            <div>
              <div className="eyebrow" style={{ display: "inline-flex", alignItems: "center", gap: 8, fontFamily: "var(--mono)", fontSize: 11, color: "var(--ink-3)", letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: 16 }}>
                <span style={{ width: 18, height: 1, background: "var(--ink-4)" }}/>
                <span>Changelog</span>
              </div>
              <h1>Every skill leaves <span className="ital">a trail.</span></h1>
              <p className="lede">A permanent, signed record of what changed in AutoVault — and a model for how we'd like the rest of the skill ecosystem to look. Every release is signed; every signature is verifiable.</p>
            </div>
            <div className="cl-feeds">
              <button className="cl-feed-btn">RSS</button>
              <button className="cl-feed-btn">Atom</button>
              <button className="cl-feed-btn">JSON</button>
            </div>
          </div>
        </div>

        <div className="cl-filters">
          <div className="cl-filter-group">
            {FILTERS.map(f => (
              <button key={f.id} className={filter === f.id ? "active" : ""} onClick={() => setFilter(f.id)}>
                {f.label} <span className="count">{counts[f.id]}</span>
              </button>
            ))}
          </div>
          <div className="cl-search">
            <span style={{ color: "var(--ink-3)" }}>⌕</span>
            <input
              type="text"
              placeholder="Search releases…"
              value={query}
              onChange={(e) => setQuery(e.target.value)}
            />
          </div>
          <div style={{ marginLeft: "auto", fontFamily: "var(--mono)", fontSize: 11, color: "var(--ink-3)", letterSpacing: "0.04em" }}>
            {filtered.length} of {RELEASES.length} releases
          </div>
        </div>

        <div className="cl-timeline">
          {filtered.length === 0 && (
            <div className="cl-empty">no releases match — try clearing filters</div>
          )}
          {filtered.map((r) => (
            <div key={r.version} className={"cl-release " + r.type}>
              <div className="cl-meta">
                <div className="date">{r.date}</div>
                <div className="ago">{r.ago}</div>
              </div>
              <div className={"cl-card" + (r.featured ? " featured" : "")}>
                <div className="vh">
                  <span className="ver">{r.version}</span>
                  <span className={"vtag " + r.tag}>{r.tag}</span>
                  {r.sections.some(s => s.kind === "security") && <span className="vtag security">security</span>}
                  {r.codename && <span className="codename">{r.codename}</span>}
                </div>
                <h2>{r.title}</h2>
                <p className="summary">{r.summary}</p>
                <div className="cl-sections">
                  {r.sections.map((s, i) => (
                    <div key={i} className={"cl-section " + s.kind}>
                      <div className="sh"><span className="marker"/>{SECTION_TITLES[s.kind]}</div>
                      <ul>
                        {s.items.map((it, j) => <li key={j}>{it}</li>)}
                      </ul>
                    </div>
                  ))}
                </div>
                <div className="footer-row">
                  <span className="commit">{r.commit}</span>
                  <span className="author">
                    <span className="av"/> @{r.author}
                  </span>
                  <span>{r.contributors} {r.contributors === 1 ? "contributor" : "contributors"}</span>
                  <span className="spc"/>
                  <a>verify signature</a>
                  <a>diff →</a>
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
