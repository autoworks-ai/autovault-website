<style>
.cm-page { max-width: 1240px; margin: 0 auto; padding: 0 28px; }

.cm-hero { padding: 56px 0 40px; max-width: 880px; }
.cm-hero .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 18px; }
.cm-hero .eyebrow .dash { width: 18px; height: 1px; background: var(--ink-4); }
.cm-hero h1 { font-size: 52px; line-height: 1.05; letter-spacing: -0.03em; font-weight: 500; margin: 0 0 18px; }
.cm-hero .lede { color: var(--ink-2); font-size: 17px; line-height: 1.55; margin: 0; max-width: 720px; }
.cm-hero .lede em { font-family: var(--serif); font-style: italic; color: var(--ink); }

/* TLDR */
.cm-tldr {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 24px 28px;
  margin: 0 0 56px;
  display: grid; grid-template-columns: 180px 1fr; gap: 28px; align-items: start;
}
.cm-tldr .lbl { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase; }
.cm-tldr .body { color: var(--ink-2); font-size: 15px; line-height: 1.6; }
.cm-tldr .body p { margin: 0 0 10px; }
.cm-tldr .body strong { color: var(--ink); font-weight: 500; }

/* Players */
.cm-players { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 0 0 56px; }
.cm-player {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 18px 20px;
}
.cm-player.us { border-color: rgba(90,214,192,0.4); background: linear-gradient(180deg, rgba(90,214,192,0.04), var(--panel)); }
.cm-player .row1 { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.cm-player .badge { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; font-family: var(--mono); font-weight: 700; font-size: 11px; color: var(--ink); }
.cm-player .nm { font-size: 16px; font-weight: 500; letter-spacing: -0.01em; }
.cm-player .us-tag { margin-left: auto; font-family: var(--mono); font-size: 9.5px; color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase; }
.cm-player .desc { font-size: 12.5px; color: var(--ink-3); line-height: 1.5; }
.cm-player .meta-row { display: flex; gap: 12px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 10.5px; color: var(--ink-4); }

/* Comparison table */
.cm-section { padding: 48px 0; border-top: 1px solid var(--line); }
.cm-section h2 { font-size: 30px; font-weight: 500; letter-spacing: -0.025em; margin: 0 0 8px; line-height: 1.1; }
.cm-section .sub { color: var(--ink-2); font-size: 15px; max-width: 720px; margin: 0 0 24px; }
.cm-section .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 14px; }
.cm-section .eyebrow .dash { width: 18px; height: 1px; background: var(--ink-4); }

.cm-grid {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  overflow: hidden;
}
.cm-row { display: grid; grid-template-columns: 280px repeat(4, 1fr); gap: 0; border-bottom: 1px solid var(--line); }
.cm-row:last-child { border-bottom: 0; }
.cm-row .cell { padding: 16px 20px; border-right: 1px solid var(--line); font-size: 13.5px; color: var(--ink-2); line-height: 1.55; }
.cm-row .cell:last-child { border-right: 0; }
.cm-row .cell.row-head { color: var(--ink); background: var(--bg-2); font-weight: 500; }
.cm-row .cell.us { background: rgba(90,214,192,0.04); }
.cm-row .cell .verdict { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 6px; }
.cm-row .cell .verdict.yes { color: var(--accent); }
.cm-row .cell .verdict.no { color: var(--ink-4); }
.cm-row .cell .verdict.partial { color: var(--warn); }
.cm-row .cell .verdict.bad { color: var(--bad); }
.cm-row .cell .det { font-size: 12.5px; color: var(--ink-3); line-height: 1.5; }

.cm-row.head { background: var(--bg-2); border-bottom: 1px solid var(--line-2); }
.cm-row.head .cell { padding: 14px 20px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500; }
.cm-row.head .cell.us { color: var(--accent); }
.cm-row.section-head .cell { padding: 11px 20px; background: var(--bg); font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase; }

/* When-to-use cards */
.cm-when { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.cm-when-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 22px 24px;
}
.cm-when-card.us { border-color: rgba(90,214,192,0.3); background: linear-gradient(180deg, rgba(90,214,192,0.04), var(--panel)); }
.cm-when-card .h { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.cm-when-card .h .badge { width: 24px; height: 24px; border-radius: 5px; display: grid; place-items: center; font-family: var(--mono); font-weight: 700; font-size: 10px; }
.cm-when-card h3 { font-size: 17px; font-weight: 500; margin: 0; letter-spacing: -0.015em; }
.cm-when-card .pick { color: var(--ink-2); font-size: 13.5px; line-height: 1.6; margin-bottom: 14px; }
.cm-when-card .ul { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); letter-spacing: 0.04em; margin-bottom: 6px; text-transform: uppercase; }
.cm-when-card .signals { font-size: 13px; color: var(--ink-2); line-height: 1.7; }
.cm-when-card .signals li { margin-bottom: 4px; }
.cm-when-card .signals li::marker { color: var(--ink-4); }

/* TWO-COL DIVE */
.cm-dive { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 12px; }
.cm-dive-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 28px 32px;
}
.cm-dive-card h3 { font-size: 19px; font-weight: 500; letter-spacing: -0.018em; margin: 0 0 4px; }
.cm-dive-card .sub { color: var(--ink-3); font-size: 12.5px; font-family: var(--mono); letter-spacing: 0.04em; margin: 0 0 18px; }
.cm-dive-card .point { padding: 12px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 110px 1fr; gap: 16px; align-items: start; }
.cm-dive-card .point:last-child { border-bottom: 0; padding-bottom: 0; }
.cm-dive-card .point .axis { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; padding-top: 2px; }
.cm-dive-card .point .body { color: var(--ink-2); font-size: 13.5px; line-height: 1.55; }
.cm-dive-card .point .body strong { color: var(--ink); font-weight: 500; }

/* Migration */
.cm-mig {
  background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px;
  padding: 28px 32px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 32px;
  align-items: start;
}
.cm-mig h3 { font-size: 18px; font-weight: 500; margin: 0 0 12px; }
.cm-mig p { color: var(--ink-2); font-size: 13.5px; line-height: 1.6; margin: 0 0 14px; }
.cm-mig .code {
  font-family: var(--mono); font-size: 12px; line-height: 1.7;
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  padding: 14px 16px; color: var(--ink-2);
}
.cm-mig .code .pmt { color: var(--accent); }
.cm-mig .code .com { color: var(--ink-4); }
.cm-mig .code .ok { color: var(--accent); }

/* Honesty box */
.cm-honest {
  background: var(--panel); border: 1px solid var(--line);
  border-left: 3px solid var(--warn);
  border-radius: 6px;
  padding: 20px 24px;
  margin: 24px 0 0;
}
.cm-honest .ttl { font-family: var(--mono); font-size: 11px; color: var(--warn); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
.cm-honest p { color: var(--ink-2); font-size: 14px; line-height: 1.6; margin: 0 0 8px; }
.cm-honest p:last-child { margin-bottom: 0; }
.cm-honest strong { color: var(--ink); font-weight: 500; }
</style>
</head>

<div id="root"></div>

<script type="text/babel" src="docs-shell.jsx"></script>
<script type="text/babel">
const { Topbar, Icon } = window;

const PLAYERS = [
  { id: "av", nm: "AutoVault", desc: "Validating registry. Author once, render per caller. Local CLI; signed; reproducible.", badge: "AV", color: "#5ad6c0", ink: "#062821", us: true, meta: ["v0.4.1", "Apache-2.0", "self-hosted"] },
  { id: "rh", nm: "RawHub", desc: "Public skill index. No gate, no signing. Browse and copy-paste from a community wiki.", badge: "RH", color: "#5a9dd6", ink: "#06182a", meta: ["community", "no validation", "browser only"] },
  { id: "fl", nm: "ForkFlow", desc: "Fork-and-edit catalog. Each agent maintains its own format-specific fork of every skill.", badge: "FF", color: "#d6a85a", ink: "#2a1a06", meta: ["per-agent forks", "no dedup", "manual sync"] },
  { id: "ml", nm: "ManualOps", desc: "No tooling. Engineers paste skills directly into CLAUDE.md / .cursorrules / AGENTS.md by hand.", badge: "—", color: "#4a5b6b", ink: "#0a0d11", meta: ["zero tooling", "high drift", "no provenance"] },
];

const ROWS = [
  { kind: "section", lbl: "Authoring & format" },
  {
    feature: "Single source of truth",
    detail: "One canonical SKILL.md vs. N agent-specific forks",
    av: { v: "yes", t: "Single SKILL.md per skill", d: "Transformations rendered server-side per caller" },
    rh: { v: "yes", t: "One per skill", d: "But no rendering — caller copy-pastes raw" },
    fl: { v: "no",  t: "N forks per skill", d: "Author maintains CLAUDE.md, AGENTS.md, .cursorrules separately" },
    ml: { v: "no",  t: "Per-machine drift", d: "Each engineer keeps their own version" },
  },
  {
    feature: "Per-caller transformation",
    detail: "Output adapted to the agent's idiom (CLAUDE.md / AGENTS.md / .cursorrules)",
    av: { v: "yes", t: "Manifest-driven", d: "Author declares targets; vault renders & signs each" },
    rh: { v: "no",  t: "—", d: "Caller is on their own" },
    fl: { v: "partial", t: "Manual fork", d: "Each fork is a separate copy" },
    ml: { v: "no",  t: "—", d: "Whatever the engineer pasted is what runs" },
  },
  {
    feature: "Author-once delivery",
    detail: "Write the skill once and reach every supported agent",
    av: { v: "yes", t: "4 agents from one source", d: "Claude Code, Codex, Cursor, AutoHub" },
    rh: { v: "partial", t: "1 format per skill", d: "Author picks one; rest is a copy job" },
    fl: { v: "no",  t: "Up to N times", d: "One write per agent fork" },
    ml: { v: "no",  t: "1× per machine × N agents", d: "Compounding manual work" },
  },

  { kind: "section", lbl: "Validation & trust" },
  {
    feature: "Pre-publish gate",
    detail: "Programmatic checks before a skill is admissible",
    av: { v: "yes", t: "5 stages, public + reproducible", d: "Repair → denylist → capability ↔ behavior → dedup → sign" },
    rh: { v: "no",  t: "—", d: "Best-effort community moderation" },
    fl: { v: "partial", t: "Per-fork lint", d: "Inconsistent across forks" },
    ml: { v: "no",  t: "—", d: "Whatever ships, ships" },
  },
  {
    feature: "Cryptographic signing",
    detail: "Ed25519 sigs that bind author + content + gate verdict",
    av: { v: "yes", t: "Ed25519 chain", d: "Author → vault → mirror; verifiable end-to-end" },
    rh: { v: "no",  t: "—", d: "Trust by URL only" },
    fl: { v: "no",  t: "—", d: "No signing" },
    ml: { v: "no",  t: "—", d: "No signing" },
  },
  {
    feature: "Reproducible verdicts",
    detail: "Same bytes in = same gate verdict out, anywhere",
    av: { v: "yes", t: "Yes — gate v0.4+", d: "Run locally with `autovault verify`" },
    rh: { v: "no",  t: "n/a", d: "No verdict to reproduce" },
    fl: { v: "partial", t: "Best-effort", d: "Depends on which fork's lint" },
    ml: { v: "no",  t: "n/a", d: "—" },
  },
  {
    feature: "Public denylist",
    detail: "Auditable, signed, versioned bad-pattern bundle",
    av: { v: "yes", t: "343 patterns, signed", d: "Same artifact format as skills" },
    rh: { v: "no",  t: "—", d: "—" },
    fl: { v: "no",  t: "—", d: "—" },
    ml: { v: "no",  t: "—", d: "—" },
  },

  { kind: "section", lbl: "Operations" },
  {
    feature: "Dedup at submission",
    detail: "Stops the duplicate-skill explosion before it starts",
    av: { v: "yes", t: "Text in V1; embedding in V2 preview", d: "Authors can flag false positives" },
    rh: { v: "no",  t: "Browser ranking only", d: "Hundreds of near-duplicates surface" },
    fl: { v: "no",  t: "—", d: "Forks are duplicates by design" },
    ml: { v: "no",  t: "—", d: "—" },
  },
  {
    feature: "Self-hostable",
    detail: "Run a private vault on your own infra, behind your VPN",
    av: { v: "yes", t: "Docker / Railway / Render", d: "Same gate, your keys, your mirror" },
    rh: { v: "partial", t: "Mirrors only", d: "No gate to self-host" },
    fl: { v: "no",  t: "Cloud only", d: "—" },
    ml: { v: "yes", t: "By definition", d: "Each engineer's machine is the host" },
  },
  {
    feature: "Remote MCP endpoint",
    detail: "Agents on mobile / sandboxed runtimes can fetch over HTTPS",
    av: { v: "yes", t: "Bundled MCP server", d: "One-click deploy, signed responses" },
    rh: { v: "no",  t: "—", d: "Browser-only" },
    fl: { v: "partial", t: "Per-agent", d: "Format-specific endpoints" },
    ml: { v: "no",  t: "—", d: "—" },
  },
  {
    feature: "License clarity",
    detail: "License declared in frontmatter and surfaced at install",
    av: { v: "yes", t: "Required field, gate-checked", d: "SPDX identifier or rejection" },
    rh: { v: "partial", t: "Optional, often blank", d: "Caller assumes risk" },
    fl: { v: "partial", t: "Per-fork inconsistency", d: "—" },
    ml: { v: "no",  t: "Lost in copy-paste", d: "—" },
  },

  { kind: "section", lbl: "Cost & openness" },
  {
    feature: "Pricing",
    detail: "Cost to author, host, or consume",
    av: { v: "yes", t: "Free, Apache-2.0, no hosted tier", d: "All open. No paid plans, ever." },
    rh: { v: "yes", t: "Free", d: "Donations" },
    fl: { v: "partial", t: "Free tier + paid", d: "Private forks behind a paywall" },
    ml: { v: "yes", t: "Free", d: "But labor cost is high" },
  },
  {
    feature: "Vendor lock-in risk",
    detail: "If the project disappears tomorrow, what happens?",
    av: { v: "yes", t: "Plain SKILL.md files", d: "Bundle is portable Markdown + signed JSON" },
    rh: { v: "yes", t: "Plain text", d: "Caller already has copies" },
    fl: { v: "partial", t: "Forks survive", d: "But each agent's format is proprietary" },
    ml: { v: "yes", t: "Yours already", d: "—" },
  },
];

const PLAYER_HEAD = (p) => (
  <div className={"cell" + (p.us ? " us" : "")}>
    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
      <div className="badge" style={{ background: p.color, color: p.ink, width: 24, height: 24 }}>{p.badge}</div>
      <span style={{ color: "var(--ink)", fontFamily: "var(--sans)", fontSize: 13.5, fontWeight: 500, letterSpacing: "-0.005em", textTransform: "none" }}>{p.nm}</span>
    </div>
  </div>
);

const renderCell = (data, isUs) => {
  const verdictMap = { yes: "Yes", no: "No", partial: "Partial", bad: "Risky" };
  return (
    <div className={"cell" + (isUs ? " us" : "")}>
      <div className={"verdict " + data.v}>{verdictMap[data.v]} · {data.t}</div>
      <div className="det">{data.d}</div>
    </div>
  );
};

const App = () => {
  return (
    <>
      <Topbar/>
      <div className="cm-page">
        <div className="cm-hero">
          <div className="eyebrow"><span className="dash"/> Comparison · v0.4.1 · 2026-05</div>
          <h1>The honest breakdown of <span className="ital">where AutoVault wins, ties, and doesn't.</span></h1>
          <p className="lede">The homepage table is a teaser. This page is the long form — including the cases where another approach is genuinely better. We re-evaluate every release; if a competitor closes a gap, we say so here first.</p>
        </div>

        <div className="cm-tldr">
          <div>
            <div className="lbl">In one paragraph</div>
            <div style={{ fontFamily: "var(--mono)", fontSize: 10.5, color: "var(--ink-4)", letterSpacing: "0.04em", marginTop: 4 }}>~30s read</div>
          </div>
          <div className="body">
            <p>If you publish skills for <strong>more than one agent</strong> and care about <strong>provenance</strong>, AutoVault is the only option that solves both with a single SKILL.md and a public, reproducible gate. If you only publish for one agent and don't care about signing, <strong>RawHub</strong> is fine and free. If your team has been hand-maintaining <strong>per-agent forks</strong> of the same skill, you're paying the ForkFlow tax — that's the case AutoVault was built to retire.</p>
          </div>
        </div>

        <div className="cm-players">
          {PLAYERS.map(p => (
            <div key={p.id} className={"cm-player" + (p.us ? " us" : "")}>
              <div className="row1">
                <div className="badge" style={{ background: p.color, color: p.ink }}>{p.badge}</div>
                <span className="nm">{p.nm}</span>
                {p.us && <span className="us-tag">us</span>}
              </div>
              <div className="desc">{p.desc}</div>
              <div className="meta-row">
                {p.meta.map(m => <span key={m}>{m}</span>)}
              </div>
            </div>
          ))}
        </div>

        <div className="cm-section">
          <div className="eyebrow"><span className="dash"/> Feature matrix</div>
          <h2>Feature-by-feature.</h2>
          <p className="sub">Twelve dimensions across four sections. Cells show the verdict (yes / partial / no) plus a one-line explanation — never a flat checkmark, because flat checkmarks lie.</p>

          <div className="cm-grid">
            <div className="cm-row head">
              <div className="cell" style={{ background: "var(--bg-2)" }}>Capability</div>
              {PLAYERS.map(p => PLAYER_HEAD(p))}
            </div>
            {ROWS.map((r, i) => {
              if (r.kind === "section") {
                return (
                  <div key={i} className="cm-row section-head">
                    <div className="cell" style={{ gridColumn: "span 5" }}>{r.lbl}</div>
                  </div>
                );
              }
              return (
                <div key={i} className="cm-row">
                  <div className="cell row-head">
                    <div>{r.feature}</div>
                    <div style={{ fontSize: 12, color: "var(--ink-3)", fontWeight: 400, marginTop: 2 }}>{r.detail}</div>
                  </div>
                  {renderCell(r.av, true)}
                  {renderCell(r.rh, false)}
                  {renderCell(r.fl, false)}
                  {renderCell(r.ml, false)}
                </div>
              );
            })}
          </div>

          <div className="cm-honest">
            <div className="ttl">⚠ Honesty box</div>
            <p><strong>Where AutoVault is genuinely behind.</strong> RawHub has more skills (3,400 vs. our 241) — community indexes always do. ForkFlow has a richer GUI for browsing per-agent forks; if you live mostly in one agent's tooling and don't care about cross-agent skills, that may matter to you. We do not have a hosted tier and we don't plan to add one — if you want zero-ops, our remote MCP one-click deploy is the closest equivalent.</p>
          </div>
        </div>

        <div className="cm-section">
          <div className="eyebrow"><span className="dash"/> When to pick what</div>
          <h2>Pick by situation, not by feature count.</h2>
          <p className="sub">Four short cards with the real-world signals that should push you toward each option. We try not to recommend ourselves when we shouldn't.</p>

          <div className="cm-when">
            <div className="cm-when-card us">
              <div className="h">
                <div className="badge" style={{ background: "#5ad6c0", color: "#062821" }}>AV</div>
                <h3>Pick AutoVault when…</h3>
              </div>
              <p className="pick">You ship skills for two or more agents, you can't tolerate drift between formats, and your security or compliance team needs a verifiable provenance chain before anything reaches a developer's machine.</p>
              <div className="ul">Real signals</div>
              <ul className="signals">
                <li>"We have a CLAUDE.md, a .cursorrules, and an AGENTS.md, and they keep diverging"</li>
                <li>"Our security team blocked a skill registry because there's no signing"</li>
                <li>"We need to audit which skills loaded on a developer machine last week"</li>
                <li>"We want a private vault behind our VPN"</li>
              </ul>
            </div>

            <div className="cm-when-card">
              <div className="h">
                <div className="badge" style={{ background: "#5a9dd6", color: "#06182a" }}>RH</div>
                <h3>Pick RawHub when…</h3>
              </div>
              <p className="pick">You're a solo developer using one agent, breadth-of-catalog matters more than provenance, and you'd rather copy-paste five skills today than configure anything.</p>
              <div className="ul">Real signals</div>
              <ul className="signals">
                <li>Personal projects, not work product</li>
                <li>Single-agent setup (just Cursor, just Claude Code)</li>
                <li>You're fine reading every skill yourself before pasting</li>
                <li>Discovery > trust</li>
              </ul>
            </div>

            <div className="cm-when-card">
              <div className="h">
                <div className="badge" style={{ background: "#d6a85a", color: "#2a1a06" }}>FF</div>
                <h3>Pick ForkFlow when…</h3>
              </div>
              <p className="pick">You're already deep in one agent's ecosystem, you don't write skills (you just consume them), and the per-agent UX matters more than a unified source.</p>
              <div className="ul">Real signals</div>
              <ul className="signals">
                <li>You consume skills, never publish them</li>
                <li>You like a marketplace UI more than a CLI</li>
                <li>You don't mind installing the same skill twice when switching agents</li>
              </ul>
            </div>

            <div className="cm-when-card">
              <div className="h">
                <div className="badge" style={{ background: "#4a5b6b", color: "#0a0d11" }}>—</div>
                <h3>Skip tooling entirely when…</h3>
              </div>
              <p className="pick">You have fewer than five skills total, your team is one or two people, and the overhead of any registry would be larger than the problem it solves.</p>
              <div className="ul">Real signals</div>
              <ul className="signals">
                <li>The whole skill folder fits in one screenshot</li>
                <li>You can name every skill from memory</li>
                <li>The agents you use don't even support skill autoloading yet</li>
              </ul>
            </div>
          </div>
        </div>

        <div className="cm-section">
          <div className="eyebrow"><span className="dash"/> The two big bets</div>
          <h2>What we believe that the alternatives don't.</h2>
          <p className="sub">Below the feature matrix, AutoVault is shaped by two opinions about where the agent-skill ecosystem is heading. They're worth understanding before you commit.</p>

          <div className="cm-dive">
            <div className="cm-dive-card">
              <h3>Bet #1 · Skills are infrastructure, not content</h3>
              <p className="sub">Treat them like SBOMs, not like Stack Overflow answers</p>
              <div className="point">
                <div className="axis">Implication</div>
                <div className="body">A skill that runs in your agent's tool boundary is <strong>code in your trust path</strong>. Distributing it without a signature is the equivalent of <code>curl | bash</code>. The industry will ratchet toward signing whether registries lead or follow.</div>
              </div>
              <div className="point">
                <div className="axis">Bet</div>
                <div className="body">In 18 months, unsigned skills will look the way unsigned npm packages look today: tolerated for personal use, blocked at the enterprise edge.</div>
              </div>
              <div className="point">
                <div className="axis">If wrong</div>
                <div className="body">Provenance becomes overhead nobody asked for, RawHub-shaped indexes win on raw volume. We over-built.</div>
              </div>
            </div>

            <div className="cm-dive-card">
              <h3>Bet #2 · The agent format wars are permanent</h3>
              <p className="sub">There will not be one universal skill format</p>
              <div className="point">
                <div className="axis">Implication</div>
                <div className="body">Each agent's idiom (CLAUDE.md, AGENTS.md, .cursorrules) reflects how that agent's <strong>controller actually reasons</strong>. Forcing a single format would mean degrading every agent to the lowest common denominator.</div>
              </div>
              <div className="point">
                <div className="axis">Bet</div>
                <div className="body">The right abstraction is one canonical SKILL.md plus a transformation manifest, not one universal output. ForkFlow gets this half-right (the formats are real) but pays the per-fork tax.</div>
              </div>
              <div className="point">
                <div className="axis">If wrong</div>
                <div className="body">A standard emerges (e.g. an OpenAI-led one) and our manifest layer becomes vestigial. We collapse it into the SKILL.md and move on.</div>
              </div>
            </div>
          </div>
        </div>

        <div className="cm-section">
          <div className="eyebrow"><span className="dash"/> Migrating in</div>
          <h2>Already using one of the others? Here's the path.</h2>
          <p className="sub">We provide first-class importers for the three common starting points. Migration runs through the same gate as authoring, so what you import is what gets signed.</p>

          <div className="cm-mig" style={{ marginBottom: 16 }}>
            <div>
              <h3>From RawHub</h3>
              <p>The CLI walks RawHub's index, downloads each skill, and runs it through the gate. Anything that doesn't pass surfaces as a clear error before it lands in your vault.</p>
            </div>
            <div className="code">
              <div><span className="pmt">$</span> autovault import rawhub --user you</div>
              <div><span className="com"># found 47 skills · running gate…</span></div>
              <div><span className="ok">  ✓ 41 imported</span> · <span style={{ color: "var(--warn)" }}>5 repaired</span> · <span style={{ color: "var(--bad)" }}>1 rejected</span></div>
              <div><span className="com"># review: ./autovault/rejected.log</span></div>
            </div>
          </div>

          <div className="cm-mig" style={{ marginBottom: 16 }}>
            <div>
              <h3>From ForkFlow (per-agent forks)</h3>
              <p>Point the importer at all three forks of the same skill — it merges them into one canonical SKILL.md plus a populated transformation manifest. You get to review the merge before signing.</p>
            </div>
            <div className="code">
              <div><span className="pmt">$</span> autovault import forkflow \</div>
              <div>    --claude ./forks/extract-pdf.cc \</div>
              <div>    --codex  ./forks/extract-pdf.cx \</div>
              <div>    --cursor ./forks/extract-pdf.cu</div>
              <div><span className="com"># merged 3 forks → 1 SKILL.md + 3 transformations</span></div>
              <div><span className="ok">  ✓ ready to sign</span></div>
            </div>
          </div>

          <div className="cm-mig">
            <div>
              <h3>From hand-maintained CLAUDE.md / AGENTS.md / .cursorrules</h3>
              <p>The most common starting point. The importer parses each file, identifies skill-shaped sections, and proposes a SKILL.md per section. You confirm; the gate signs.</p>
            </div>
            <div className="code">
              <div><span className="pmt">$</span> autovault import manual ./CLAUDE.md</div>
              <div><span className="com"># detected 6 skill-shaped sections</span></div>
              <div><span className="ok">  ✓ 6 SKILL.md drafts written to ./drafts/</span></div>
              <div><span className="pmt">$</span> autovault publish ./drafts/*.md</div>
            </div>
          </div>
        </div>
      </div>
    </>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
