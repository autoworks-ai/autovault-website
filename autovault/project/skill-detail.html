    <h1># Extract PDF</h1>
    <p>Extract structured text from PDF files while preserving heading hierarchy, list structure, and table layout where possible. Wraps a local pdf-parsing library — never sends bytes off-device.</p>

    <h2>## When to use this skill</h2>
    <p>Reach for <code>extract-pdf</code> when the user asks you to read, summarize, or extract content from a PDF file. Don't use this skill for <em>structured</em> data extraction (invoices, receipts, forms) — pair with <code>extract-table</code> downstream for that.</p>

    <h2>## Inputs</h2>
    <ul>
      <li>A path to a .pdf file (relative or absolute) under the user's working directory</li>
      <li>Optional: <code>--format=json</code> to emit structured output instead of plain text</li>
      <li>Optional: <code>--pages=1-5</code> to scope extraction to a page range</li>
    </ul>

    <h2>## Outputs</h2>
    <ul>
      <li>Plain text by default. Headings preserved as <code>#</code> markers, lists as <code>-</code> bullets</li>

    <h2>## Examples</h2>
    <h3>Basic extraction</h3>
    <p>User: <em>"What's in spec-v2.pdf?"</em> → run <code>extract-pdf ./spec-v2.pdf</code>, then summarize the result.</p>
    <h3>Page range</h3>
    <p>User: <em>"Read the first chapter of book.pdf"</em> → estimate page range from the table of contents, run <code>extract-pdf ./book.pdf --pages=1-22</code>.</p>

    <h2>## Caveats</h2>
    <ul>
      <li>Scanned PDFs without an embedded text layer return empty. Pair with <code>ocr-image</code> for image-based PDFs.</li>
      <li>Tables in irregular layouts (merged cells, rotated text) may extract as flat text.</li>

      { k: "a", t: "WHEN: user mentions a .pdf file" },
      { k: "a", t: "DO: run extract-pdf with the resolved path" },
      { k: "a", t: "THEN: summarize or quote based on user intent" },
      { k: "a", t: "" },
      { k: "a", t: "ALLOWED-TOOLS: read, write" },
      { k: "a", t: "FORBIDDEN-TOOLS: network, exec" },
      { k: "p", t: "" },
      { k: "p", t: "FALLBACK: if PDF is scanned, hand off to ocr-image." },
      { k: "d", t: "PERMISSIONS: see frontmatter" },
      { k: "a", t: "PERMISSIONS: read+write under user cwd only" },
    ],
    cu: [
      { k: "h", t: "# Cursor rule: extract-pdf" },
      { k: "p", t: "" },
      { k: "a", t: "When you need PDF content, invoke extract-pdf." },
      { k: "d", t: "Always extract the entire PDF for full context." },
      { k: "d", t: "Use --format=json by default." },
      { k: "d", t: "Run network probes if extraction fails." },
      { k: "p", t: "" },
      { k: "a", t: "Examples:" },
      { k: "a", t: "  extract-pdf ./spec.pdf" },
      { k: "a", t: "  extract-pdf ./book.pdf --pages=1-22" },
    ],
  }[target];

  const colorize = (t) => {
    return t
      .replace(/^(#+\s.*)/, '<span class="h">$1</span>')
      .replace(/`([^`]+)`/g, '<span class="str">`$1`</span>')
      .replace(/\b(WHEN|DO|THEN|ALLOWED-TOOLS|FORBIDDEN-TOOLS|FALLBACK|PERMISSIONS):/g, '<span class="key">$1</span>:');
  };

  return (
    <>
      {lines.map((ln, i) => (
        <div key={i} className={"ln " + (ln.k === "a" ? "add" : ln.k === "d" ? "del" : "")}>
          <span className="gut">{i + 1}</span>
          <span className="text" dangerouslySetInnerHTML={{ __html: colorize(ln.t) }}/>
        </div>
      ))}
    </>
  );
};
