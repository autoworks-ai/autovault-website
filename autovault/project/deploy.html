<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Deploy a remote vault — AutoVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="docs-shell.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
.deploy-shell {
  max-width: 1280px; margin: 0 auto; padding: 0 40px 80px;
}

/* HERO */
.deploy-hero {
  padding: 64px 0 36px; border-bottom: 1px solid var(--line);
  display: grid; grid-template-columns: 1.4fr 1fr; gap: 56px; align-items: center;
}
.deploy-hero .eyebrow { display: inline-flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 18px; }
.deploy-hero .eyebrow .dash { width: 24px; height: 1px; background: var(--ink-4); }
.deploy-hero .eyebrow .pr {
  font-family: var(--mono); font-size: 10px; padding: 2px 7px; border-radius: 3px;
  background: var(--accent-soft); color: var(--accent); letter-spacing: 0.06em;
}
.deploy-hero h1 { font-size: 48px; line-height: 1.02; letter-spacing: -0.025em; font-weight: 500; margin: 0 0 18px; }
.deploy-hero h1 .ital { font-family: "Instrument Serif", serif; font-style: italic; font-weight: 400; color: var(--accent); }
.deploy-hero .lede { color: var(--ink-2); font-size: 16.5px; line-height: 1.6; max-width: 580px; margin: 0 0 24px; }

.hero-meta { display: flex; gap: 22px; padding: 14px 0 0; border-top: 1px dashed var(--line-2); margin-top: 22px; }
.hero-meta .m { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.hero-meta .m strong { color: var(--ink); font-weight: 500; }

/* Topology diagram */
.topology {
  background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px;
  padding: 22px;
  position: relative;
  font-family: var(--mono); font-size: 11px;
}
.topology .ttl { font-size: 10px; color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 14px; display: flex; justify-content: space-between; }
.topology .ttl .live { display: flex; align-items: center; gap: 6px; color: var(--accent); }
.topology .ttl .live .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: dpulse 1.6s ease-in-out infinite; }
@keyframes dpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

.topology svg { width: 100%; height: auto; display: block; }
.topology .label { fill: var(--ink-2); font-size: 10px; }
.topology .label-d { fill: var(--ink-3); font-size: 9px; }
.topology .ltext { fill: var(--ink); font-size: 10.5px; font-weight: 500; }
.topology .lline { stroke: var(--line-2); stroke-width: 1; }
.topology .ldash { stroke: var(--line-2); stroke-width: 1; stroke-dasharray: 3,3; }
.topology .arrow { fill: var(--ink-3); }
.topology .box-fill-1 { fill: var(--bg-2); stroke: var(--line); }
.topology .box-fill-2 { fill: var(--accent-soft); stroke: var(--accent); }
.topology .box-fill-3 { fill: rgba(180,138,214,0.08); stroke: rgba(180,138,214,0.5); }

/* PROVIDER GRID */
.providers-section { padding: 64px 0 24px; }
.providers-section h2 { font-size: 32px; font-weight: 500; letter-spacing: -0.02em; margin: 0 0 8px; }
.providers-section .lede { color: var(--ink-2); font-size: 14.5px; max-width: 640px; margin: 0 0 32px; line-height: 1.6; }

.providers {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
}
.provider {
  background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px;
  padding: 22px;
  display: flex; flex-direction: column;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
  overflow: hidden;
}
.provider:hover { border-color: var(--accent); transform: translateY(-2px); }
.provider.active { border-color: var(--accent); background: var(--bg); }
.provider.active::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--accent);
}
.provider .head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.provider .logo {
  width: 28px; height: 28px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-weight: 600; font-size: 12px;
  flex-shrink: 0;
}
.provider .name { font-size: 14.5px; font-weight: 500; color: var(--ink); }
.provider .deploy-time {
  font-family: var(--mono); font-size: 10px; color: var(--ink-3);
  margin-left: auto;
  background: var(--bg); padding: 2px 7px; border-radius: 3px;
  letter-spacing: 0.04em;
}
.provider .desc { color: var(--ink-2); font-size: 12.5px; line-height: 1.5; margin-bottom: 16px; flex: 1; }
.provider .feat { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
.provider .feat span {
  font-family: var(--mono); font-size: 9.5px; padding: 2px 6px;
  background: var(--bg); border: 1px solid var(--line); border-radius: 3px;
  color: var(--ink-3);
}
.provider .cta {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 11px; color: var(--accent);
}
.provider .cta .arrow { transition: transform 0.15s; }
.provider:hover .cta .arrow { transform: translateX(3px); }

/* DEPLOY DETAIL */
.deploy-detail {
  margin-top: 28px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg-2);
  overflow: hidden;
}
.deploy-detail .head {
  padding: 18px 24px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 14px;
  background: var(--panel);
}
.deploy-detail .head .ttl { font-family: var(--mono); font-size: 13px; color: var(--ink); }
.deploy-detail .head .ttl strong { color: var(--accent); }
.deploy-detail .head .copy-btn {
  margin-left: auto;
  font-family: var(--mono); font-size: 11px;
  background: var(--bg); border: 1px solid var(--line-2); color: var(--ink-2);
  padding: 5px 11px; border-radius: 4px; cursor: pointer;
}
.deploy-detail .head .copy-btn:hover { color: var(--accent); border-color: var(--accent); }

.deploy-detail .body {
  display: grid; grid-template-columns: 1.2fr 1fr;
}
.deploy-detail .steps {
  padding: 24px 28px;
  border-right: 1px solid var(--line);
}
.deploy-detail .step {
  display: flex; gap: 16px;
  padding: 14px 0;
  position: relative;
}
.deploy-detail .step:not(:last-child) { border-bottom: 1px dashed var(--line-2); }
.deploy-detail .step .num {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--bg); border: 1px solid var(--line-2);
  font-family: var(--mono); font-size: 11px; color: var(--ink-2);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.deploy-detail .step .body-step { flex: 1; min-width: 0; }
.deploy-detail .step h4 { font-size: 13.5px; font-weight: 500; color: var(--ink); margin: 0 0 4px; letter-spacing: -0.005em; }
.deploy-detail .step p { color: var(--ink-2); font-size: 12.5px; line-height: 1.55; margin: 0 0 8px; }
.deploy-detail .step .cmd {
  background: var(--bg); border: 1px solid var(--line);
  border-radius: 5px; padding: 8px 12px;
  font-family: var(--mono); font-size: 11.5px; color: var(--ink);
  overflow-x: auto;
}
.deploy-detail .step .cmd .pmt { color: var(--accent); margin-right: 8px; }
.deploy-detail .step .cmd .com { color: var(--ink-4); }
.deploy-detail .step .cmd .var { color: #b48ad6; }

.deploy-detail .preview {
  padding: 24px 28px;
  background: var(--bg);
}
.deploy-detail .preview .ttl-prev { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 12px; }

/* terminal-style preview */
.term {
  background: var(--bg-2); border: 1px solid var(--line); border-radius: 6px;
  font-family: var(--mono); font-size: 11.5px; line-height: 1.7;
  overflow: hidden;
}
.term .term-head {
  padding: 7px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 6px;
  font-size: 10px; color: var(--ink-3);
}
.term .term-head .dot { width: 8px; height: 8px; border-radius: 50%; }
.term .term-body { padding: 12px 14px; max-height: 480px; overflow-y: auto; }
.term .term-body div { color: var(--ink-2); }
.term .term-body .pmt { color: var(--accent); }
.term .term-body .ok { color: var(--accent); }
.term .term-body .warn { color: var(--warn); }
.term .term-body .err { color: var(--bad); }
.term .term-body .com { color: var(--ink-4); font-style: italic; }
.term .term-body .url { color: #5a9dd6; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 2px; }
.term .term-body .h { color: var(--ink); font-weight: 600; }
.term .term-body .dim { color: var(--ink-4); }

/* ENV section */
.env-section { padding: 56px 0 28px; }
.env-section h2 { font-size: 28px; font-weight: 500; letter-spacing: -0.02em; margin: 0 0 8px; }
.env-section .lede { color: var(--ink-2); font-size: 14px; max-width: 640px; margin: 0 0 28px; }

.env-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.env-card { background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; }
.env-card .head {
  padding: 12px 16px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px;
  font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase;
}
.env-card .head .req-chip {
  margin-left: auto; padding: 1px 6px; border-radius: 3px;
  font-size: 9px; letter-spacing: 0.06em;
}
.env-card .head .req-chip.req { background: rgba(217,113,113,0.12); color: var(--bad); }
.env-card .head .req-chip.opt { background: var(--bg); color: var(--ink-3); }
.env-row {
  padding: 10px 16px; display: grid; grid-template-columns: 200px 1fr; gap: 14px;
  font-size: 12px; border-bottom: 1px solid var(--line);
  align-items: start;
}
.env-row:last-child { border-bottom: 0; }
.env-row .k { font-family: var(--mono); font-size: 11.5px; color: var(--ink); }
.env-row .v { color: var(--ink-2); line-height: 1.5; }
.env-row .v code { font-family: var(--mono); font-size: 11px; background: var(--bg); border: 1px solid var(--line); padding: 1px 5px; border-radius: 3px; color: var(--ink); }

/* OAUTH FLOW */
.oauth-section { padding: 56px 0 28px; }
.oauth-section h2 { font-size: 28px; font-weight: 500; letter-spacing: -0.02em; margin: 0 0 8px; }
.oauth-section .lede { color: var(--ink-2); font-size: 14px; max-width: 700px; margin: 0 0 28px; line-height: 1.6; }
.oauth-flow {
  background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px;
  padding: 28px;
}
.oauth-flow svg { width: 100%; height: auto; }
.oauth-flow .actor { fill: var(--ink); font-size: 11.5px; font-weight: 500; font-family: "Inter", sans-serif; }
.oauth-flow .step-num { fill: var(--accent); font-size: 9.5px; font-family: var(--mono); font-weight: 600; }
.oauth-flow .step-lbl { fill: var(--ink-2); font-size: 10.5px; font-family: var(--mono); }
.oauth-flow .step-meta { fill: var(--ink-3); font-size: 9.5px; font-family: var(--mono); font-style: italic; }
.oauth-flow .lifeline { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3,4; }
.oauth-flow .arr { stroke: var(--ink-2); stroke-width: 1.2; fill: none; }
.oauth-flow .arr-back { stroke: var(--accent); stroke-width: 1.2; fill: none; stroke-dasharray: 4,3; }
.oauth-flow .arrhead { fill: var(--ink-2); }
.oauth-flow .arrhead-back { fill: var(--accent); }
.oauth-flow .actor-box { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
.oauth-flow .actor-box-acc { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; }

/* SECURITY ROW */
.security-row { padding: 56px 0 28px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.sec-card {
  border: 1px solid var(--line); border-radius: 10px;
  padding: 22px;
  background: var(--bg-2);
}
.sec-card .icon { width: 32px; height: 32px; margin-bottom: 14px; color: var(--accent); }
.sec-card h4 { font-size: 15px; font-weight: 500; color: var(--ink); margin: 0 0 8px; letter-spacing: -0.005em; }
.sec-card p { color: var(--ink-2); font-size: 12.5px; line-height: 1.55; margin: 0; }
.sec-card .meta { margin-top: 12px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); padding-top: 10px; border-top: 1px dashed var(--line-2); }

/* SMOKE SECTION */
.smoke-section { padding: 56px 0 28px; }
.smoke-section h2 { font-size: 28px; font-weight: 500; letter-spacing: -0.02em; margin: 0 0 8px; }
.smoke-section .lede { color: var(--ink-2); font-size: 14px; max-width: 640px; margin: 0 0 28px; }

/* ROUTES TABLE */
.routes-section { padding: 56px 0 36px; }
.routes-section h2 { font-size: 28px; font-weight: 500; letter-spacing: -0.02em; margin: 0 0 8px; }
.routes-section .lede { color: var(--ink-2); font-size: 14px; max-width: 640px; margin: 0 0 28px; }
.routes-table {
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  background: var(--bg-2);
}
.routes-table .h, .routes-table .r {
  display: grid; grid-template-columns: 90px 280px 1fr 130px;
  padding: 11px 18px;
  font-size: 12.5px;
  align-items: center;
}
.routes-table .h {
  background: var(--panel); border-bottom: 1px solid var(--line);
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase;
}
.routes-table .r { border-bottom: 1px solid var(--line); }
.routes-table .r:last-child { border-bottom: 0; }
.routes-table .meth {
  font-family: var(--mono); font-size: 10px; padding: 2px 6px; border-radius: 3px;
  letter-spacing: 0.06em; width: fit-content;
}
.routes-table .meth.GET { background: rgba(90,214,192,0.12); color: var(--accent); }
.routes-table .meth.POST { background: rgba(232,168,102,0.12); color: var(--warn); }
.routes-table .meth.DELETE { background: rgba(217,113,113,0.12); color: var(--bad); }
.routes-table .path { font-family: var(--mono); font-size: 12px; color: var(--ink); }
.routes-table .desc { color: var(--ink-2); font-size: 12.5px; }
.routes-table .scope { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
.routes-table .scope.public { color: var(--accent); }
.routes-table .scope.owner { color: var(--warn); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="docs-shell.jsx"></script>
<script type="text/babel">
const { useState } = React;
const { Topbar, Icon } = window;

const PROVIDERS = {
  railway: {
    name: "Railway",
    short: "RWY",
    logoBg: "#0B0D0E",
    logoFg: "#fff",
    time: "~2 min",
    desc: "One-click template. Provisions Postgres + persistent volume, sets env vars, exposes HTTPS endpoint.",
    feat: ["one-click", "Postgres", "managed TLS", "auto-deploy"],
    steps: [
      {
        h: "Click 'Deploy on Railway'",
        p: "Forks the autovault template into your account. You'll be asked to fill three required env vars before the build starts.",
        cmd: null
      },
      {
        h: "Set required environment",
        p: "Railway prompts for these at template time. They go straight into the deployment config — never committed to git.",
        cmd: <><div><span className="var">AUTOVAULT_ADMIN_EMAIL</span>=admin@example.com</div><div><span className="var">AUTOVAULT_ADMIN_PASSWORD</span>=&lt;long-random-string&gt;</div><div><span className="var">AUTOVAULT_PUBLIC_URL</span>=https://your-vault.up.railway.app</div></>
      },
      {
        h: "Wait for build",
        p: "Build runs npm run build, copies bundled skills, starts the remote service on $PORT. Health check at /healthz.",
        cmd: <><div><span className="com"># Build log tail</span></div><div><span className="pmt">→</span> npm ci</div><div><span className="pmt">→</span> npm run build</div><div><span className="pmt">→</span> node dist/remote.js</div></>
      },
      {
        h: "Connect from your agent",
        p: "Add the MCP endpoint to your agent's config. The first call kicks off the OAuth dance — you'll log in once and the token caches locally.",
        cmd: <><div><span className="pmt">$</span> autovault add autoworks-ai/extract-pdf \\</div><div>    --remote https://your-vault.up.railway.app/mcp</div></>
      }
    ]
  },
  render: {
    name: "Render",
    short: "RND",
    logoBg: "#46E3B7",
    logoFg: "#000",
    time: "~3 min",
    desc: "render.yaml blueprint. Auto-detects, provisions web service + Postgres, manages cert renewal.",
    feat: ["blueprint", "Postgres", "auto-renew TLS", "preview envs"],
    steps: [
      {
        h: "Connect repo",
        p: "Point Render at your fork of the autovault repo. The render.yaml at the root declares the web service and the Postgres add-on.",
        cmd: null
      },
      {
        h: "Set environment group",
        p: "Render's secret manager handles the admin seed. The ADMIN_PASSWORD must be at least 24 chars or the boot check will fail.",
        cmd: <><div><span className="com"># In Render dashboard → Environment Group</span></div><div><span className="var">AUTOVAULT_ADMIN_EMAIL</span>=admin@yourco.com</div><div><span className="var">AUTOVAULT_ADMIN_PASSWORD</span>=...</div></>
      },
      {
        h: "Deploy blueprint",
        p: "Render reads render.yaml, builds the image, runs migrations, starts on port 8080. First boot seeds the admin user from the env vars.",
        cmd: <><div><span className="pmt">→</span> Detected blueprint: render.yaml</div><div><span className="pmt">→</span> Building autovault-web...</div><div><span className="pmt">→</span> Starting service on :8080</div></>
      },
      {
        h: "Verify with smoke script",
        p: "Run the bundled remote smoke script against your live deployment. It walks the full OAuth flow and calls a real MCP tool.",
        cmd: <><div><span className="pmt">$</span> AUTOVAULT_REMOTE_URL=https://you.onrender.com \\</div><div>    npm run smoke:remote</div></>
      }
    ]
  },
  docker: {
    name: "Docker",
    short: "DKR",
    logoBg: "#2496ED",
    logoFg: "#fff",
    time: "~5 min",
    desc: "Self-host with Compose. Brings up the remote MCP service, SQLite volume, and reverse proxy in one command.",
    feat: ["self-hosted", "SQLite", "Compose", "BYO TLS"],
    steps: [
      {
        h: "Pull image and seed env",
        p: "The container defaults to remote mode in 0.4. Compose now requires explicit admin credentials — no fallback default.",
        cmd: <><div><span className="pmt">$</span> docker pull autoworks/autovault:0.4.1</div><div><span className="pmt">$</span> cp .env.example .env</div><div><span className="pmt">$</span> $EDITOR .env <span className="com"># set ADMIN_EMAIL + ADMIN_PASSWORD</span></div></>
      },
      {
        h: "Validate compose",
        p: "Compose now hard-fails if the admin vars are unset. This is the breaking change in 0.4 — no more shipping with a known default password.",
        cmd: <><div><span className="pmt">$</span> docker compose config</div><div><span className="ok">  ✓</span> AUTOVAULT_ADMIN_EMAIL set</div><div><span className="ok">  ✓</span> AUTOVAULT_ADMIN_PASSWORD set (32 chars)</div></>
      },
      {
        h: "Bring it up",
        p: "Service binds to 8080 inside the container. Mount your reverse proxy (Caddy / Traefik / nginx) in front for TLS.",
        cmd: <><div><span className="pmt">$</span> docker compose up -d</div><div><span className="ok">  ✓</span> autovault-remote   running on :8080</div><div><span className="ok">  ✓</span> autovault-data     volume mounted</div></>
      },
      {
        h: "Test the MCP endpoint",
        p: "POST a discovery request to /mcp. A valid response confirms transport, auth middleware, and CORS are all wired up correctly.",
        cmd: <><div><span className="pmt">$</span> curl -X POST https://your.vault/mcp \\</div><div>    -H 'Content-Type: application/json' \\</div><div>    -d '{`{"method":"initialize"}`}'</div></>
      }
    ]
  },
  fly: {
    name: "Fly.io",
    short: "FLY",
    logoBg: "#7B16FF",
    logoFg: "#fff",
    time: "~4 min",
    desc: "fly.toml + LiteFS. Multi-region replication of the SQLite vault, edge-deployed close to your agents.",
    feat: ["multi-region", "LiteFS", "anycast", "TLS edge"],
    steps: [
      {
        h: "Launch from repo",
        p: "fly launch detects fly.toml, creates the app, provisions a LiteFS-backed volume for the SQLite vault.",
        cmd: <><div><span className="pmt">$</span> fly launch --config fly.toml</div></>
      },
      {

const OAuthFlow = () => {
  // 4 actors: User Agent, Browser, /oauth, MCP
  const cols = [80, 220, 380, 540];
  const lblY = 30;
  const lifelineTop = 50;
  const lifelineBottom = 460;

  const steps = [
    { from: 0, to: 1, n: "1", lbl: "open authorize URL", meta: "PKCE challenge", y: 80 },
    { from: 1, to: 2, n: "2", lbl: "GET /oauth/authorize", meta: "code_challenge + redirect_uri", y: 130 },
    { from: 2, to: 1, n: "3", lbl: "consent screen", meta: "session cookie set", y: 180, back: true },
    { from: 1, to: 0, n: "4", lbl: "redirect with code", meta: "?code=...&state=...", y: 230, back: true },
    { from: 0, to: 2, n: "5", lbl: "POST /oauth/token", meta: "code + verifier", y: 290 },
    { from: 2, to: 0, n: "6", lbl: "access + refresh tokens", meta: "scopes: read write", y: 340, back: true },
    { from: 0, to: 3, n: "7", lbl: "POST /mcp", meta: "Authorization: Bearer …", y: 400 },
    { from: 3, to: 0, n: "8", lbl: "tool result", meta: "policy-filtered by scope", y: 440, back: true },
  ];

  return (
    <svg viewBox="0 0 620 480" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="oa-r" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" className="arrhead"/>
        </marker>
        <marker id="oa-l" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto">
          <path d="M6,0 L0,3 L6,6 Z" className="arrhead-back"/>
        </marker>
      </defs>

      {/* actor headers */}
      {[
        { x: cols[0], lbl: "Agent CLI", acc: false },
        { x: cols[1], lbl: "Browser", acc: false },
        { x: cols[2], lbl: "/oauth/*", acc: true },
        { x: cols[3], lbl: "/mcp", acc: true },
      ].map((a, i) => (
        <g key={i}>
          <rect x={a.x - 50} y={lblY - 14} width="100" height="28" rx="4" className={a.acc ? "actor-box-acc" : "actor-box"}/>
          <text x={a.x} y={lblY + 5} textAnchor="middle" className="actor">{a.lbl}</text>
          <line x1={a.x} y1={lifelineTop} x2={a.x} y2={lifelineBottom} className="lifeline"/>
        </g>
      ))}

      {steps.map((s, i) => {
        const x1 = cols[s.from], x2 = cols[s.to];
        const back = !!s.back;
        const cls = back ? "arr-back" : "arr";
        const marker = back ? "url(#oa-l)" : "url(#oa-r)";
        const left = Math.min(x1, x2), right = Math.max(x1, x2);
        const mid = (left + right) / 2;
        return (
          <g key={i}>
            <line x1={x1} y1={s.y} x2={x2} y2={s.y} className={cls} markerEnd={marker}/>
            <text x={mid} y={s.y - 11} textAnchor="middle" className="step-num">{s.n}</text>
            <text x={mid} y={s.y - 1} textAnchor="middle" className="step-lbl">{s.lbl}</text>
            <text x={mid} y={s.y + 13} textAnchor="middle" className="step-meta">{s.meta}</text>
          </g>
        );
      })}
    </svg>
  );
};

            <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3" strokeLinecap="round"/></svg>
            <h4>PKCE is mandatory</h4>
            <p>The <code style={{ fontFamily: "var(--mono)", fontSize: 11, color: "var(--ink)" }}>/oauth/authorize</code> endpoint rejects requests without a <code style={{ fontFamily: "var(--mono)", fontSize: 11, color: "var(--ink)" }}>code_challenge</code> — no fallback to plain auth-code. Refresh tokens rotate on use and the previous one is invalidated.</p>
            <div className="meta">src/remote/auth.ts</div>
          </div>
          <div className="sec-card">
            <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M3 12a9 9 0 1 1 18 0 9 9 0 0 1-18 0z"/><path d="M3 12h18M12 3a13 13 0 0 1 0 18M12 3a13 13 0 0 0 0 18" strokeLinecap="round"/></svg>
            <h4>CORS &amp; origin pinning</h4>
            <p>Browser access is opt-in. <code style={{ fontFamily: "var(--mono)", fontSize: 11, color: "var(--ink)" }}>AUTOVAULT_ALLOWED_ORIGINS</code> is a strict allowlist; pre-flight responses include only the origins you list. Server-to-server calls (no Origin header) bypass cleanly.</p>
