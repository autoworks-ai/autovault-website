<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Authoring skills — AutoVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="docs-shell.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
.au-hero { padding-bottom: 40px; border-bottom: 1px solid var(--line); margin-bottom: 40px; }
.au-hero h1 { font-size: 52px; line-height: 1.02; }

/* annotated SKILL.md viewer */
.skill-viewer {
  display: grid; grid-template-columns: minmax(0, 1.1fr) 1fr; gap: 0;
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  margin: 24px 0 32px;
  background: var(--bg-2);
}
.skill-code {
  padding: 0;
  font-family: var(--mono); font-size: 12.5px; line-height: 1.7;
  background: var(--bg-2);
  border-right: 1px solid var(--line);
  overflow: hidden;
}
.skill-code .file-head {
  padding: 10px 16px; border-bottom: 1px solid var(--line);
  background: var(--panel);
  display: flex; align-items: center; gap: 10px;
  font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em;
}
.skill-code .file-head .name { color: var(--ink); font-weight: 500; }
.skill-code pre { margin: 0; padding: 16px 0; }
.skill-code .ln {
  display: grid; grid-template-columns: 36px 1fr; align-items: start;
  padding: 0 16px 0 0;
  cursor: pointer;
  transition: background 120ms;
}
.skill-code .ln:hover { background: rgba(255,255,255,0.02); }
.skill-code .ln.active { background: rgba(90,214,192,0.06); border-left: 2px solid var(--accent); padding-left: 14px; }
.skill-code .ln-num { color: var(--ink-4); text-align: right; padding-right: 14px; user-select: none; font-size: 11px; padding-top: 2px; }
.skill-code .ln-text { color: var(--ink); white-space: pre; }
.skill-code .k { color: var(--accent); }
.skill-code .s { color: var(--warn); }
.skill-code .c { color: var(--ink-4); font-style: italic; }
.skill-code .num { color: #b48ad6; }
.skill-code .head { color: var(--ink-2); font-weight: 500; }

.skill-explain {
  padding: 20px 24px;
  position: sticky; top: 60px; align-self: start;
  background: var(--bg);
}
.skill-explain .ex-head {
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
  letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.skill-explain .ex-head .lns {
  background: var(--panel); border: 1px solid var(--line); padding: 2px 8px; border-radius: 3px;
  color: var(--accent);
}
.skill-explain h3 { margin: 0 0 12px; font-size: 18px; letter-spacing: -0.015em; }
.skill-explain .body { color: var(--ink-2); font-size: 13.5px; line-height: 1.6; }
.skill-explain .body p { margin: 0 0 12px; }
.skill-explain .body code { background: var(--panel); border: 1px solid var(--line); padding: 1px 6px; border-radius: 3px; font-family: var(--mono); font-size: 11.5px; color: var(--accent); }

/* validation playground */
.playground {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  margin: 32px 0;
  overflow: hidden;
}
.playground-head {
  padding: 18px 24px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px;
}
.playground-head .badge { background: var(--accent-soft); color: var(--accent); font-family: var(--mono); font-size: 10.5px; padding: 3px 8px; border-radius: 3px; letter-spacing: 0.04em; }
.playground-head .ttl { font-size: 16px; font-weight: 500; }
.playground-head .run-btn { margin-left: auto; padding: 8px 16px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; font: inherit; font-weight: 600; font-size: 13px; cursor: pointer; }
.playground-head .run-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.playground-grid { display: grid; grid-template-columns: 1fr 1fr; }
.playground-input { border-right: 1px solid var(--line); }
.playground-input .input-head, .playground-output .output-head {
  padding: 10px 18px; background: var(--bg-2); border-bottom: 1px solid var(--line);
  font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em;
}
.playground textarea {
  width: 100%; background: var(--bg); border: 0;
  color: var(--ink); font-family: var(--mono); font-size: 12.5px; line-height: 1.7;
  padding: 16px 18px; resize: none; min-height: 280px;
  outline: none;
}
.playground-output { background: var(--bg-2); }
.playground-output .out-body { padding: 16px 18px; min-height: 280px; font-family: var(--mono); font-size: 12.5px; line-height: 1.85; }
.check-row { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: center; padding: 4px 0; }
.check-row .check-icn { width: 14px; height: 14px; border-radius: 50%; display: grid; place-items: center; font-size: 9px; }
.check-row.ok .check-icn { background: var(--accent); color: var(--accent-ink); }
.check-row.warn .check-icn { background: var(--warn); color: #2a1a08; }
.check-row.fail .check-icn { background: var(--bad); color: #1c0c0c; }
.check-row.pending .check-icn { background: var(--panel); border: 1px solid var(--line-2); color: var(--ink-3); }
.check-row .check-name { color: var(--ink); font-size: 13px; }
.check-row .check-detail { color: var(--ink-3); font-size: 11px; font-family: var(--mono); }

/* DO / DON'T */
.dodont { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0 24px; }
.dodont .col {
  border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px;
  background: var(--panel);
}
.dodont .col.do { border-color: rgba(90,214,192,0.3); background: rgba(90,214,192,0.04); }
.dodont .col.dont { border-color: rgba(217,113,113,0.3); background: rgba(217,113,113,0.03); }
.dodont .head {
  display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
}
.dodont .col.do .head { color: var(--accent); }
.dodont .col.dont .head { color: var(--bad); }
.dodont ul { padding-left: 18px; margin: 0; color: var(--ink-2); font-size: 13px; line-height: 1.6; }
.dodont li { margin-bottom: 6px; }

/* MANIFEST */
.man-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin: 16px 0 24px; }
.man-card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; }
.man-card .agent { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.man-card .agent .dot { width: 8px; height: 8px; border-radius: 2px; }
.man-card .map { font-family: var(--mono); font-size: 11.5px; line-height: 1.7; }
.man-card .map .from { color: var(--ink-3); }
.man-card .map .arrow { color: var(--ink-4); margin: 0 6px; }
.man-card .map .to { color: var(--accent); }

/* PROCESS RIBBON */
.process-ribbon {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 0;
  margin: 24px 0 32px;
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  background: var(--panel);
}
.process-ribbon .step {
  padding: 18px 20px; border-right: 1px solid var(--line); position: relative;
}
.process-ribbon .step:last-child { border-right: 0; }
.process-ribbon .step .num { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.06em; }
.process-ribbon .step .ttl { font-size: 13.5px; font-weight: 500; margin-top: 4px; }
.process-ribbon .step .sub { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="docs-shell.jsx"></script>
<script type="text/babel">
const { useState } = React;
const { Topbar, Sidebar, TOC, Code, Callout, Breadcrumbs, Pager, Icon } = window;

/* Annotated SKILL.md — each line group has a hover-explanation */
const SKILL_LINES = [
  { id: "fm-open", text: "---", group: "fm" },
  { id: "fm-name", text: "name: extract-pdf", group: "id" },
  { id: "fm-version", text: "version: 1.4.0", group: "id" },
  { id: "fm-desc", text: 'description: "Extract structured text from PDF files."', group: "id" },
  { id: "fm-author", text: "author: autoworks-ai", group: "id" },
  { id: "fm-license", text: "license: Apache-2.0", group: "id" },
  { id: "blank-1", text: "", group: null },
  { id: "tools-key", text: "tools_required:", group: "tools" },
  { id: "t-1", text: "  - browser.fill_form", group: "tools" },
  { id: "t-2", text: "  - browser.click", group: "tools" },
  { id: "t-3", text: "  - fs.read", group: "tools" },
  { id: "t-4", text: "  - fs.write", group: "tools" },
  { id: "blank-2", text: "", group: null },
  { id: "trans-key", text: "transformations:", group: "trans" },
  { id: "tr-1", text: "  claude-code:", group: "trans" },
  { id: "tr-2", text: "    browser.fill_form: chrome-devtools", group: "trans" },
  { id: "tr-3", text: "    fs.read: read", group: "trans" },
  { id: "tr-4", text: "  codex:", group: "trans" },
  { id: "tr-5", text: "    browser.fill_form: browser_form", group: "trans" },
  { id: "tr-6", text: "    fs.read: file_read", group: "trans" },
  { id: "blank-3", text: "", group: null },
  { id: "perm-key", text: "permissions:", group: "perm" },
  { id: "perm-1", text: "  network: false", group: "perm" },
  { id: "perm-2", text: "  fs_scope: [\"./inputs\", \"./outputs\"]", group: "perm" },
  { id: "perm-3", text: "  egress: deny", group: "perm" },
  { id: "blank-4", text: "", group: null },
  { id: "fm-close", text: "---", group: "fm" },
  { id: "blank-5", text: "", group: null },
  { id: "h1", text: "# Extract PDF text", group: "body" },
  { id: "blank-6", text: "", group: null },
  { id: "p1", text: "Use this skill when the user provides a PDF path", group: "body" },
  { id: "p2", text: "and asks for its text contents, structure, or", group: "body" },
  { id: "p3", text: "summarization. Returns markdown with preserved", group: "body" },
  { id: "p4", text: "headings, lists, and table layout where possible.", group: "body" },
];

const EXPLAIN = {
  fm: {
    lines: "L1, L27",
    title: "YAML frontmatter delimiters",
    body: <>
      <p>The skill begins and ends its frontmatter with <code>---</code>. Everything between is structured metadata; everything after is markdown the agent reads as instructions.</p>
      <p>The validation gate parses this block first. <strong>YAML auto-repair</strong> handles common breakage — trailing commas, mixed indentation, unquoted special chars — before the strict schema check.</p>
    </>,
  },
  id: {
    lines: "L2–L6",
    title: "Identity block",
    body: <>
      <p>These six fields uniquely identify a skill in the vault. <code>name</code> + <code>version</code> together form the lookup key; <code>author</code> participates in the provenance chain when the skill is signed.</p>
      <p><strong>Naming:</strong> kebab-case, scoped roughly to a verb-object (e.g. <code>extract-pdf</code>, <code>parse-csv</code>, <code>summarize-doc</code>). Avoid generic names like <code>tools</code> or <code>helpers</code> — the dedup gate flags them aggressively.</p>
    </>,
  },
  tools: {
    lines: "L8–L12",
    title: "Canonical tool requirements",
    body: <>
      <p>The skill declares what it needs in <strong>canonical capability names</strong> — a stable namespace AutoVault maintains, independent of any specific agent's vocabulary.</p>
      <p>This is the part the gate's capability/behavior check audits. If the skill body uses <code>fs.read</code> but never declares it here, or declares it but never uses it, the skill is rejected.</p>
    </>,
  },
  trans: {
    lines: "L14–L20",
    title: "Per-caller transformation",
    body: <>
      <p>The transformation manifest maps each canonical capability to the actual tool name the calling agent expects. Same skill, three rendered views — written once.</p>
      <p>If a tool isn't mapped for a given agent, the skill renders without that capability and the gate emits a warning at scope-time. Agents you haven't mapped fall through to the canonical name (which usually fails — that's the point).</p>
    </>,
  },
  perm: {
    lines: "L22–L25",
    title: "Permission boundaries",
    body: <>
      <p>The skill declares its own runtime boundaries. <code>network: false</code> tells the host agent to refuse outbound HTTP from this skill's tool calls. <code>fs_scope</code> restricts filesystem access to specific path prefixes.</p>
      <p>These are enforced by <em>the agent</em> at execution time, not by AutoVault. AutoVault is content provider, not executor — but it surfaces the declared boundary so callers know what they're admitting.</p>
    </>,
  },
  body: {
    lines: "L29–L33",
    title: "Skill body",
    body: <>
      <p>Plain markdown. This is what the agent reads and follows when the skill is loaded into context. Keep it tight: under 200 tokens for a skill of this size, under 500 for anything bigger.</p>
      <p><strong>Progressive disclosure:</strong> AutoVault returns only the frontmatter from <code>list_skills</code> calls. The full body is loaded on demand via <code>get_skill</code>, so a vault of 200 skills doesn't burn tokens at startup.</p>
    </>,
  },
};

const colorize = (text) => {
  // Crude YAML/MD coloring
  if (/^---$/.test(text)) return <span className="head">{text}</span>;
  if (/^#/.test(text)) return <span className="head">{text}</span>;
  const m = text.match(/^(\s*)(-?\s*[\w_.]+:)(.*)$/);
  if (m) {
    return <>{m[1]}<span className="k">{m[2]}</span><span className="s">{m[3]}</span></>;
  }
  if (/^\s*-\s/.test(text)) {
    return <span className="s">{text}</span>;
  }
  return <span>{text}</span>;
};

const SkillViewer = () => {
  const [hovered, setHovered] = useState("trans");
  const ex = EXPLAIN[hovered] || EXPLAIN.fm;
  return (
    <div className="skill-viewer">
      <div className="skill-code">
        <div className="file-head">
          <span style={{ color: "var(--accent)" }}>● SIGNED</span>
          <span className="name">extract-pdf/SKILL.md</span>
          <span style={{ marginLeft: "auto" }}>33 lines · ed25519</span>
        </div>
        <pre>
          {SKILL_LINES.map((l, i) => (
            <div
              key={l.id}
              className={"ln" + (l.group === hovered ? " active" : "")}
              onMouseEnter={() => l.group && setHovered(l.group)}
            >
              <span className="ln-num">{i + 1}</span>
              <span className="ln-text">{l.text === "" ? " " : colorize(l.text)}</span>
            </div>
          ))}
        </pre>
      </div>
      <div className="skill-explain">
        <div className="ex-head">
          <span>Explainer</span>
          <span className="lns">{ex.lines}</span>
        </div>
        <h3>{ex.title}</h3>
        <div className="body">{ex.body}</div>
      </div>
    </div>
  );
};

/* Validation playground */
const Playground = () => {
  const [src, setSrc] = useState(`---
name: weather
version: 0.1.0
description: "Get the weather"
tools_required:
  - http.fetch
permissions:
  network: true
---

# Weather

Fetch the current weather for a location.`);
  const [running, setRunning] = useState(false);
  const [results, setResults] = useState(null);

  const run = () => {
    setRunning(true);
    setResults(null);
    const checks = [];
    setTimeout(() => {
      checks.push({ name: "yaml-repair", status: "ok", detail: "frontmatter clean · 0 fixes applied" });
      setResults([...checks]);
    }, 400);
    setTimeout(() => {
      checks.push({ name: "denylist", status: "ok", detail: "no known-bad patterns matched" });
      setResults([...checks]);
    }, 800);
    setTimeout(() => {
      const has = src.includes("http.fetch");
      const used = /fetch|http|api|curl/i.test(src.split("---").pop() || "");
      checks.push({
        name: "capability/behavior",
        status: has && !used ? "warn" : "ok",
        detail: has && !used ? "declared http.fetch never appears in body" : "declared = observed",
      });
      setResults([...checks]);
    }, 1200);
    setTimeout(() => {
      checks.push({ name: "dedup (text)", status: "ok", detail: "0 near matches in vault" });
      setResults([...checks]);
    }, 1600);
    setTimeout(() => {
      const hasTrans = src.includes("transformations:");
      checks.push({
        name: "transformation manifest",
        status: hasTrans ? "ok" : "warn",
        detail: hasTrans ? "3 agents mapped" : "no transformations · canonical-only",
      });
      setResults([...checks]);
    }, 1900);
    setTimeout(() => {
      checks.push({ name: "ed25519 sign", status: "ok", detail: "0x" + Math.random().toString(16).slice(2, 6) + "…" + Math.random().toString(16).slice(2, 6) });
      setResults([...checks]);
      setRunning(false);
    }, 2400);
  };

  return (
    <div className="playground">
      <div className="playground-head">
        <span className="badge">PLAYGROUND</span>
        <span className="ttl">Validate this SKILL.md</span>
        <button className="run-btn" onClick={run} disabled={running}>
          {running ? "Running…" : "▶ Run gate"}
        </button>
      </div>
      <div className="playground-grid">
        <div className="playground-input">
          <div className="input-head">SKILL.md · editable</div>
          <textarea value={src} onChange={(e) => setSrc(e.target.value)} spellCheck={false}/>
        </div>
        <div className="playground-output">
          <div className="output-head">Gate output</div>
          <div className="out-body">
            {!results && !running && (
              <div style={{ color: "var(--ink-3)" }}>
                Edit the SKILL.md on the left, then click <strong style={{ color: "var(--ink-2)" }}>Run gate</strong> to see what the validation pipeline says.
              </div>
            )}
            {results && results.map((r, i) => (
              <div key={i} className={"check-row " + r.status}>
                <span className="check-icn">{r.status === "ok" ? "✓" : r.status === "warn" ? "!" : "✕"}</span>
                <span className="check-name">{r.name}</span>
                <span className="check-detail">{r.detail}</span>
              </div>
            ))}
            {running && (
              <div className="check-row pending" style={{ marginTop: 6 }}>
                <span className="check-icn">…</span>
                <span className="check-name" style={{ color: "var(--ink-3)" }}>checking…</span>
                <span className="check-detail"/>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
};

const App = () => {
  return (
    <>
      <Topbar active="Authoring" />
      <div className="docs-shell">
        <Sidebar active="Anatomy of a SKILL.md" />
        <main className="docs-content">
          <Breadcrumbs trail={[
            { label: "Docs", href: "AutoVault.html" },
            { label: "Authoring" },
            { label: "Anatomy of a SKILL.md" },
          ]} />

          <div className="au-hero">
            <div className="eyebrow"><span className="dash"/> Authoring · 12 min read</div>
            <h1>Write one skill.<br/><span className="ital">Run it everywhere.</span></h1>
            <p className="lede">Authoring an AutoVault skill is writing a single SKILL.md that declares <strong>what it does</strong>, <strong>what it needs</strong>, and <strong>how it should be rendered</strong> for each calling agent. The vault handles the rest — validation, signing, scoping, transformation.</p>
            <div className="pillrow">
              <span className="pill">YAML frontmatter</span>
              <span className="pill">Canonical capabilities</span>
              <span className="pill">Per-caller transform</span>
              <span className="pill">Permission boundaries</span>
            </div>
          </div>

          <h2 id="anatomy">Anatomy of a SKILL.md</h2>
          <p>Hover any block in the file below to see what it does and why it's there. The colored bands show how the validation gate parses each section.</p>

          <SkillViewer />

          <Callout kind="tip" title="The four blocks">
            Every well-formed SKILL.md has exactly these four sections in this order: identity, tools, transformations, permissions — followed by a markdown body. The order matters for the gate's parser; some checks short-circuit on missing prior sections.
          </Callout>

          <h2 id="manifest">The transformation manifest</h2>
          <p>This is the part that distinguishes AutoVault from every other registry. The manifest is a flat dictionary keyed by agent identifier, mapping canonical capability names to whatever each agent calls them.</p>

          <div className="man-grid">
            <div className="man-card">
              <div className="agent"><span className="dot" style={{ background: "#d6a85a" }}/> claude-code</div>
              <div className="map">
                <div><span className="from">browser.fill_form</span><span className="arrow">→</span><span className="to">chrome-devtools</span></div>
                <div><span className="from">browser.click</span><span className="arrow">→</span><span className="to">chrome-devtools</span></div>
                <div><span className="from">fs.read</span><span className="arrow">→</span><span className="to">read</span></div>
                <div><span className="from">fs.write</span><span className="arrow">→</span><span className="to">write</span></div>
              </div>
            </div>
            <div className="man-card">
              <div className="agent"><span className="dot" style={{ background: "#5a9dd6" }}/> codex</div>
              <div className="map">
                <div><span className="from">browser.fill_form</span><span className="arrow">→</span><span className="to">browser_form</span></div>
                <div><span className="from">browser.click</span><span className="arrow">→</span><span className="to">browser_click</span></div>
                <div><span className="from">fs.read</span><span className="arrow">→</span><span className="to">file_read</span></div>
                <div><span className="from">fs.write</span><span className="arrow">→</span><span className="to">file_write</span></div>
              </div>
            </div>
            <div className="man-card">
              <div className="agent"><span className="dot" style={{ background: "#b48ad6" }}/> cursor</div>
              <div className="map">
                <div><span className="from">browser.fill_form</span><span className="arrow">→</span><span className="to">playwright_fill_form</span></div>
                <div><span className="from">browser.click</span><span className="arrow">→</span><span className="to">playwright_click</span></div>
                <div><span className="from">fs.read</span><span className="arrow">→</span><span className="to">fs_read</span></div>
                <div><span className="from">fs.write</span><span className="arrow">→</span><span className="to">fs_write</span></div>
              </div>
            </div>
          </div>

          <p>You don't have to map every agent. Unmapped agents fall through to the canonical name — which usually fails, which is intentional. Better to fail loudly with <code>tool browser.fill_form not found</code> than silently with a confused caller.</p>

          <h3>Adding a new agent target</h3>
          <p>If your team uses an agent we haven't mapped, just add it to the manifest. The renderer will use it as soon as the next scope refresh fires.</p>

          <Code lang="yaml" file="extract-pdf/SKILL.md (excerpt)">
            <span className="k">transformations:</span>{"\n"}
            <span className="ind">  </span><span className="k">our-internal-agent:</span>{"\n"}
            <span className="ind">    </span><span className="k">browser.fill_form:</span> <span className="s">tool_browser_form_v2</span>{"\n"}
            <span className="ind">    </span><span className="k">browser.click:</span> <span className="s">tool_browser_click_v2</span>{"\n"}
            <span className="ind">    </span><span className="k">fs.read:</span> <span className="s">read_file</span>{"\n"}
            <span className="ind">    </span><span className="k">fs.write:</span> <span className="s">write_file</span>
          </Code>

          <h2 id="perms">Permissions: declared vs. enforced</h2>
          <p>This trips up new authors, so it's worth being clear: AutoVault is a <strong>content provider</strong>, not an executor. The vault never runs your skill. Permissions you declare are <strong>signals to the host agent</strong> about what the skill expects to do.</p>

          <div className="dodont">
            <div className="col do">
              <div className="head"><Icon.Check/> DO declare</div>
              <ul>
                <li>Every network endpoint or domain prefix the skill calls</li>
                <li>The narrowest filesystem scope that still works</li>
                <li>Whether the skill writes anywhere persistent</li>
                <li>External commands the skill shells out to</li>
              </ul>
            </div>
            <div className="col dont">
              <div className="head"><Icon.X/> DON'T assume</div>
              <ul>
                <li>That the agent will block undeclared network calls (most don't, today)</li>
                <li>That declaring <code>network: true</code> means anything is allowed</li>
                <li>That permission boundaries follow the skill across vault re-export</li>
                <li>That signed = safe — signing proves provenance, not behavior</li>
              </ul>
            </div>
          </div>

          <h2 id="playground">Try the gate yourself</h2>
          <p>This is the same five-step pipeline that runs on every skill admitted to a real vault — minus the actual signing step (we don't have your private key). Edit the SKILL.md and click <strong>Run gate</strong> to see what passes, what warns, and what fails.</p>

          <Playground />

          <Callout kind="warn" title="Common gotcha">
            If you declare <code>http.fetch</code> in <code>tools_required</code> but the skill body never instructs the agent to make HTTP calls, capability/behavior emits a warning. Either remove the unused capability, or write the body to actually use it. Skills don't get to over-declare.
          </Callout>

          <h2 id="publish">Publishing through the gate</h2>
          <p>Once your skill is happy locally, you have two paths to a shareable, validated artifact:</p>

          <div className="process-ribbon">
            <div className="step"><div className="num">PATH A · 01</div><div className="ttl">Push to GitHub</div><div className="sub">Skill lives in a repo</div></div>
            <div className="step"><div className="num">02</div><div className="ttl">Source adapter</div><div className="sub">github:org/repo/skill</div></div>
            <div className="step"><div className="num">03</div><div className="ttl">Gate runs</div><div className="sub">Same five checks</div></div>
            <div className="step"><div className="num">04</div><div className="ttl">Signed by vault</div><div className="sub">ed25519 · provenance</div></div>
            <div className="step"><div className="num">05</div><div className="ttl">Indexed</div><div className="sub">searchable · scopable</div></div>
          </div>

          <p>The other path uses <code>autovault publish</code> to push directly from the CLI — useful for quick iteration, with the same gate enforcement. Either way, the skill is signed against your vault's keypair before it leaves your machine.</p>

          <Code lang="bash">
            <span className="c"># from inside your skill directory</span>{"\n"}
            <span className="p">$</span> <span className="v">autovault</span> <span className="k">publish</span> <span className="k">--gate-only</span>{"\n"}
            <span className="c"># dry-run: tells you what the gate would say without admitting</span>{"\n"}
            {"\n"}
            <span className="p">$</span> <span className="v">autovault</span> <span className="k">publish</span>{"\n"}
            <span className="c"># actually publishes — ed25519 signs and indexes</span>
          </Code>

          <Pager
            prev={{ label: "Quick start", href: "quick-start.html" }}
            next={{ label: "Skills directory", href: "skills-directory.html" }}
          />
        </main>
        <TOC items={[
          ["Anatomy of a SKILL.md", "anatomy"],
          ["Transformation manifest", "manifest"],
          ["Permissions", "perms"],
          ["Try the gate", "playground"],
          ["Publishing", "publish"],
        ]}/>
      </div>
    </>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
