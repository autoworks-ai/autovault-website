<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Security & provenance — AutoVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="docs-shell.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
.sec-page { max-width: 1200px; margin: 0 auto; padding: 0 32px; }

.sec-hero {
  padding: 56px 0 48px;
  display: grid; grid-template-columns: 1.15fr 1fr; gap: 56px; align-items: center;
}
.sec-hero h1 { font-size: 56px; line-height: 1.0; letter-spacing: -0.035em; font-weight: 500; margin: 0 0 18px; }
.sec-hero .lede { color: var(--ink-2); font-size: 17px; line-height: 1.55; max-width: 540px; }

/* Verification panel — looks like a real verifier */
.verifier {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  font-family: var(--mono); font-size: 12.5px;
}
.verifier-head {
  padding: 14px 18px; border-bottom: 1px solid var(--line);
  background: var(--panel);
  display: flex; align-items: center; gap: 10px;
}
.verifier-head .lights { display: flex; gap: 5px; }
.verifier-head .lights span { width: 9px; height: 9px; border-radius: 50%; background: #2a3038; }
.verifier-head .ttl { color: var(--ink-3); font-size: 11px; letter-spacing: 0.04em; margin-left: auto; }

.verifier-input { padding: 16px 20px; border-bottom: 1px solid var(--line); background: var(--bg); }
.verifier-input .row { display: flex; align-items: center; gap: 10px; }
.verifier-input .pmt { color: var(--accent); }
.verifier-input input {
  flex: 1; background: transparent; border: 0; color: var(--ink); font: inherit; outline: none;
}
.verifier-input .actions { display: flex; gap: 8px; margin-top: 8px; }
.verifier-input .vbtn {
  padding: 5px 11px; border: 1px solid var(--line-2); border-radius: 4px;
  background: var(--panel); color: var(--ink-2); font: inherit; font-size: 10.5px;
  cursor: pointer; text-transform: uppercase; letter-spacing: 0.04em;
  transition: all 120ms;
}
.verifier-input .vbtn:hover { color: var(--ink); border-color: var(--ink-4); }
.verifier-input .vbtn.run { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }

.verifier-body { padding: 18px 20px; min-height: 220px; line-height: 1.85; }
.verifier-body .ln { display: flex; gap: 8px; padding: 1px 0; }
.verifier-body .ln .lab { color: var(--ink-3); width: 110px; flex-shrink: 0; }
.verifier-body .ln .v { color: var(--ink); }
.verifier-body .ln .v.ok { color: var(--accent); }
.verifier-body .ln .v.err { color: var(--bad); }
.verifier-body .ln .v.warn { color: var(--warn); }
.verifier-body .ln .v.dim { color: var(--ink-3); }
.verifier-body .verdict {
  margin-top: 16px; padding: 12px 16px; border-radius: 6px;
  background: var(--accent-soft); border: 1px solid rgba(90,214,192,0.3);
  color: var(--accent); display: flex; align-items: center; gap: 10px;
}
.verifier-body .verdict.fail { background: rgba(217,113,113,0.06); border-color: rgba(217,113,113,0.3); color: var(--bad); }
.verifier-body .verdict .seal {
  width: 24px; height: 24px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink);
}
.verifier-body .verdict.fail .seal { background: var(--bad); color: #1c0c0c; }

/* Sections */
.sec-section { padding: 64px 0; border-top: 1px solid var(--line); }
.sec-section h2 { font-size: 32px; line-height: 1.1; letter-spacing: -0.025em; font-weight: 500; margin: 0 0 14px; max-width: 800px; }
.sec-section .sub { color: var(--ink-2); max-width: 720px; font-size: 15.5px; margin: 0; }
.sec-section .eyebrow {
  display: inline-flex; align-items: center; gap: 8px; margin-bottom: 16px;
  font-family: var(--mono); font-size: 11px; color: var(--ink-3);
  letter-spacing: 0.08em; text-transform: uppercase;
}
.sec-section .eyebrow .dash { width: 18px; height: 1px; background: var(--ink-4); }

/* TRUST MODEL DIAGRAM */
.trust-diagram {
  margin-top: 36px;
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0;
  border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  background: var(--panel);
}
.trust-col { padding: 28px 28px 32px; border-right: 1px solid var(--line); position: relative; }
.trust-col:last-child { border-right: 0; }
.trust-col .role {
  display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px;
  border-radius: 100px; background: var(--bg); border: 1px solid var(--line-2);
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 18px;
}
.trust-col h3 { font-size: 19px; letter-spacing: -0.02em; font-weight: 500; margin: 0 0 12px; }
.trust-col .desc { color: var(--ink-2); font-size: 13.5px; line-height: 1.55; margin-bottom: 18px; }

.trust-col .obj {
  background: var(--bg); border: 1px solid var(--line-2); border-radius: 8px;
  padding: 14px 16px; margin-bottom: 12px;
  display: flex; align-items: center; gap: 12px;
}
.trust-col .obj .seal {
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
}
.trust-col .obj .seal.signed { background: var(--accent-soft); color: var(--accent); border: 1px solid rgba(90,214,192,0.3); }
.trust-col .obj .seal.scoped { background: rgba(180,138,214,0.1); color: #b48ad6; border: 1px solid rgba(180,138,214,0.3); }
.trust-col .obj .seal.executed { background: rgba(232,168,102,0.08); color: var(--warn); border: 1px solid rgba(232,168,102,0.3); }
.trust-col .obj .name { font-family: var(--mono); font-size: 12.5px; color: var(--ink); }
.trust-col .obj .det { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); margin-top: 2px; }

.trust-col .resp { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.04em; margin-top: 18px; }
.trust-col .resp ul { margin: 6px 0 0; padding-left: 16px; line-height: 1.7; }
.trust-col .resp li { color: var(--ink-2); font-family: var(--sans); letter-spacing: normal; font-size: 12.5px; }

.trust-arrow {
  position: absolute; right: -10px; top: 50%; transform: translateY(-50%);
  width: 20px; height: 20px; background: var(--bg);
  border: 1px solid var(--line); border-radius: 50%;
  display: grid; place-items: center; z-index: 2;
  font-family: var(--mono); font-size: 11px; color: var(--ink-3);
}

/* GATE STAGE READOUT */
.gate-stages-board {
  margin-top: 36px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  overflow: hidden;
}
.gsb-head {
  padding: 18px 24px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 16px;
}
.gsb-head .ttl { font-size: 16px; font-weight: 500; }
.gsb-head .meta { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em; margin-left: auto; }

.gsb-grid { display: grid; grid-template-columns: repeat(5, 1fr); }
.gsb-stage { padding: 24px 22px; border-right: 1px solid var(--line); }
.gsb-stage:last-child { border-right: 0; }
.gsb-stage .stnum { font-family: var(--mono); font-size: 10.5px; color: var(--accent); letter-spacing: 0.06em; }
.gsb-stage h4 { font-size: 15px; font-weight: 500; letter-spacing: -0.015em; margin: 6px 0 8px; }
.gsb-stage .stdesc { font-size: 12.5px; color: var(--ink-3); line-height: 1.5; margin-bottom: 14px; }
.gsb-stage .strow {
  display: flex; align-items: center; gap: 8px; padding: 5px 0;
  font-family: var(--mono); font-size: 11px;
}
.gsb-stage .strow .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.gsb-stage .strow .dot.ok { background: var(--accent); }
.gsb-stage .strow .dot.warn { background: var(--warn); }
.gsb-stage .strow .lbl { color: var(--ink-2); flex: 1; font-size: 11.5px; }
.gsb-stage .strow .num { color: var(--ink-3); }

/* DENYLIST INSPECTOR */
.deny-grid { display: grid; grid-template-columns: 1fr 320px; gap: 24px; margin-top: 36px; }
.deny-list {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  overflow: hidden;
}
.deny-list-head { padding: 14px 18px; background: var(--bg-2); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em; }
.deny-list-head .count { color: var(--accent); }
.deny-row {
  display: grid; grid-template-columns: 30px 110px 1fr 100px 60px;
  gap: 12px; align-items: center;
  padding: 10px 18px; border-bottom: 1px solid var(--line);
  font-family: var(--mono); font-size: 12px;
  cursor: pointer; transition: background 120ms;
}
.deny-row:last-child { border-bottom: 0; }
.deny-row:hover { background: var(--bg-2); }
.deny-row .sev { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 9px; }
.deny-row .sev.crit { background: var(--bad); color: #1c0c0c; }
.deny-row .sev.high { background: var(--warn); color: #2a1a08; }
.deny-row .sev.med { background: var(--ink-4); color: var(--bg); }
.deny-row .id { color: var(--accent); }
.deny-row .pat { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.deny-row .src { color: var(--ink-3); }
.deny-row .age { color: var(--ink-4); text-align: right; font-size: 10.5px; }

.deny-side {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 20px 22px; display: flex; flex-direction: column; gap: 16px;
}
.deny-side h4 { font-size: 14px; font-weight: 500; margin: 0; }
.deny-side .denynum {
  font-size: 36px; font-weight: 500; letter-spacing: -0.025em; line-height: 1;
}
.deny-side .denynum .of { font-family: var(--mono); font-size: 14px; color: var(--ink-3); margin-left: 6px; font-weight: 400; }
.deny-side .breakdown { display: grid; gap: 8px; }
.deny-side .bd-row { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
.deny-side .bd-row .bar { flex: 1; height: 4px; background: var(--bg); border-radius: 2px; overflow: hidden; }
.deny-side .bd-row .bar > div { height: 100%; }
.deny-side .bd-row .lbl { width: 70px; color: var(--ink-2); font-family: var(--mono); font-size: 11px; }
.deny-side .bd-row .num { width: 28px; text-align: right; color: var(--ink-3); font-family: var(--mono); font-size: 11px; }

/* PROVENANCE CHAIN */
.prov-chain {
  margin-top: 36px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 32px;
  font-family: var(--mono); font-size: 12px;
  position: relative;
  overflow: hidden;
}
.prov-chain::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(circle at 50% 0%, rgba(90,214,192,0.05), transparent 60%);
  pointer-events: none;
}
.prov-grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px;
  position: relative;
}
.prov-link {
  background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px;
  padding: 16px;
  position: relative;
}
.prov-link::after {
  content: ""; position: absolute; top: 50%; right: -16px;
  width: 16px; height: 1px; background: var(--accent);
  opacity: 0.5;
}
.prov-link:last-child::after { display: none; }
.prov-link .role { font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.04em; }
.prov-link .id { color: var(--accent); margin-top: 6px; font-size: 12px; word-break: break-all; }
.prov-link .when { color: var(--ink-4); font-size: 10.5px; margin-top: 4px; }

/* DISCLOSURE / CONTACT */
.disc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 36px; }
.disc-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 28px 30px;
}
.disc-card h3 { font-size: 18px; font-weight: 500; letter-spacing: -0.015em; margin: 0 0 8px; }
.disc-card p { color: var(--ink-2); font-size: 13.5px; line-height: 1.55; margin: 0 0 14px; }
.disc-card .kv {
  display: grid; grid-template-columns: 110px 1fr; gap: 8px 16px;
  font-family: var(--mono); font-size: 12px;
  border-top: 1px solid var(--line); padding-top: 14px;
}
.disc-card .kv .k { color: var(--ink-3); letter-spacing: 0.02em; }
.disc-card .kv .v { color: var(--ink); }
.disc-card .kv .v.accent { color: var(--accent); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="docs-shell.jsx"></script>
<script type="text/babel">
const { useState } = React;
const { Topbar, Icon } = window;

const Verifier = () => {
  const [input, setInput] = useState("autoworks-ai/extract-pdf@1.4.0");
  const [phase, setPhase] = useState("idle"); // idle | running | ok | fail
  const [step, setStep] = useState(0);

  const run = (target) => {
    setPhase("running");
    setStep(0);
    const total = 6;
    let i = 0;
    const id = setInterval(() => {
      i++;
      setStep(i);
      if (i >= total) {
        clearInterval(id);
        setPhase(target === "fail" ? "fail" : "ok");
      }
    }, 350);
  };

  return (
    <div className="verifier">
      <div className="verifier-head">
        <span className="lights"><span style={{ background: "#d97171", opacity: 0.7 }}/><span style={{ background: "#e8a866", opacity: 0.7 }}/><span style={{ background: "var(--accent)", opacity: 0.85 }}/></span>
        <span className="ttl">autovault verify · interactive</span>
      </div>
      <div className="verifier-input">
        <div className="row">
          <span className="pmt">$</span>
          <span style={{ color: "var(--ink-2)" }}>autovault verify</span>
          <input value={input} onChange={(e) => setInput(e.target.value)} spellCheck={false}/>
        </div>
        <div className="actions">
          <button className="vbtn run" onClick={() => run("ok")}>▶ Verify</button>
          <button className="vbtn" onClick={() => { setInput("attacker/weather-skill@9.9.9"); run("fail"); }}>↳ Try a forged skill</button>
          <button className="vbtn" onClick={() => { setPhase("idle"); setStep(0); }}>↻ Reset</button>
        </div>
      </div>
      <div className="verifier-body">
        {phase === "idle" && (
          <div style={{ color: "var(--ink-3)" }}>Click <strong style={{ color: "var(--ink-2)" }}>Verify</strong> to walk the provenance chain for any skill in the public vault.</div>
        )}
        {phase !== "idle" && (
          <>
            {step >= 1 && <div className="ln"><span className="lab">▸ artifact</span><span className="v">{input}</span></div>}
            {step >= 2 && <div className="ln"><span className="lab">  digest</span><span className="v dim">sha256:c4f9…e10a · 2,847 bytes</span></div>}
            {step >= 3 && <div className="ln"><span className="lab">  signature</span><span className={"v " + (phase === "fail" ? "err" : "ok")}>{phase === "fail" ? "INVALID — keypair mismatch" : "ed25519 · 0x9af42c81…7e7e"}</span></div>}
            {step >= 4 && <div className="ln"><span className="lab">  signer</span><span className="v">vault.autoworks-ai (key:0xC4F9…E10A) <span className="dim">· trust: anchored</span></span></div>}
            {step >= 5 && <div className="ln"><span className="lab">  gate run</span><span className="v ok">5/5 stages passed · 2026-04-28 14:21Z</span></div>}
            {step >= 6 && phase !== "fail" && <div className="ln"><span className="lab">  isnad chain</span><span className="v ok">3 links · author → vault → mirror</span></div>}
            {phase === "ok" && (
              <div className="verdict"><span className="seal"><Icon.Check/></span><span><strong style={{ color: "var(--ink)" }}>Verified.</strong> Provenance chain intact, signature valid, gate stages all green.</span></div>
            )}
            {phase === "fail" && (
              <div className="verdict fail"><span className="seal"><Icon.X/></span><span><strong style={{ color: "var(--ink)" }}>Rejected.</strong> Signature does not match the published key for this artifact's signer. Do not install.</span></div>
            )}
          </>
        )}
      </div>
    </div>
  );
};

const DENY_ROWS = [
  { sev: "crit", id: "CVE-2026-0142", pat: "/eval\\(.*atob\\(.*\\)\\)/", src: "internal-research", age: "2d" },
  { sev: "crit", id: "AV-2026-007",   pat: "/curl.*\\|.*sh.*\\&/",      src: "@elvissun",         age: "5d" },
  { sev: "high", id: "AV-2026-006",   pat: "/process\\.env\\.\\*\\)/",    src: "internal-research", age: "1w" },
  { sev: "high", id: "CVE-2026-0098", pat: "/data:.*;base64,.*upload/",   src: "nvd",               age: "2w" },
  { sev: "med",  id: "AV-2026-005",   pat: "/fork(\\(\\)\\s*\\{0,4\\})/",   src: "@sky-w",            age: "3w" },
  { sev: "high", id: "AV-2026-004",   pat: "/aws_secret.*=/",             src: "internal-research", age: "1mo" },
  { sev: "med",  id: "AV-2026-003",   pat: "/\\.bash_history.*read/",      src: "@iris-d",           age: "1mo" },
  { sev: "crit", id: "CVE-2025-9923", pat: "/keylog.*xinput/",            src: "nvd",               age: "2mo" },
];

const App = () => {
  return (
    <>
      <Topbar active="Security"/>
      <div className="sec-page">
        <div className="sec-hero">
          <div>
            <div className="eyebrow" style={{ display: "inline-flex", alignItems: "center", gap: 8, fontFamily: "var(--mono)", fontSize: 11, color: "var(--ink-3)", letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: 18 }}>
              <span style={{ width: 18, height: 1, background: "var(--ink-4)" }}/>
              <span>Security & provenance</span>
            </div>
            <h1>Signing isn't the same as <span className="ital">safe.</span></h1>
            <p className="lede">A signature proves <em>who said what, when</em>. It does not prove the thing they said is correct or harmless. AutoVault's security model rests on three pillars — what we sign, what we don't sign, and where the trust boundary actually lives. This page is for staff engineers and security teams who want to inspect that model before they deploy.</p>
          </div>
          <Verifier/>
        </div>
      </div>

      <div className="sec-page">
        <div className="sec-section">
          <div className="eyebrow"><span className="dash"/> Trust model</div>
          <h2>Three actors. Three responsibilities. <span className="ital">No overlap.</span></h2>
          <p className="sub">AutoVault explicitly does <strong>not</strong> claim to make untrusted code safe. Instead, the system splits the job into three roles. Each role has a narrow, well-defined responsibility, and we never blur the lines between them.</p>

          <div className="trust-diagram">
            <div className="trust-col">
              <span className="role">role / 01</span>
              <h3>The author</h3>
              <p className="desc">Writes the SKILL.md, declares its capabilities and permissions, signs it with a personal key. Owns what the skill <em>claims</em> to do.</p>
              <div className="obj">
                <span className="seal signed"><Icon.Check/></span>
                <div>
                  <div className="name">SKILL.md</div>
                  <div className="det">+ frontmatter, transformations</div>
                </div>
              </div>
              <div className="resp">RESPONSIBLE FOR
                <ul>
                  <li>Honest capability declarations</li>
                  <li>Tightest reasonable permission scope</li>
                  <li>Keeping the signing key private</li>
                </ul>
              </div>
              <div className="trust-arrow">→</div>
            </div>

            <div className="trust-col">
              <span className="role">role / 02</span>
              <h3>The vault</h3>
              <p className="desc">Validates, signs, indexes, and delivers per caller. Owns what the skill <em>looks like</em> when it leaves the vault.</p>
              <div className="obj">
                <span className="seal scoped"><Icon.Shield/></span>
                <div>
                  <div className="name">vault sig</div>
                  <div className="det">+ gate run record</div>
                </div>
              </div>
              <div className="resp">RESPONSIBLE FOR
                <ul>
                  <li>Running the five-stage gate</li>
                  <li>Producing a verifiable provenance chain</li>
                  <li>Filtering by four-axis scope</li>
                </ul>
              </div>
              <div className="trust-arrow">→</div>
            </div>

            <div className="trust-col">
              <span className="role">role / 03</span>
              <h3>The agent</h3>
              <p className="desc">Loads, interprets, and <em>executes</em> the skill within its own sandbox and tool-call boundary. Owns what the skill actually does at runtime.</p>
              <div className="obj">
                <span className="seal executed"><Icon.Lock/></span>
                <div>
                  <div className="name">runtime</div>
                  <div className="det">+ tool calls in caller's sandbox</div>
                </div>
              </div>
              <div className="resp">RESPONSIBLE FOR
                <ul>
                  <li>Enforcing declared permission boundaries</li>
                  <li>Sandboxing tool invocations</li>
                  <li>User-facing approval prompts</li>
                </ul>
              </div>
            </div>
          </div>

          <div style={{ marginTop: 28, padding: "16px 22px", background: "var(--panel)", border: "1px solid var(--line)", borderLeft: "3px solid var(--accent)", borderRadius: 6, color: "var(--ink-2)", fontSize: 14, lineHeight: 1.55 }}>
            <strong style={{ color: "var(--ink)", fontWeight: 500 }}>AutoVault never runs skills.</strong> It serves them. The agent on your machine executes locally, with its own tools, in its own sandbox. Whatever runs runs in your agent's existing trust boundary — we just make sure you only see skills that passed the gate, signed by who they claim to be.
          </div>
        </div>

        <div className="sec-section">
          <div className="eyebrow"><span className="dash"/> The gate, in detail</div>
          <h2>What each of the five stages actually checks.</h2>
          <p className="sub">Every skill — installed, mirrored, or proposed by an agent at runtime — runs through these five stages in this order. Counts shown are from the public vault as of v0.4.1.</p>

          <div className="gate-stages-board">
            <div className="gsb-head">
              <span className="ttl">Gate v0.4.1 · last 30 days</span>
              <span style={{ flex: 1 }}/>
              <span className="meta">3,118 submissions · 11.4% rejected</span>
            </div>
            <div className="gsb-grid">
              <div className="gsb-stage">
                <div className="stnum">STAGE / 01</div>
                <h4>YAML auto-repair</h4>
                <p className="stdesc">Frontmatter is the #1 source of breakage. Trailing commas, mixed indentation, unquoted special chars are fixed before the strict schema check.</p>
                <div className="strow"><span className="dot ok"/><span className="lbl">passed clean</span><span className="num">2,640</span></div>
                <div className="strow"><span className="dot warn"/><span className="lbl">repaired</span><span className="num">478</span></div>
                <div className="strow"><span className="dot" style={{ background: "var(--bad)" }}/><span className="lbl">rejected</span><span className="num">0</span></div>
              </div>
              <div className="gsb-stage">
                <div className="stnum">STAGE / 02</div>
                <h4>Security denylist</h4>
                <p className="stdesc">~340 known-bad patterns: credential stealers, fork bombs, exfil paths. Sourced from public CVEs, internal research, and community submissions.</p>
                <div className="strow"><span className="dot ok"/><span className="lbl">clean</span><span className="num">3,066</span></div>
                <div className="strow"><span className="dot" style={{ background: "var(--bad)" }}/><span className="lbl">flagged</span><span className="num">52</span></div>
              </div>
              <div className="gsb-stage">
                <div className="stnum">STAGE / 03</div>
                <h4>Capability ↔ behavior</h4>
                <p className="stdesc">Does the skill actually do what its frontmatter claims? Mismatch between declared <code>tools_required</code> and observed behavior in the body = reject.</p>
                <div className="strow"><span className="dot ok"/><span className="lbl">aligned</span><span className="num">2,718</span></div>
                <div className="strow"><span className="dot warn"/><span className="lbl">over-declared</span><span className="num">220</span></div>
                <div className="strow"><span className="dot" style={{ background: "var(--bad)" }}/><span className="lbl">under-declared</span><span className="num">128</span></div>
              </div>
              <div className="gsb-stage">
                <div className="stnum">STAGE / 04</div>
                <h4>Dedup</h4>
                <p className="stdesc">Text similarity in V1, embedding-space matching in V2 (preview). Stops the duplicate explosion at the door — too aggressive and authors complain, too lenient and the vault becomes ClawdHub.</p>
                <div className="strow"><span className="dot ok"/><span className="lbl">unique</span><span className="num">2,762</span></div>
                <div className="strow"><span className="dot" style={{ background: "var(--bad)" }}/><span className="lbl">near-duplicate</span><span className="num">176</span></div>
              </div>
              <div className="gsb-stage">
                <div className="stnum">STAGE / 05</div>
                <h4>Ed25519 sign</h4>
                <p className="stdesc">If we admit it, we sign it. Provenance becomes a first-class artifact with a verifiable chain back to the original author key.</p>
                <div className="strow"><span className="dot ok"/><span className="lbl">signed</span><span className="num">2,762</span></div>
                <div className="strow"><span className="dot" style={{ background: "var(--bad)" }}/><span className="lbl">key error</span><span className="num">0</span></div>
              </div>
            </div>
          </div>
        </div>

        <div className="sec-section">
          <div className="eyebrow"><span className="dash"/> Denylist inspector</div>
          <h2>Public, auditable, signed.</h2>
          <p className="sub">The denylist is itself an artifact under the same trust model — a signed, versioned bundle published at <code>autovault.dev/denylist/v1.json</code>. You can mirror it, audit it, propose additions through public review.</p>

          <div className="deny-grid">
            <div className="deny-list">
              <div className="deny-list-head">
                <span>Severity</span>
                <span>ID</span>
                <span>Pattern</span>
                <span>Source</span>
                <span style={{ textAlign: "right" }}>Age</span>
                <span style={{ marginLeft: "auto", color: "var(--accent)" }}><span className="count">{DENY_ROWS.length}</span> of 343</span>
              </div>
              {DENY_ROWS.map(r => (
                <div key={r.id} className="deny-row">
                  <span className={"sev " + r.sev}>{r.sev[0].toUpperCase()}</span>
                  <span className="id">{r.id}</span>
                  <span className="pat">{r.pat}</span>
                  <span className="src">{r.src}</span>
                  <span className="age">{r.age}</span>
                </div>
              ))}
            </div>
            <div className="deny-side">
              <div>
                <h4>Patterns active</h4>
                <div className="denynum">343<span className="of">/ +12 this month</span></div>
              </div>
              <div className="breakdown">
                <h4 style={{ marginBottom: 4 }}>By severity</h4>
                <div className="bd-row">
                  <span className="lbl">Critical</span>
                  <span className="bar"><div style={{ width: "32%", background: "var(--bad)" }}/></span>
                  <span className="num">109</span>
                </div>
                <div className="bd-row">
                  <span className="lbl">High</span>
                  <span className="bar"><div style={{ width: "44%", background: "var(--warn)" }}/></span>
                  <span className="num">152</span>
                </div>
                <div className="bd-row">
                  <span className="lbl">Medium</span>
                  <span className="bar"><div style={{ width: "24%", background: "var(--ink-4)" }}/></span>
                  <span className="num">82</span>
                </div>
              </div>
              <div className="breakdown" style={{ marginTop: 8 }}>
                <h4 style={{ marginBottom: 4 }}>By source</h4>
                <div className="bd-row">
                  <span className="lbl">Internal</span>
                  <span className="bar"><div style={{ width: "38%", background: "var(--accent)" }}/></span>
                  <span className="num">131</span>
                </div>
                <div className="bd-row">
                  <span className="lbl">NVD</span>
                  <span className="bar"><div style={{ width: "31%", background: "#5a9dd6" }}/></span>
                  <span className="num">106</span>
                </div>
                <div className="bd-row">
                  <span className="lbl">Community</span>
                  <span className="bar"><div style={{ width: "31%", background: "#b48ad6" }}/></span>
                  <span className="num">106</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div className="sec-section">
          <div className="eyebrow"><span className="dash"/> Provenance chain</div>
          <h2>Every skill carries its <span className="ital">isnad.</span></h2>
          <p className="sub">An "isnad" is a chain of transmission — who said what, who heard it, who passed it on. Every signed skill in AutoVault carries one. Each link is its own ed25519 signature; tampering with any link breaks the chain.</p>

          <div className="prov-chain">
            <div className="prov-grid">
              <div className="prov-link">
                <div className="role">LINK / 01 · author</div>
                <div className="id">@autoworks-ai</div>
                <div className="when">2026-04-28 12:14Z</div>
              </div>
              <div className="prov-link">
                <div className="role">LINK / 02 · gate</div>
                <div className="id">vault.autoworks-ai</div>
                <div className="when">2026-04-28 12:18Z</div>
              </div>
              <div className="prov-link">
                <div className="role">LINK / 03 · publish</div>
                <div className="id">0x9af4…2c81</div>
                <div className="when">2026-04-28 14:21Z</div>
              </div>
              <div className="prov-link">
                <div className="role">LINK / 04 · mirror</div>
                <div className="id">cdn.autovault.dev</div>
                <div className="when">2026-04-28 14:22Z</div>
              </div>
              <div className="prov-link">
                <div className="role">LINK / 05 · install</div>
                <div className="id">your machine</div>
                <div className="when">on demand</div>
              </div>
            </div>
            <div style={{ marginTop: 24, fontSize: 11, color: "var(--ink-3)", textAlign: "center", letterSpacing: "0.04em" }}>
              autovault verify --chain  ·  any link broken = full rejection
            </div>
          </div>
        </div>

        <div className="sec-section">
          <div className="eyebrow"><span className="dash"/> Disclosure</div>
          <h2>Found something? Tell us.</h2>
          <p className="sub">We treat skill-ecosystem vulnerabilities the way mature infrastructure projects do. Coordinated disclosure, public CVE assignment, advisory published with the patch.</p>

          <div className="disc-grid">
            <div className="disc-card">
              <h3>Report a vulnerability</h3>
              <p>If you've found a vulnerability in the gate, the CLI, the renderer, or a denylist bypass — please report it before public disclosure. We respond within 48 hours and ship critical fixes within 7 days.</p>
              <div className="kv">
                <span className="k">Email</span><span className="v accent">security@autoworks-ai</span>
                <span className="k">PGP</span><span className="v">0xC4F9 7E10 A2C8 1B3D</span>
                <span className="k">Bounty</span><span className="v">case-by-case · max $5k</span>
                <span className="k">Window</span><span className="v">90-day coordinated disclosure</span>
              </div>
            </div>
            <div className="disc-card">
              <h3>Audit & transparency</h3>
              <p>The CLI is Apache-2.0 and self-buildable from a tagged commit. The denylist is a public, signed JSON artifact. The gate is reproducible — given the same skill bytes you should always get the same verdict.</p>
              <div className="kv">
                <span className="k">License</span><span className="v">Apache-2.0</span>
                <span className="k">Reproducible</span><span className="v accent">yes · gate v0.4+</span>
                <span className="k">External audit</span><span className="v">scheduled · Q3 2026</span>
                <span className="k">SBOM</span><span className="v">cyclonedx · per release</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </>
  );
};
