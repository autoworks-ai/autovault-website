<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Skills directory — AutoVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="docs-shell.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
.dir-page { max-width: 1320px; margin: 0 auto; padding: 0 28px; }

.dir-header {
  padding: 56px 0 32px;
  border-bottom: 1px solid var(--line);
  display: grid; grid-template-columns: 1.2fr 1fr; gap: 56px; align-items: end;
}
.dir-header h1 { font-size: 48px; line-height: 1.04; letter-spacing: -0.03em; font-weight: 500; margin: 0 0 14px; }
.dir-header .lede { color: var(--ink-2); font-size: 16.5px; max-width: 560px; margin: 0; }
.dir-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.dir-stats .stat { padding: 16px 18px; border-right: 1px solid var(--line); background: var(--panel); }
.dir-stats .stat:last-child { border-right: 0; }
.dir-stats .lbl { font-family: var(--mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }
.dir-stats .val { font-size: 22px; font-weight: 500; letter-spacing: -0.02em; color: var(--ink); }
.dir-stats .trend { font-family: var(--mono); font-size: 10.5px; color: var(--accent); margin-top: 2px; }

/* Layout */
.dir-shell {
  display: grid; grid-template-columns: 240px 1fr;
  gap: 0; padding: 0;
  min-height: calc(100vh - 60px);
}
.dir-side {
  border-right: 1px solid var(--line);
  padding: 28px 24px 28px 0;
  position: sticky; top: 60px; align-self: start;
  height: calc(100vh - 60px); overflow-y: auto;
}
.dir-side .filter-group { margin-bottom: 28px; }
.dir-side .fg-title {
  display: flex; align-items: center; justify-content: space-between;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 12px;
}
.dir-side .fg-clear { font-size: 10px; color: var(--ink-4); cursor: pointer; }
.dir-side .fg-clear:hover { color: var(--ink-2); }
.dir-side .fg-row {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: 4px; cursor: pointer;
  font-size: 13px; color: var(--ink-2);
  transition: all 120ms;
}
.dir-side .fg-row:hover { background: var(--panel); color: var(--ink); }
.dir-side .fg-row.on { color: var(--accent); background: var(--accent-soft); }
.dir-side .fg-row .cb {
  width: 14px; height: 14px; border-radius: 3px;
  border: 1px solid var(--line-2); background: var(--bg);
  display: grid; place-items: center; flex-shrink: 0;
}
.dir-side .fg-row.on .cb { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.dir-side .fg-row .lbl { flex: 1; }
.dir-side .fg-row .ct { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
.dir-side .fg-row.on .ct { color: var(--accent); }

.dir-side .swatch { width: 8px; height: 8px; border-radius: 2px; }

/* Main */
.dir-main { padding: 28px 0 64px 32px; min-width: 0; }

.dir-toolbar {
  display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
}
.dir-search {
  flex: 1; min-width: 280px;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: var(--bg-2);
  border: 1px solid var(--line); border-radius: 8px;
}
.dir-search:focus-within { border-color: var(--accent); }
.dir-search input { flex: 1; background: transparent; border: 0; color: var(--ink); outline: none; font: inherit; font-size: 14px; }
.dir-search input::placeholder { color: var(--ink-3); }
.dir-search .kbd { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); padding: 2px 6px; border: 1px solid var(--line-2); border-radius: 3px; }

.dir-sort {
  display: flex; gap: 4px; padding: 3px; background: var(--bg-2);
  border: 1px solid var(--line); border-radius: 6px;
}
.dir-sort button {
  background: none; border: 0; color: var(--ink-3);
  font: inherit; font-size: 12px; padding: 6px 10px; border-radius: 4px;
  cursor: pointer;
}
.dir-sort button.active { background: var(--panel); color: var(--ink); }

.dir-view-toggle {
  display: flex; gap: 4px; padding: 3px; background: var(--bg-2);
  border: 1px solid var(--line); border-radius: 6px;
}
.dir-view-toggle button {
  background: none; border: 0; color: var(--ink-3);
  font: inherit; padding: 5px 8px; border-radius: 4px; cursor: pointer;
  display: grid; place-items: center;
}
.dir-view-toggle button.active { background: var(--panel); color: var(--ink); }

/* Active filter chips */
.dir-active { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.dir-active .chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 6px 4px 10px; background: var(--accent-soft); color: var(--accent);
  border: 1px solid rgba(90,214,192,0.3); border-radius: 4px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.02em;
}
.dir-active .chip button { background: none; border: 0; color: inherit; cursor: pointer; padding: 0 4px; font-size: 12px; opacity: 0.7; }
.dir-active .chip button:hover { opacity: 1; }
.dir-active .clear-all { font-family: var(--mono); font-size: 11px; color: var(--ink-3); cursor: pointer; padding: 4px 6px; }
.dir-active .clear-all:hover { color: var(--ink); }

/* Grid */
.dir-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }

.skill-tile {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 18px 20px;
  display: flex; flex-direction: column; gap: 12px;
  transition: all 160ms;
  cursor: pointer;
  position: relative;
  min-height: 200px;
}
.skill-tile:hover { border-color: var(--line-2); transform: translateY(-1px); }
.skill-tile.featured { border-color: rgba(90,214,192,0.3); background: linear-gradient(180deg, rgba(90,214,192,0.04), var(--panel)); }

.skill-tile .stl-head { display: flex; align-items: flex-start; gap: 12px; }
.skill-tile .stl-icon {
  width: 36px; height: 36px; border-radius: 8px;
  background: var(--bg);
  border: 1px solid var(--line-2);
  display: grid; place-items: center;
  font-family: var(--mono); font-weight: 600; font-size: 13px;
  color: var(--ink);
  flex-shrink: 0;
}
.skill-tile .stl-name { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.skill-tile .stl-name .name { font-size: 15px; font-weight: 500; letter-spacing: -0.01em; color: var(--ink); }
.skill-tile .stl-name .org { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }

.skill-tile .stl-verified {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--mono); font-size: 9.5px; color: var(--accent);
  letter-spacing: 0.04em;
  background: var(--accent-soft); padding: 2px 6px; border-radius: 3px;
  align-self: start;
}

.skill-tile .stl-desc { color: var(--ink-2); font-size: 13px; line-height: 1.5; flex: 1; }

.skill-tile .stl-agents { display: flex; gap: 4px; }
.skill-tile .stl-agents .ag {
  width: 18px; height: 18px; border-radius: 4px;
  display: grid; place-items: center;
  font-family: var(--mono); font-weight: 600; font-size: 9.5px;
  color: var(--ink-2); background: var(--bg-2); border: 1px solid var(--line);
  text-transform: uppercase;
}
.skill-tile .stl-agents .ag.on { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }

.skill-tile .stl-meta {
  display: flex; align-items: center; gap: 14px;
  padding-top: 12px; border-top: 1px solid var(--line);
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
  letter-spacing: 0.02em;
}
.skill-tile .stl-meta .v { color: var(--ink-2); }
.skill-tile .stl-meta .spc { flex: 1; }
.skill-tile .stl-meta .install-mini {
  background: none; border: 1px solid var(--line-2); color: var(--ink-2);
  font: inherit; font-family: var(--mono); font-size: 10.5px;
  padding: 3px 8px; border-radius: 3px; cursor: pointer;
  letter-spacing: 0.04em; text-transform: uppercase;
  transition: all 120ms;
}
.skill-tile .stl-meta .install-mini:hover { color: var(--accent); border-color: var(--accent); }

/* Featured banner row */
.dir-featured-row {
  display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 14px;
  margin-bottom: 24px;
}
.dir-featured-row .skill-tile { min-height: 0; }
.dir-featured-row .skill-tile.big { padding: 24px 28px; min-height: 220px; }
.dir-featured-row .skill-tile.big .stl-name .name { font-size: 22px; }
.dir-featured-row .skill-tile.big .stl-icon { width: 44px; height: 44px; font-size: 16px; }
.dir-featured-row .skill-tile.big .stl-desc { font-size: 14px; }

/* List view */
.dir-list { display: flex; flex-direction: column; gap: 4px; }
.dir-list-item {
  display: grid; grid-template-columns: 280px 1fr 120px 100px 80px;
  gap: 16px; align-items: center;
  padding: 14px 16px; border-radius: 6px; cursor: pointer;
  transition: background 120ms;
  border: 1px solid transparent;
}
.dir-list-item:hover { background: var(--panel); border-color: var(--line); }
.dir-list-item .name-cell { display: flex; align-items: center; gap: 12px; min-width: 0; }
.dir-list-item .name-cell .stl-icon { width: 28px; height: 28px; font-size: 12px; }
.dir-list-item .name-cell .col { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.dir-list-item .name-cell .name { font-size: 14px; font-weight: 500; color: var(--ink); }
.dir-list-item .name-cell .org { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.dir-list-item .desc-cell { color: var(--ink-2); font-size: 13px; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dir-list-item .agents-cell { display: flex; gap: 3px; }
.dir-list-item .agents-cell .ag { width: 20px; height: 20px; border-radius: 4px; display: grid; place-items: center; font-family: var(--mono); font-size: 9.5px; font-weight: 600; }
.dir-list-item .meta-cell { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.dir-list-item .install-cell { text-align: right; }

.dir-pagination {
  margin-top: 32px; padding-top: 20px;
  border-top: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
  font-family: var(--mono); font-size: 11.5px; color: var(--ink-3);
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="docs-shell.jsx"></script>
<script type="text/babel">
const { useState, useMemo } = React;
const { Topbar, Icon } = window;

const SKILLS = [
  { name: "extract-pdf", org: "autoworks-ai", icon: "PD", category: "files", agents: ["cc","cx","cu","ah"], desc: "Extract structured text from PDF files. Preserves headings, lists, and table layout where possible.", v: "1.4.0", installs: 2840, license: "Apache-2.0", featured: true },
  { name: "summarize-doc", org: "autoworks-ai", icon: "SD", category: "text", agents: ["cc","cx","cu","ah"], desc: "Recursive multi-pass summarization with configurable depth and target length.", v: "0.9.2", installs: 1920, license: "Apache-2.0", featured: true },
  { name: "github-issues", org: "autoworks-ai", icon: "GH", category: "integrations", agents: ["cc","cx","cu"], desc: "Read, search, and create GitHub issues. Scoped to repos you've authorized via gh-cli.", v: "2.1.0", installs: 1410, license: "MIT", featured: true },
  { name: "parse-csv", org: "autoworks-ai", icon: "CV", category: "files", agents: ["cc","cx","cu","ah"], desc: "Parse CSV with type inference, quoted fields, and configurable dialects.", v: "1.0.4", installs: 980, license: "Apache-2.0" },
  { name: "extract-table", org: "autoworks-ai", icon: "TB", category: "files", agents: ["cc","cx"], desc: "Pull structured tables from HTML, PDF, and image sources into normalized rows.", v: "0.7.0", installs: 720, license: "Apache-2.0" },
  { name: "ocr-image", org: "autoworks-ai", icon: "OC", category: "files", agents: ["cc","cx","cu","ah"], desc: "OCR an image to text with bounding-box output. Wraps tesseract locally; never sends pixels off-device.", v: "1.2.1", installs: 1100, license: "Apache-2.0" },
  { name: "linear-tasks", org: "autoworks-ai", icon: "LN", category: "integrations", agents: ["cc","cx"], desc: "Read and update Linear tasks scoped to a workspace.", v: "0.4.0", installs: 380, license: "Apache-2.0" },
  { name: "slack-search", org: "autoworks-ai", icon: "SL", category: "integrations", agents: ["cc","cx","cu"], desc: "Search a Slack workspace and return formatted thread context.", v: "0.3.1", installs: 290, license: "Apache-2.0" },
  { name: "git-blame", org: "autoworks-ai", icon: "GB", category: "code", agents: ["cc","cx","cu"], desc: "Annotate git blame across a repo with author + commit summary.", v: "1.1.0", installs: 540, license: "MIT" },
  { name: "diff-summarize", org: "autoworks-ai", icon: "DS", category: "code", agents: ["cc","cx","cu","ah"], desc: "Walk a diff and produce a structured summary of intent + risk per hunk.", v: "0.6.0", installs: 470, license: "Apache-2.0" },
  { name: "screenshot-page", org: "community/elvissun", icon: "SC", category: "browser", agents: ["cc","cx","cu"], desc: "Capture a screenshot of a rendered web page with viewport options.", v: "1.0.0", installs: 820, license: "MIT" },
  { name: "fill-web-form", org: "community/elvissun", icon: "FF", category: "browser", agents: ["cc","cx","cu"], desc: "Interactive form-filling skill with validation prompts before submission.", v: "0.8.0", installs: 612, license: "MIT" },
  { name: "regex-extract", org: "autoworks-ai", icon: "RX", category: "text", agents: ["cc","cx","cu","ah"], desc: "Test, refine, and run regex against sample text with a tight feedback loop.", v: "1.5.0", installs: 1560, license: "Apache-2.0" },
  { name: "json-validate", org: "autoworks-ai", icon: "JV", category: "data", agents: ["cc","cx","cu","ah"], desc: "Validate JSON against a schema, with structured error reporting.", v: "1.2.0", installs: 1010, license: "Apache-2.0" },
  { name: "yaml-validate", org: "autoworks-ai", icon: "YV", category: "data", agents: ["cc","cx","cu","ah"], desc: "Validate YAML with auto-repair suggestions — same engine as the AutoVault gate.", v: "0.9.0", installs: 840, license: "Apache-2.0" },
  { name: "summarize-pr", org: "community/sky-w", icon: "PR", category: "code", agents: ["cc","cx"], desc: "Generate a PR description from the diff with structured sections (intent / risk / tests).", v: "0.5.2", installs: 290, license: "MIT" },
  { name: "kubectl-helper", org: "community/iris-d", icon: "K8", category: "infra", agents: ["cc","cx"], desc: "Wrap kubectl with safer defaults and explain-as-you-go output.", v: "0.3.0", installs: 180, license: "MIT" },
  { name: "tf-plan-explain", org: "autoworks-ai", icon: "TF", category: "infra", agents: ["cc","cx"], desc: "Read a terraform plan and produce a human-readable change summary with risk flags.", v: "0.4.0", installs: 220, license: "Apache-2.0" },
];

const AGENTS = [
  { id: "cc", label: "Claude Code", color: "#d6a85a" },
  { id: "cx", label: "Codex", color: "#5a9dd6" },
  { id: "cu", label: "Cursor", color: "#b48ad6" },
  { id: "ah", label: "AutoHub", color: "#5ad6c0" },
];

const CATEGORIES = [
  { id: "files", label: "Files" },
  { id: "text", label: "Text" },
  { id: "data", label: "Data" },
  { id: "code", label: "Code" },
  { id: "browser", label: "Browser" },
  { id: "integrations", label: "Integrations" },
  { id: "infra", label: "Infrastructure" },
];

const ORGS = [
  { id: "autoworks-ai", label: "autoworks-ai" },
  { id: "community/elvissun", label: "elvissun" },
  { id: "community/sky-w", label: "sky-w" },
  { id: "community/iris-d", label: "iris-d" },
];

const Tile = ({ s, big = false }) => (
  <div className={"skill-tile" + (s.featured ? " featured" : "") + (big ? " big" : "")}>
    <div className="stl-head">
      <div className="stl-icon">{s.icon}</div>
      <div className="stl-name">
        <span className="name">{s.name}</span>
        <span className="org">{s.org}</span>
      </div>
      <span className="stl-verified"><Icon.Check/> SIGNED</span>
    </div>
    <div className="stl-desc">{s.desc}</div>
    <div className="stl-agents">
      {AGENTS.map(a => (
        <span key={a.id} className={"ag" + (s.agents.includes(a.id) ? " on" : "")} title={a.label}>{a.id}</span>
      ))}
    </div>
    <div className="stl-meta">
      <span className="v">v{s.v}</span>
      <span>{s.installs.toLocaleString()} installs</span>
      <span>{s.license}</span>
      <span className="spc"/>
      <button className="install-mini">Install</button>
    </div>
  </div>
);

const ListItem = ({ s }) => (
  <div className="dir-list-item">
    <div className="name-cell">
      <div className="stl-icon">{s.icon}</div>
      <div className="col">
        <span className="name">{s.name}</span>
        <span className="org">{s.org}</span>
      </div>
    </div>
    <div className="desc-cell">{s.desc}</div>
    <div className="agents-cell">
      {AGENTS.map(a => (
        <span key={a.id} className={"ag" + (s.agents.includes(a.id) ? " on" : "")}
          style={{ background: s.agents.includes(a.id) ? a.color : "var(--bg-2)", color: s.agents.includes(a.id) ? "#0a0d11" : "var(--ink-3)", border: "1px solid var(--line)" }}
          title={a.label}>{a.id}</span>
      ))}
    </div>
    <div className="meta-cell">v{s.v} · {s.installs.toLocaleString()}</div>
    <div className="install-cell">
      <button className="install-mini" style={{ background: "none", border: "1px solid var(--line-2)", color: "var(--ink-2)", padding: "5px 10px", fontFamily: "var(--mono)", fontSize: 10.5, borderRadius: 4, letterSpacing: "0.04em", textTransform: "uppercase", cursor: "pointer" }}>Install</button>
    </div>
  </div>
);

const App = () => {
  const [view, setView] = useState("grid");
  const [sort, setSort] = useState("installs");
  const [query, setQuery] = useState("");
  const [agents, setAgents] = useState(new Set());
  const [cats, setCats] = useState(new Set());
  const [orgs, setOrgs] = useState(new Set());

  const toggle = (set, setter, value) => {
    const n = new Set(set);
    n.has(value) ? n.delete(value) : n.add(value);
    setter(n);
  };

  const filtered = useMemo(() => {
    let r = SKILLS.filter(s => {
      if (query && !(s.name + s.org + s.desc).toLowerCase().includes(query.toLowerCase())) return false;
      if (agents.size > 0 && !s.agents.some(a => agents.has(a))) return false;
      if (cats.size > 0 && !cats.has(s.category)) return false;
      if (orgs.size > 0 && !orgs.has(s.org)) return false;
      return true;
    });
    if (sort === "installs") r.sort((a, b) => b.installs - a.installs);
    if (sort === "name") r.sort((a, b) => a.name.localeCompare(b.name));
    if (sort === "recent") r.sort((a, b) => b.installs - a.installs);
    return r;
  }, [query, agents, cats, orgs, sort]);

  const featured = filtered.filter(s => s.featured).slice(0, 3);
  const rest = filtered.filter(s => !featured.includes(s));

  const activeChips = [
    ...[...agents].map(id => ({ key: "ag-"+id, label: AGENTS.find(a => a.id === id)?.label, on: () => toggle(agents, setAgents, id) })),
    ...[...cats].map(id => ({ key: "ct-"+id, label: CATEGORIES.find(c => c.id === id)?.label, on: () => toggle(cats, setCats, id) })),
    ...[...orgs].map(id => ({ key: "or-"+id, label: ORGS.find(o => o.id === id)?.label, on: () => toggle(orgs, setOrgs, id) })),
  ];

  const clearAll = () => { setAgents(new Set()); setCats(new Set()); setOrgs(new Set()); setQuery(""); };

  return (
    <>
      <Topbar active="Skills" />
      <div className="dir-page">
        <div className="dir-header">
          <div>
            <div className="eyebrow" style={{ display: "inline-flex", alignItems: "center", gap: 8, fontFamily: "var(--mono)", fontSize: 11, color: "var(--ink-3)", letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: 16 }}>
              <span style={{ width: 18, height: 1, background: "var(--ink-4)" }}/>
              <span>Skills directory</span>
            </div>
            <h1>Every skill in here passed <span className="ital">the gate.</span></h1>
            <p className="lede">Browse 241 community skills, all signed, all dedup'd, all transformation-mapped to the major agents. Filter by what you run, what you need, who you trust.</p>
          </div>
          <div className="dir-stats">
            <div className="stat"><div className="lbl">Skills</div><div className="val">241</div><div className="trend">+18 this week</div></div>
            <div className="stat"><div className="lbl">Verified authors</div><div className="val">62</div><div className="trend">+4 this week</div></div>
            <div className="stat"><div className="lbl">Rejection rate</div><div className="val">11.4<span style={{ fontFamily: "var(--mono)", fontSize: 12, color: "var(--ink-3)", marginLeft: 2 }}>%</span></div><div className="trend" style={{ color: "var(--ink-3)" }}>at the gate</div></div>
            <div className="stat"><div className="lbl">Total installs</div><div className="val">14.2<span style={{ fontFamily: "var(--mono)", fontSize: 12, color: "var(--ink-3)", marginLeft: 2 }}>k</span></div><div className="trend">+2.1k this week</div></div>
          </div>
        </div>
      </div>

      <div className="dir-page">
        <div className="dir-shell">
          <aside className="dir-side">
            <div className="filter-group">
              <div className="fg-title">
                <span>Agents</span>
                {agents.size > 0 && <span className="fg-clear" onClick={() => setAgents(new Set())}>clear</span>}
              </div>
              {AGENTS.map(a => {
                const ct = SKILLS.filter(s => s.agents.includes(a.id)).length;
                const on = agents.has(a.id);
                return (
                  <div key={a.id} className={"fg-row" + (on ? " on" : "")} onClick={() => toggle(agents, setAgents, a.id)}>
                    <span className="cb">{on && <Icon.Check style={{ width: 10, height: 10 }}/>}</span>
                    <span className="swatch" style={{ background: a.color }}/>
                    <span className="lbl">{a.label}</span>
                    <span className="ct">{ct}</span>
                  </div>
                );
              })}
            </div>
            <div className="filter-group">
              <div className="fg-title">
                <span>Category</span>
                {cats.size > 0 && <span className="fg-clear" onClick={() => setCats(new Set())}>clear</span>}
              </div>
              {CATEGORIES.map(c => {
                const ct = SKILLS.filter(s => s.category === c.id).length;
                const on = cats.has(c.id);
                return (
                  <div key={c.id} className={"fg-row" + (on ? " on" : "")} onClick={() => toggle(cats, setCats, c.id)}>
                    <span className="cb">{on && <Icon.Check style={{ width: 10, height: 10 }}/>}</span>
                    <span className="lbl">{c.label}</span>
                    <span className="ct">{ct}</span>
                  </div>
                );
              })}
            </div>
            <div className="filter-group">
              <div className="fg-title">
                <span>Author</span>
                {orgs.size > 0 && <span className="fg-clear" onClick={() => setOrgs(new Set())}>clear</span>}
              </div>
              {ORGS.map(o => {
                const ct = SKILLS.filter(s => s.org === o.id).length;
                if (ct === 0) return null;
                const on = orgs.has(o.id);
                return (
                  <div key={o.id} className={"fg-row" + (on ? " on" : "")} onClick={() => toggle(orgs, setOrgs, o.id)}>
                    <span className="cb">{on && <Icon.Check style={{ width: 10, height: 10 }}/>}</span>
                    <span className="lbl">{o.label}</span>
                    <span className="ct">{ct}</span>
                  </div>
                );
              })}
            </div>
            <div className="filter-group">
              <div className="fg-title"><span>Trust</span></div>
              <div className="fg-row on">
                <span className="cb"><Icon.Check style={{ width: 10, height: 10 }}/></span>
                <span className="lbl">Signed</span>
                <span className="ct">{SKILLS.length}</span>
              </div>
              <div className="fg-row" style={{ opacity: 0.6 }}>
                <span className="cb"/>
                <span className="lbl">Verified author</span>
                <span className="ct">62</span>
              </div>
            </div>
          </aside>

          <main className="dir-main">
            <div className="dir-toolbar">
              <div className="dir-search">
                <Icon.Search/>
                <input type="text" placeholder="Search skills, authors, capabilities…" value={query} onChange={(e) => setQuery(e.target.value)}/>
                <span className="kbd">⌘K</span>
              </div>
              <div className="dir-sort">
                <button className={sort === "installs" ? "active" : ""} onClick={() => setSort("installs")}>Most installed</button>
                <button className={sort === "recent" ? "active" : ""} onClick={() => setSort("recent")}>Recent</button>
                <button className={sort === "name" ? "active" : ""} onClick={() => setSort("name")}>Name</button>
              </div>
              <div className="dir-view-toggle">
                <button className={view === "grid" ? "active" : ""} onClick={() => setView("grid")} title="Grid">
                  <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
                </button>
                <button className={view === "list" ? "active" : ""} onClick={() => setView("list")} title="List">
                  <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="1.5"><line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/></svg>
                </button>
              </div>
            </div>

            {activeChips.length > 0 && (
              <div className="dir-active">
                {activeChips.map(c => (
                  <span key={c.key} className="chip">
                    {c.label}
                    <button onClick={c.on}>×</button>
                  </span>
                ))}
                <span className="clear-all" onClick={clearAll}>clear all</span>
              </div>
            )}

            <div style={{ fontFamily: "var(--mono)", fontSize: 11, color: "var(--ink-3)", letterSpacing: "0.04em", marginBottom: 16 }}>
              {filtered.length} {filtered.length === 1 ? "skill" : "skills"}
            </div>

            {view === "grid" && featured.length > 0 && activeChips.length === 0 && !query && (
              <div className="dir-featured-row">
                {featured.map((s, i) => <Tile key={s.name} s={s} big={i === 0}/>)}
              </div>
            )}

            {view === "grid" && (
              <div className="dir-grid">
                {(activeChips.length > 0 || query ? filtered : rest).map(s => <Tile key={s.name} s={s}/>)}
              </div>
            )}
            {view === "list" && (
              <div className="dir-list">
                {filtered.map(s => <ListItem key={s.name} s={s}/>)}
              </div>
            )}

            {filtered.length === 0 && (
              <div style={{ padding: "80px 24px", textAlign: "center", color: "var(--ink-3)", border: "1px dashed var(--line)", borderRadius: 12, marginTop: 16, fontFamily: "var(--mono)", fontSize: 13 }}>
                no skills match — <span onClick={clearAll} style={{ color: "var(--accent)", cursor: "pointer" }}>clear filters</span>
              </div>
            )}

            <div className="dir-pagination">
              <span>Showing {filtered.length} of 241 skills</span>
              <span>Index synced 4 minutes ago · gate v0.4.1</span>
            </div>
          </main>
        </div>
      </div>
    </>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
