<style>
.au-page { max-width: 1280px; margin: 0 auto; padding: 0 28px; }

.au-crumb { padding: 22px 0 0; font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); letter-spacing: 0.02em; display: flex; align-items: center; gap: 8px; }
.au-crumb a { color: var(--ink-3); }
.au-crumb a:hover { color: var(--ink); }
.au-crumb .sep { color: var(--ink-4); }
.au-crumb .cur { color: var(--ink); }

/* HEADER — strong publisher identity */
.au-head {
  padding: 36px 0 32px;
  display: grid; grid-template-columns: 1fr 380px; gap: 56px; align-items: start;
  border-bottom: 1px solid var(--line);
}
.au-id { display: flex; gap: 22px; align-items: flex-start; margin-bottom: 22px; }
.au-avatar {
  width: 88px; height: 88px; border-radius: 16px;
  background: linear-gradient(135deg, #1c2632, #0d141a);
  border: 1px solid var(--line-2);
  display: grid; place-items: center;
  position: relative;
  flex-shrink: 0;
}
.au-avatar .glyph {
  width: 56px; height: 56px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), #2db9a0);
  display: grid; place-items: center;
  font-family: var(--mono); font-weight: 700; font-size: 22px; color: var(--accent-ink);
  letter-spacing: -0.02em;
}
.au-avatar .verified-mark {
  position: absolute; bottom: -6px; right: -6px;
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center;
  border: 3px solid var(--bg);
}
.au-id h1 { font-size: 38px; font-weight: 500; letter-spacing: -0.025em; margin: 0 0 6px; line-height: 1.05; }
.au-id .handle { font-family: var(--mono); font-size: 13px; color: var(--ink-3); letter-spacing: 0.02em; margin-bottom: 12px; }
.au-id .verify-badge { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; background: var(--accent-soft); color: var(--accent); border: 1px solid rgba(90,214,192,0.3); border-radius: 4px; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; }

.au-bio { color: var(--ink-2); font-size: 15.5px; line-height: 1.6; max-width: 620px; margin: 0 0 16px; }
.au-meta-row { display: flex; gap: 18px; flex-wrap: wrap; font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); letter-spacing: 0.02em; }
.au-meta-row .item { display: inline-flex; align-items: center; gap: 6px; }
.au-meta-row .item svg { color: var(--ink-4); }

/* IDENTITY CARD — looks like a signing certificate */
.au-cert {
  background:
    linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 22px 24px;
  position: relative;
  overflow: hidden;
}
.au-cert::before {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(circle at 80% 0%, rgba(90,214,192,0.08), transparent 60%);
  pointer-events: none;
}
.au-cert .cert-head {
  display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase;
}
.au-cert .cert-head .seal { width: 14px; height: 14px; color: var(--accent); }
.au-cert .cert-head .id { margin-left: auto; color: var(--ink); }

.au-cert .cert-row { display: grid; grid-template-columns: 90px 1fr; gap: 8px 14px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.au-cert .cert-row:last-child { border-bottom: 0; }
.au-cert .cert-row .k { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.04em; text-transform: uppercase; padding-top: 1px; }
.au-cert .cert-row .v { color: var(--ink); font-family: var(--mono); font-size: 12px; word-break: break-all; }
.au-cert .cert-row .v.accent { color: var(--accent); }
.au-cert .cert-row .v.bigkey { font-size: 10.5px; line-height: 1.5; color: var(--ink-2); }

.au-cert .cert-actions { display: flex; gap: 6px; margin-top: 14px; }
.au-cert .cert-actions button {
  flex: 1; background: none; border: 1px solid var(--line-2); color: var(--ink-2);
  font: inherit; font-family: var(--mono); font-size: 10.5px;
  padding: 6px 8px; border-radius: 4px;
  letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;
}
.au-cert .cert-actions button:hover { color: var(--accent); border-color: var(--accent); }

/* STATS strip */
.au-stats { display: grid; grid-template-columns: repeat(5, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 24px 0 0; background: var(--panel); }
.au-stats .st { padding: 16px 18px; border-right: 1px solid var(--line); }
.au-stats .st:last-child { border-right: 0; }
.au-stats .lbl { font-family: var(--mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }
.au-stats .val { font-size: 22px; font-weight: 500; letter-spacing: -0.02em; color: var(--ink); }
.au-stats .val .unit { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-left: 3px; font-weight: 400; }
.au-stats .trend { font-family: var(--mono); font-size: 10.5px; color: var(--accent); margin-top: 2px; }
.au-stats .trend.dim { color: var(--ink-3); }

/* SECTION */
.au-section { padding: 48px 0; border-top: 1px solid var(--line); }
.au-section:first-of-type { border-top: 0; padding-top: 36px; }
.au-section h2 { font-size: 24px; font-weight: 500; letter-spacing: -0.02em; margin: 0 0 6px; }
.au-section .sub { color: var(--ink-3); font-size: 14px; margin: 0 0 24px; max-width: 640px; }
.au-section .eyebrow { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 12px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase; }
.au-section .eyebrow .dash { width: 18px; height: 1px; background: var(--ink-4); }

/* SKILLS GRID */
.au-skills-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.au-skills-toolbar .filter-chip { padding: 5px 11px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em; cursor: pointer; }
.au-skills-toolbar .filter-chip.on { color: var(--accent); border-color: rgba(90,214,192,0.3); background: var(--accent-soft); }
.au-skills-toolbar .ct { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-left: auto; }

.au-skills-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.au-skill-tile {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 16px 18px;
  cursor: pointer; transition: all 140ms;
  display: flex; flex-direction: column; gap: 10px;
  text-decoration: none; color: inherit;
}
.au-skill-tile:hover { border-color: var(--line-2); transform: translateY(-1px); }
.au-skill-tile.flagship { background: linear-gradient(180deg, rgba(90,214,192,0.04), var(--panel)); border-color: rgba(90,214,192,0.3); }

.au-skill-tile .row1 { display: flex; align-items: center; gap: 10px; }
.au-skill-tile .icon-tile {
  width: 30px; height: 30px; border-radius: 6px;
  background: var(--bg); border: 1px solid var(--line-2);
  display: grid; place-items: center;
  font-family: var(--mono); font-weight: 600; font-size: 11px;
  flex-shrink: 0;
}
.au-skill-tile .name { font-size: 14px; font-weight: 500; color: var(--ink); flex: 1; }
.au-skill-tile .ver { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
.au-skill-tile .desc { color: var(--ink-2); font-size: 13px; line-height: 1.5; }
.au-skill-tile .row3 { display: flex; align-items: center; gap: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
.au-skill-tile .row3 .install { color: var(--accent); }
.au-skill-tile .row3 .agents { display: flex; gap: 3px; }
.au-skill-tile .row3 .agents .a { width: 16px; height: 16px; border-radius: 3px; display: grid; place-items: center; font-size: 9px; font-weight: 600; }

/* ACTIVITY */
.au-activity { display: grid; grid-template-columns: 1fr 360px; gap: 24px; }
.au-activity-feed {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
}
.au-activity-feed .feed-head { padding: 14px 18px; background: var(--bg-2); border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em; }
.au-activity-row { display: grid; grid-template-columns: 28px 1fr auto; gap: 14px; align-items: start; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.au-activity-row:last-child { border-bottom: 0; }
.au-activity-row .pip { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); border: 1px solid var(--line); flex-shrink: 0; }
.au-activity-row .pip.publish { color: var(--accent); border-color: rgba(90,214,192,0.3); background: var(--accent-soft); }
.au-activity-row .pip.update { color: #5a9dd6; border-color: rgba(90,157,214,0.3); background: rgba(90,157,214,0.08); }
.au-activity-row .pip.fail { color: var(--bad); border-color: rgba(217,113,113,0.3); background: rgba(217,113,113,0.08); }
.au-activity-row .pip.deny { color: var(--warn); border-color: rgba(232,168,102,0.3); background: rgba(232,168,102,0.08); }
.au-activity-row .body { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
.au-activity-row .body .name { font-family: var(--mono); color: var(--ink); }
.au-activity-row .body .det { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.au-activity-row .when { font-family: var(--mono); font-size: 10.5px; color: var(--ink-4); white-space: nowrap; }

/* CHART (publishing cadence) */
.au-cadence { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; }
.au-cadence h4 { margin: 0 0 4px; font-size: 13px; font-weight: 500; }
.au-cadence .h4-sub { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.04em; margin-bottom: 16px; }
.au-cadence-grid { display: grid; grid-template-columns: repeat(26, 1fr); gap: 3px; }
.au-cadence-cell { aspect-ratio: 1; border-radius: 2px; background: var(--line); }
.au-cadence-legend { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10px; color: var(--ink-3); margin-top: 14px; }
.au-cadence-legend .scale { display: flex; gap: 2px; }
.au-cadence-legend .scale > div { width: 10px; height: 10px; border-radius: 2px; }

/* GATE TRACK */
.au-track {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 24px 28px;
}
.au-track-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }
.au-track-cell { padding: 14px 20px; border-right: 1px solid var(--line); }
.au-track-cell:last-child { border-right: 0; }
.au-track-cell .lbl { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; }
.au-track-cell .pct { font-size: 30px; font-weight: 500; letter-spacing: -0.02em; line-height: 1; color: var(--accent); }
.au-track-cell .pct.warn { color: var(--warn); }
.au-track-cell .pct.bad { color: var(--bad); }
.au-track-cell .pct .sub { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-left: 4px; font-weight: 400; }
.au-track-cell .det { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-top: 8px; line-height: 1.5; }

/* contributors */
.au-contrib-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.au-contrib {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 16px; display: flex; align-items: center; gap: 14px;
}
.au-contrib .av {
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
}
.au-contrib .col { flex: 1; min-width: 0; }
.au-contrib .name { font-size: 14px; color: var(--ink); }
.au-contrib .meta { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.au-contrib .stat { font-family: var(--mono); font-size: 11px; color: var(--accent); }
</style>
</head>
<body>

<script type="text/babel" src="docs-shell.jsx"></script>
<script type="text/babel">
const { useState, useMemo } = React;
const { Topbar, Icon } = window;

const SKILLS = [
  { name: "extract-pdf",   icon: "PD", v: "1.4.0", category: "files",        agents: ["cc","cx","cu","ah"], installs: "2.8k", desc: "Extract structured text from PDF files. Preserves headings, lists, and table layout.", flagship: true },
  { name: "summarize-doc", icon: "SD", v: "0.9.2", category: "text",         agents: ["cc","cx","cu","ah"], installs: "1.9k", desc: "Recursive multi-pass summarization with configurable depth.", flagship: true },
  { name: "github-issues", icon: "GH", v: "2.1.0", category: "integrations", agents: ["cc","cx","cu"],      installs: "1.4k", desc: "Read, search, and create GitHub issues. Scoped to authorized repos.", flagship: true },
  { name: "ocr-image",     icon: "OC", v: "1.2.1", category: "files",        agents: ["cc","cx","cu","ah"], installs: "1.1k", desc: "OCR an image to text. Wraps tesseract locally; never sends pixels off-device." },
  { name: "json-validate", icon: "JV", v: "1.2.0", category: "data",         agents: ["cc","cx","cu","ah"], installs: "1.0k", desc: "Validate JSON against a schema with structured error reporting." },
  { name: "parse-csv",     icon: "CV", v: "1.0.4", category: "files",        agents: ["cc","cx","cu","ah"], installs: "980",  desc: "Parse CSV with type inference and configurable dialects." },
  { name: "yaml-validate", icon: "YV", v: "0.9.0", category: "data",         agents: ["cc","cx","cu","ah"], installs: "840",  desc: "Validate YAML with auto-repair suggestions — same engine as the gate." },
  { name: "extract-table", icon: "TB", v: "0.7.0", category: "files",        agents: ["cc","cx"],            installs: "720",  desc: "Pull structured tables from HTML, PDF, and image sources into normalized rows." },
  { name: "diff-summarize",icon: "DS", v: "0.6.0", category: "code",         agents: ["cc","cx","cu","ah"], installs: "470",  desc: "Walk a diff and produce a structured summary of intent + risk per hunk." },
  { name: "git-blame",     icon: "GB", v: "1.1.0", category: "code",         agents: ["cc","cx","cu"],      installs: "540",  desc: "Annotate git blame across a repo with author + commit summary." },
  { name: "tf-plan-explain",icon:"TF", v: "0.4.0", category: "infra",        agents: ["cc","cx"],            installs: "220",  desc: "Read a terraform plan and produce a human-readable change summary." },
  { name: "regex-extract", icon: "RX", v: "1.5.0", category: "text",         agents: ["cc","cx","cu","ah"], installs: "1.5k", desc: "Test, refine, and run regex against sample text." },
  { name: "linear-tasks",  icon: "LN", v: "0.4.0", category: "integrations", agents: ["cc","cx"],            installs: "380",  desc: "Read and update Linear tasks scoped to a workspace." },
  { name: "slack-search",  icon: "SL", v: "0.3.1", category: "integrations", agents: ["cc","cx","cu"],      installs: "290",  desc: "Search a Slack workspace and return formatted thread context." },
];

const CATS = ["all", "files", "text", "data", "code", "integrations", "infra"];
const AGENT_COLORS = { cc: "#d6a85a", cx: "#5a9dd6", cu: "#b48ad6", ah: "#5ad6c0" };

const ACTIVITY = [
  { kind: "publish", name: "extract-pdf@1.4.0", det: "+--pages range support · 5/5 gate stages green", when: "2d" },
  { kind: "update", name: "extract-pdf@1.3.2", det: "patch: malformed cross-reference tables", when: "3w" },
  { kind: "publish", name: "yaml-validate@0.9.0", det: "initial release · same engine as the gate", when: "5w" },
  { kind: "deny", name: "experiment-skill@0.1.0", det: "rejected by gate stage 03 · capability mismatch (over-declared `exec`)", when: "6w" },
  { kind: "update", name: "github-issues@2.1.0", det: "minor: support enterprise.github.com hosts", when: "7w" },
  { kind: "publish", name: "extract-table@0.7.0", det: "initial release · pairs with extract-pdf", when: "9w" },
  { kind: "update", name: "summarize-doc@0.9.2", det: "patch: token budgeting on long docs", when: "10w" },
];

// Cadence — fake 26 weeks × 5 weekdays
const cadenceData = (() => {
  const seed = 13;
  const out = [];
  let s = seed;
  for (let i = 0; i < 26 * 5; i++) {
    s = (s * 9301 + 49297) % 233280;
    const r = s / 233280;
    const v = Math.floor(Math.pow(r, 2) * 5);
    out.push(v);
  }
  return out;
})();
const cadenceColor = (v) => {
  if (v <= 0) return "#1a242e";
  if (v === 1) return "rgba(90,214,192,0.18)";
  if (v === 2) return "rgba(90,214,192,0.35)";
  if (v === 3) return "rgba(90,214,192,0.6)";
  return "var(--accent)";
};

  const [cat, setCat] = useState("all");

  const filtered = useMemo(() => {
    if (cat === "all") return SKILLS;
    return SKILLS.filter(s => s.category === cat);
  }, [cat]);

  return (
    <>

              <div>
                <h1>autoworks-ai</h1>
                <div className="handle">@autoworks-ai · publisher</div>
                <span className="verify-badge"><Icon.Shield/> Verified author · since 2026-01-08</span>
              </div>
            </div>
            <p className="au-bio">Authors of <span className="ital" style={{ color: "var(--ink)" }}>AutoVault</span> and a handful of foundational skills for the agent ecosystem. Every skill we publish goes through the same gate as everyone else's — no special treatment, no skipped stages. The tooling we build for ourselves is the tooling we ship.</p>
            <div className="au-meta-row">
              <span className="item"><Icon.Github/> github.com/autoworks-ai</span>
              <span className="item">autovault.dev</span>
              <span className="item">San Francisco · Remote</span>
              <span className="item">3 maintainers</span>
            </div>
          </div>

          <div className="au-cert">
            <div className="cert-head">
              <Icon.Shield className="seal"/>
              <span>Identity certificate</span>
              <span className="id">CERT-7E10A2C8</span>
            </div>
            <div className="cert-row"><span className="k">Subject</span><span className="v">CN = autoworks-ai</span></div>
            <div className="cert-row"><span className="k">Algorithm</span><span className="v">Ed25519</span></div>
            <div className="cert-row"><span className="k">Public key</span><span className="v bigkey">0x9af4 2c81 7e7e c4f9 3a01 e10a 2c81 9af4 7e7e e10a 2c81 9af4 c4f9 3a01 e10a 2c81</span></div>
            <div className="cert-row"><span className="k">Anchor</span><span className="v accent">vault.autovault.dev (root)</span></div>
            <div className="cert-row"><span className="k">Issued</span><span className="v">2026-01-08</span></div>
            <div className="cert-row"><span className="k">Rotated</span><span className="v">2026-04-04 · 0 incidents</span></div>
            <div className="cert-actions">
              <button>Verify chain</button>
              <button>Pin key</button>
              <button>Export</button>
            </div>

        </div>

        <div className="au-stats">
          <div className="st"><div className="lbl">Skills published</div><div className="val">14</div><div className="trend">+2 this month</div></div>
          <div className="st"><div className="lbl">Total installs</div><div className="val">12.8<span className="unit">k</span></div><div className="trend">+1.6k this week</div></div>
          <div className="st"><div className="lbl">Gate pass rate</div><div className="val">96.4<span className="unit">%</span></div><div className="trend">81 of 84 submissions</div></div>
          <div className="st"><div className="lbl">Median bundle</div><div className="val">3.1<span className="unit">KB</span></div><div className="trend dim">75th: 5.4KB</div></div>
          <div className="st"><div className="lbl">Issue response</div><div className="val">14<span className="unit">h</span></div><div className="trend">median, last 90d</div></div>
        </div>

        <div className="au-section">
          <div className="eyebrow"><span className="dash"/> Body of work</div>
          <h2>Skills published by autoworks-ai</h2>
          <p className="sub">Every skill listed here has been signed with the certificate above, run through the public gate, and is mirrored to <code>cdn.autovault.dev</code>.</p>

          <div className="au-skills-toolbar">
            {CATS.map(c => (
              <button key={c} className={"filter-chip" + (cat === c ? " on" : "")} onClick={() => setCat(c)}>
                {c}
              </button>
            ))}
            <span className="ct">{filtered.length} of {SKILLS.length} skills</span>
          </div>

          <div className="au-skills-grid">
            {filtered.map(s => (
              <a key={s.name} href="skill-detail.html" className={"au-skill-tile" + (s.flagship ? " flagship" : "")}>
                <div className="row1">
                  <div className="icon-tile">{s.icon}</div>
                  <span className="name">{s.name}</span>
                  <span className="ver">v{s.v}</span>
                </div>
                <div className="desc">{s.desc}</div>
                <div className="row3">
                  <span className="install">{s.installs} installs</span>
                  <span style={{ flex: 1 }}/>
                  <div className="agents">
                    {["cc","cx","cu","ah"].map(a => (
                      <span key={a} className="a" style={{
                        background: s.agents.includes(a) ? AGENT_COLORS[a] : "var(--bg-2)",
                        color: s.agents.includes(a) ? "#0a0d11" : "var(--ink-4)",
                        border: "1px solid " + (s.agents.includes(a) ? AGENT_COLORS[a] : "var(--line)")
                      }}>{a}</span>
                    ))}
                  </div>
                </div>
              </a>
            ))}
          </div>
        </div>

        <div className="au-section">
          <div className="eyebrow"><span className="dash"/> Trust track record</div>
          <h2>What the gate has seen from this publisher</h2>
          <p className="sub">A verified author isn't a free pass. Every submission still runs the same five stages — and we publish the failure rate honestly. No publisher should ever look like 100%.</p>

          <div className="au-track">
            <div className="au-track-grid">
              <div className="au-track-cell">
                <div className="lbl">Submissions</div>
                <div className="pct" style={{ color: "var(--ink)" }}>84</div>
                <div className="det">across 14 skills · last 12 months</div>
              </div>
              <div className="au-track-cell">
                <div className="lbl">Passed clean</div>
                <div className="pct">81 <span className="sub">/ 96.4%</span></div>
                <div className="det">no repair, no flag, no dedup hit</div>
              </div>
              <div className="au-track-cell">
                <div className="lbl">Auto-repaired</div>
                <div className="pct warn">11 <span className="sub">/ 13.1%</span></div>
                <div className="det">YAML frontmatter fixes, mostly</div>
              </div>
              <div className="au-track-cell">
                <div className="lbl">Rejected</div>
                <div className="pct bad">3 <span className="sub">/ 3.6%</span></div>
                <div className="det">2 capability mismatch, 1 dedup</div>
              </div>
            </div>
          </div>
        </div>

        <div className="au-section">
          <div className="eyebrow"><span className="dash"/> Activity</div>
          <h2>What this publisher has been doing</h2>
          <p className="sub">A live feed of submissions, publishes, and gate verdicts — including the rejections. Activity is signed and append-only.</p>

          <div className="au-activity">
            <div className="au-activity-feed">
              <div className="feed-head">Last 12 weeks · 7 events</div>
              {ACTIVITY.map((a, i) => (
                <div key={i} className="au-activity-row">
                  <div className={"pip " + a.kind}>
                    {a.kind === "publish" && <Icon.Check/>}
                    {a.kind === "update" && <Icon.Arrow/>}
                    {a.kind === "deny" && <Icon.X/>}
                    {a.kind === "fail" && <Icon.X/>}
                  </div>
                  <div className="body">
                    <div>
                      {a.kind === "publish" && <>Published <span className="name">{a.name}</span></>}
                      {a.kind === "update" && <>Updated <span className="name">{a.name}</span></>}
                      {a.kind === "deny" && <>Gate rejected <span className="name">{a.name}</span></>}
                    </div>
                    <div className="det">{a.det}</div>
                  </div>
                  <span className="when">{a.when}</span>
                </div>
              ))}
            </div>

            <div className="au-cadence">
              <h4>Publishing cadence</h4>
              <div className="h4-sub">last 26 weeks · 130 events</div>
              <div className="au-cadence-grid">
                {cadenceData.map((v, i) => (
                  <div key={i} className="au-cadence-cell" style={{ background: cadenceColor(v) }}/>
                ))}
              </div>
              <div className="au-cadence-legend">
                <span>less</span>
                <div className="scale">
                  {[0,1,2,3,4].map(v => <div key={v} style={{ background: cadenceColor(v) }}/>)}
                </div>
                <span>more</span>
                <span style={{ marginLeft: "auto", color: "var(--ink-2)" }}>median: 4 / week</span>
              </div>
            </div>
          </div>
        </div>

        <div className="au-section">
          <div className="eyebrow"><span className="dash"/> Maintainers</div>
          <h2>Who's behind these skills</h2>
          <p className="sub">Each maintainer holds an individual signing key under the org root. Compromise of a personal key revokes only that maintainer's signatures — the org chain stays intact.</p>

          <div className="au-contrib-list">
            <div className="au-contrib">
              <div className="av" style={{ background: "linear-gradient(135deg, #5ad6c0, #5a9dd6)" }}/>
              <div className="col">
                <div className="name">elvissun</div>
                <div className="meta">key:0xC4F9…E10A · since 2026-01-08</div>
              </div>
              <div className="stat">412 commits</div>
            </div>
            <div className="au-contrib">
              <div className="av" style={{ background: "linear-gradient(135deg, #d6a85a, #b48ad6)" }}/>
              <div className="col">
                <div className="name">iris-d</div>
                <div className="meta">key:0xD6A8…5AB4 · since 2026-02-19</div>
              </div>
              <div className="stat">180 commits</div>
            </div>
            <div className="au-contrib">
              <div className="av" style={{ background: "linear-gradient(135deg, #b48ad6, #5ad6c0)" }}/>
              <div className="col">
                <div className="name">sky-w</div>
                <div className="meta">key:0xB48A…D6E2 · since 2026-03-04</div>
              </div>
              <div className="stat">94 commits</div>
            </div>
            <div className="au-contrib" style={{ borderStyle: "dashed", opacity: 0.7 }}>
              <div className="av" style={{ background: "var(--bg-2)", border: "1px dashed var(--line-2)" }}/>
              <div className="col">
                <div className="name" style={{ color: "var(--ink-3)" }}>Open seat</div>
                <div className="meta">contributing@autoworks-ai</div>
              </div>
              <div className="stat" style={{ color: "var(--ink-4)" }}>—</div>
            </div>
          </div>
        </div>
      </div>
    </>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
