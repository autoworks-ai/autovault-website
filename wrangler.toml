name = "autovault-website"
pages_build_output_dir = ".vitepress/dist"
compatibility_date = "2026-05-06"

[vars]
CLOUDFLARE_ACCOUNT_ID = "2cc725912d479c0bd6c08fc24931a478"
AUTOVAULT_INSTALLER_URL = "https://raw.githubusercontent.com/autoworks-ai/autovault/main/scripts/install.sh"
STRIPE_BRAND_DISPLAY_NAME = "AutoVault"
STRIPE_BRAND_BACKGROUND_COLOR = "#0b1014"
STRIPE_BRAND_BUTTON_COLOR = "#5ad6c0"
STRIPE_BRAND_BORDER_STYLE = "rounded"
STRIPE_BRAND_FONT_FAMILY = "inter"
STRIPE_BRAND_ICON_URL = "https://autovault.dev/square-1200x1200.png"
# Without this, Stripe falls back to the ACCOUNT logo — which belongs to
# Very Good Plugins, not AutoVault. Verified on a live test session.
STRIPE_BRAND_LOGO_URL = "https://autovault.dev/square-1200x1200.png"
STRIPE_CHECKOUT_SUBMIT_TYPE = "subscribe"
# Trial length in days. Read by buildHostedVaultCheckoutParams AND by
# /api/pricing, so the number on the page is the number Stripe is asked for.
# Set it to 0 or remove it to turn the trial off; the copy that mentions a
# trial renders off this value and disappears with it.
#
# No card is collected during the trial, because payment_method_collection is
# already "if_required" and Stripe reads a trial as nothing due now. The
# subscription arrives as status=trialing, which isPaidStatus already accepts,
# so a trialing customer reserves a namespace and pulls bundles normally.
AUTOVAULT_HOSTED_TRIAL_DAYS = "14"
# Rendered on the live Stripe Checkout page, so it is read at the moment money
# changes hands. It used to say AutoVault reserves the namespace "once Stripe
# confirms this subscription" -- true when provisioning happened on the Stripe
# return, and false now that reserving is a deliberate click afterwards. The
# check-then-claim race is accepted by design, so the name can even be gone by
# the time they click: this may promise the step, never the outcome.
# The second sentence used to say sync was disabled pending the CLI handoff.
# That handoff shipped in CLI v0.5.0, so the honest disclosure at the moment of
# payment is now the opposite one: sync works, publishing is still manual.
# The trial is deliberately absent from this string. applyCustomText prepends a
# sentence built from AUTOVAULT_HOSTED_TRIAL_DAYS, so the length quoted on the
# Checkout page is the length Stripe was actually sent, and setting the trial to
# 0 removes the sentence instead of leaving a stale one here.
STRIPE_CHECKOUT_CUSTOM_TEXT_SUBMIT = "You'll reserve your hosted namespace on the next screen, once Stripe confirms this subscription. Pairing a machine and pulling signed skills works today. Publishing your first catalog is still hands-on in private beta."

[[d1_databases]]
binding = "AUTOVAULT_DB"
database_name = "autovault-hosted"
database_id = "0223c717-ac9a-4fb1-bc5a-1be29ccd7faa"

[[kv_namespaces]]
binding = "AUTOVAULT_VAULT_OBJECTS"
id = "f483d8cf70724b0bb1c0d4628a6b4839"

# Paid hosted onboarding production requirements:
# - Clerk runtime secrets: CLERK_SECRET_KEY, VITE_CLERK_PUBLISHABLE_KEY
# - Clerk build variables: VITE_CLERK_PREVIEW_PUBLISHABLE_KEY (pk_test_...)
#   and VITE_CLERK_PRODUCTION_PUBLISHABLE_KEY (pk_live_...) feed the CI
#   workflow, which writes the app-facing VITE_CLERK_PUBLISHABLE_KEY before
#   VitePress builds static assets.
# - Stripe secrets: STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET
# - Stripe price: AUTOVAULT_HOSTED_PRICE_ID
# - D1 binding AUTOVAULT_DB migrated with migrations/0001_hosted_vault.sql
# - KV binding AUTOVAULT_VAULT_OBJECTS for pending browser drafts and small vault artifacts
#
# Legacy GitHub/Google OAuth variables are optional fallback auth paths, not
# required for the Clerk + Stripe paid onboarding funnel.
