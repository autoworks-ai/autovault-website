name: Deploy to Cloudflare Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: false

permissions:
  contents: read
  deployments: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

concurrency:
  group: pages-${{ github.event.workflow_run.head_branch || inputs.branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      ${{
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push') ||
        github.event_name == 'workflow_dispatch'
      }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch || inputs.branch || github.ref_name }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run docs:build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy .vitepress/dist
            --project-name autovault-website
            --branch "${{ env.DEPLOY_BRANCH }}"
            --commit-hash "${{ env.DEPLOY_SHA }}"
