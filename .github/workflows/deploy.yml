name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: false
        default: main

permissions:
  contents: read
  deployments: write

env:
  NODE_VERSION: "24"
  PAGES_PROJECT_NAME: autovault-website
  WRANGLER_VERSION: "4.95.0"

concurrency:
  group: pages-manual-${{ inputs.branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_BRANCH: ${{ inputs.branch || github.ref_name }}
      CLERK_DEPLOY_TARGET: production
      VITE_CLERK_PRODUCTION_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PRODUCTION_PUBLISHABLE_KEY || secrets.VITE_CLERK_PRODUCTION_PUBLISHABLE_KEY }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PRODUCTION_PUBLISHABLE_KEY || secrets.VITE_CLERK_PRODUCTION_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - name: Resolve deploy SHA
        id: deploy_ref
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - name: Verify Clerk build configuration
        run: node scripts/verify-clerk-production-key.mjs production
      - run: npm run typecheck
      - run: npm test
      - run: npm run pages:functions:build
      - name: Build docs
        run: npm run docs:build
      - name: Scan Clerk production assets
        run: node scripts/scan-clerk-production-dist.mjs .vitepress/dist

      # Migrations are not applied by any other step. Deploying Functions that
      # depend on a new migration before the schema exists in production makes
      # every request touching that path 500 until someone notices and runs
      # this manually. Applying it here, before the Pages deploy, closes that
      # window on every break-glass deploy too.
      #
      # This dispatcher accepts an arbitrary `branch` input and, unlike the
      # PR-preview job in ci.yml, never swaps wrangler.toml to a preview D1
      # binding — its D1 binding is ALWAYS the production database. Gate on
      # DEPLOY_BRANCH so a manual deploy of a feature branch (which lands on a
      # non-production Pages URL) cannot apply that branch's unreviewed
      # migration to production data.
      - name: Apply pending D1 migrations
        if: env.DEPLOY_BRANCH == 'main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run migrate:remote

      - name: Deploy to Cloudflare Pages
        id: pages_deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy .vitepress/dist
            --project-name "${{ env.PAGES_PROJECT_NAME }}"
            --branch "${{ env.DEPLOY_BRANCH }}"
            --commit-hash "${{ steps.deploy_ref.outputs.sha }}"

      - name: Verify production Clerk Frontend API
        env:
          DEPLOYMENT_URL: ${{ steps.pages_deploy.outputs['deployment-url'] }}
        run: |
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "Cloudflare Pages deploy did not return deployment-url." >&2
            exit 1
          fi
          node scripts/scan-clerk-production-url.mjs "${DEPLOYMENT_URL%/}/cloud" --verify-fapi
