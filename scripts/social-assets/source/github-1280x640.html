<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AutoVault · GitHub social 1280×640</title>
<link rel="stylesheet" href="_shared.css">
<style>
  body { display: flex; align-items: center; justify-content: center; }
  .canvas { width: 1280px; height: 640px; }

  .frame {
    position: absolute; inset: 0;
    padding: 64px 80px;
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    gap: 64px;
    align-items: center;
  }

  /* — Left: brand + tagline — */
  .left { position: relative; z-index: 2; }
  .eyebrow { margin-bottom: 28px; }

  .brand {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-bottom: 36px;
  }
  .brand .mark { width: 88px; height: 88px; }
  .brand .name {
    font-family: var(--sans);
    font-weight: 500;
    font-size: 64px;
    letter-spacing: -0.04em;
    line-height: 1;
    color: var(--ink);
  }

  .tag-h {
    font-family: var(--sans);
    font-weight: 500;
    font-size: 56px;
    line-height: 1.04;
    letter-spacing: -0.035em;
    color: var(--ink);
    max-width: 540px;
    text-wrap: pretty;
  }
  .tag-h .ital { font-size: 60px; }

  .meta-row {
    margin-top: 36px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  /* — Right: gate pipeline column — */
  .right {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: stretch;
    justify-self: end;
    width: 100%;
    max-width: 460px;
  }

  .gstep { padding: 12px 16px 12px 12px; font-size: 11.5px; }
  .gstep .num { width: 26px; height: 26px; font-size: 11px; }
  .gstep .ttl { letter-spacing: 0.06em; }
  .gstep .meta {
    margin-left: auto;
    color: var(--ink-3);
    font-size: 10.5px;
    font-weight: 500;
  }
  .gstep.active .meta { color: var(--accent); }
  .gstep.passed .meta { color: var(--ink-2); }

  /* corner registration: single hairline strip top + bottom */
  .corner-mono {
    position: absolute;
    bottom: 28px;
    left: 80px;
    right: 80px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 2;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="grid-backdrop"></div>
  <div class="mint-halo"></div>

  <div class="hair-top"></div>
  <div class="hair-bottom"></div>

  <div class="frame">
    <!-- LEFT — brand + tagline -->
    <div class="left">
      <div class="eyebrow mono-label"><span class="dash"></span>Local-first skill vault</div>

      <div class="brand">
        <svg class="mark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2.4" y="2.4" width="19.2" height="16.8" rx="3.84" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M7.2 19.2v1.9" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M16.8 19.2v1.9" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="12" cy="10.8" r="2.9" stroke-width="1.2"/>
          <path d="M12 7.9v1.45" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        <div class="name">AutoVault</div>
      </div>

      <div class="tag-h">
        Skills enter dirty.<br>
        They leave <span class="ital">signed.</span>
      </div>

      <div class="meta-row">
        <span class="tag mint">✓ Validated</span>
        <span class="tag">Scoped</span>
        <span class="tag">Signed</span>
        <span class="tag ghost">MIT</span>
      </div>
    </div>

    <!-- RIGHT — gate pipeline -->
    <div class="right">
      <div class="gstep passed">
        <span class="num">01</span>
        <span class="ttl">Untrusted</span>
        <span class="meta">queued · 0ms</span>
      </div>
      <div class="gstep passed">
        <span class="num">02</span>
        <span class="ttl">Yaml-repair</span>
        <span class="meta">passed · 12ms</span>
      </div>
      <div class="gstep passed">
        <span class="num">03</span>
        <span class="ttl">Static scan</span>
        <span class="meta">passed · 184ms</span>
      </div>
      <div class="gstep active">
        <span class="num">04</span>
        <span class="ttl">Permissions</span>
        <span class="meta">scoping…</span>
      </div>
      <div class="gstep">
        <span class="num">05</span>
        <span class="ttl">Sign &amp; seal</span>
        <span class="meta">queued</span>
      </div>
    </div>
  </div>

  <div class="corner-mono">
    <div class="mono-label"><span class="dot-live"></span>pre-1.0 · local gate · signed outputs</div>
    <div class="mono-label">autovault.dev</div>
  </div>
</div>
</body>
</html>
